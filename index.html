/* ============ state load / persist ============ */
function clone(o){ return JSON.parse(JSON.stringify(o)); }
function uid(p){ return p+'-'+Math.random().toString(36).slice(2,9); }

var state = null;
var publishTimer = null;
var saveStatus = 'idle';

async function loadStateFromDB(){
  var s = null;
  try{
    var result = await supabaseClient.rpc('get_full_state');
    if(result.error) throw result.error;
    s = result.data;
  }catch(e){ console.error('Ошибка загрузки:', e); }

  if(!s || Object.keys(s).length===0) s = clone(DEFAULT_STATE);
  /* forward-compat: fill in fields introduced after this state was first saved */
  if(!s.ui) s.ui = clone(DEFAULT_STATE.ui);
  if(s.ui.selectedYear===undefined) s.ui.selectedYear = null;
  if(!s.ui.openWdYears) s.ui.openWdYears = {};
  if(!s.ndfl) s.ndfl = clone(DEFAULT_STATE.ndfl);
  (s.goals||[]).forEach(function(g){ if(!g.subgoals) g.subgoals=[]; });
  (s.periods||[]).forEach(function(p){ if(p.locked===undefined) p.locked=false; if(!p.extraIncomes) p.extraIncomes=[]; });
  state = s;
}

function scheduleSave(){
  render();
  clearTimeout(publishTimer);
  saveStatus = 'pending';
  publishTimer = setTimeout(doPublish, 500);
}
async function doPublish(){
  try{
    var result = await supabaseClient.rpc('save_full_state', { p_state: state });
    if(result.error) throw result.error;
    saveStatus = 'saved';
  }catch(e){
    saveStatus = 'error';
  }
  updateSaveBadge();
}
function updateSaveBadge(){
  var b = document.getElementById('save-badge');
  if(!b) return;
  var map = { idle:'', pending:'Сохранение…', saved:'Сохранено', local:'Локально (не опубликовано)', error:'Ошибка сохранения' };
  b.textContent = map[saveStatus] || '';
}

/* ============ date / calendar helpers ============ */
function pad2(n){ return (n<10?'0':'')+n; }
function isoDate(y,m,d){ return y+'-'+pad2(m)+'-'+pad2(d); }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function dowUTC(y,m,d){ return new Date(Date.UTC(y,m-1,d)).getUTCDay(); }
function isWorkingDay(y,m,d,holidaySet){
  var dow = dowUTC(y,m,d);
  if(dow===0||dow===6) return false;
  if(holidaySet.has(isoDate(y,m,d))) return false;
  return true;
}
function workingDaysInHalf(y,m,half,st){
  var holidaySet = new Set(st.meta.holidays);
  var dim = daysInMonth(y,m);
  var start = half==='first'?1:16;
  var end = half==='first'?15:dim;
  var c=0;
  for(var d=start; d<=end; d++){ if(isWorkingDay(y,m,d,holidaySet)) c++; }
  return c;
}
function workingDaysInMonth(y,m,st){ return workingDaysInHalf(y,m,'first',st)+workingDaysInHalf(y,m,'second',st); }
function calendarDaysInclusive(startISO,endISO){
  var s=new Date(startISO+'T00:00:00Z'), e=new Date(endISO+'T00:00:00Z');
  return Math.round((e-s)/86400000)+1;
}
function todayISO(){
  var d = new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}

/* ============ seasonal categories (MM-DD ranges, wrap around new year) ============ */
function parseDM(str){
  var m = String(str||'').trim().match(/^(\d{1,2})[.\-\/](\d{1,2})$/);
  if(!m) return null;
  var d=parseInt(m[1],10), mo=parseInt(m[2],10);
  if(d<1||d>31||mo<1||mo>12) return null;
  return pad2(mo)+'-'+pad2(d);
}
function formatDM(md){
  if(!md) return '';
  var parts = String(md).split('-');
  if(parts.length<2) return '';
  return parts[1]+'.'+parts[0];
}
function inSeason(dateISO, season){
  if(!season || !season.from || !season.to) return true;
  var md = dateISO.slice(5,10);
  if(season.from<=season.to) return md>=season.from && md<=season.to;
  return md>=season.from || md<=season.to;
}

/* ============ multi-year planning ============ */
function planYears(st){
  var seen = {}, out = [];
  st.periods.forEach(function(p){ if(!seen[p.monthRef.y]){ seen[p.monthRef.y]=true; out.push(p.monthRef.y); } });
  out.sort(function(a,b){return a-b;});
  return out;
}
function currentYear(st){
  var years = planYears(st);
  if(!years.length) return null;
  if(st.ui.selectedYear!=null && years.indexOf(st.ui.selectedYear)!==-1) return st.ui.selectedYear;
  var todayY = parseInt(todayISO().slice(0,4),10);
  return years.indexOf(todayY)!==-1 ? todayY : years[0];
}
function yearTabsNav(st){
  var years = planYears(st);
  if(years.length<=1) return '';
  var active = currentYear(st);
  return '<div class="row wrap" style="gap:4px;margin-bottom:12px;">' + years.map(function(y){
    return '<button class="small'+(y===active?' primary':'')+'" data-select-year="'+y+'">'+y+'</button>';
  }).join('') + '</div>';
}
function planYearsLabel(st){
  var ys = planYears(st);
  if(!ys.length) return '';
  return ys.length===1 ? String(ys[0]) : ys[0]+'–'+ys[ys.length-1];
}
function generateYearPeriods(year, st){
  var out=[];
  for(var m=1;m<=12;m++){
    var avansDate = isoDate(year,m,20);
    var avansP = {id:uid('p'), date:avansDate, label:pad2(20)+'.'+pad2(m), type:'avans', half:'first', monthRef:{y:year,m:m}, calc:'auto', incomeActual:0, assignedVacations:[], locked:false};
    avansP.incomeActual = calcPeriodIncomeFormula(avansP, st) || 0;
    out.push(avansP);
    var zpY = m===12?year+1:year, zpM = m===12?1:m+1;
    var zpDate = isoDate(zpY,zpM,5);
    var zpP = {id:uid('p'), date:zpDate, label:pad2(5)+'.'+pad2(zpM), type:'zp', half:'second', monthRef:{y:year,m:m}, calc:'auto', incomeActual:0, assignedVacations:[], locked:false};
    zpP.incomeActual = calcPeriodIncomeFormula(zpP, st) || 0;
    out.push(zpP);
  }
  out.sort(function(a,b){return a.date<b.date?-1:1;});
  return out;
}
function ensurePastPeriodsLocked(st){
  var today = todayISO();
  var toLock = st.periods.filter(function(p){ return !p.locked && p.date < today; });
  if(!toLock.length) return false;
  var sim = simulate(st);
  var byId = {}; sim.rows.forEach(function(r){ byId[r.period.id]=r; });
  toLock.forEach(function(p){
    var r = byId[p.id];
    if(r){
      if(!st.savingsOverrides[p.id]) st.savingsOverrides[p.id] = {};
      Object.keys(r.allocations).forEach(function(gid){ st.savingsOverrides[p.id][gid] = Math.round(r.allocations[gid]); });
    }
    p.locked = true;
  });
  return true;
}

/* ============ salary ============ */
function okladForDate(dateISO, st){
  var hist = st.oklad.history.slice().sort(function(a,b){ return a.effectiveFrom<b.effectiveFrom?-1:1; });
  var val = hist.length?hist[0].amount:0;
  for(var i=0;i<hist.length;i++){ if(hist[i].effectiveFrom<=dateISO) val=hist[i].amount; }
  return val;
}
function calcPeriodIncomeFormula(period, st){
  if(period.calc==='manual') return null;
  var y=period.monthRef.y, m=period.monthRef.m;
  var totalWD = workingDaysInMonth(y,m,st);
  if(totalWD<=0) return null;
  var halfWD = workingDaysInHalf(y,m,period.half,st);
  var oklad = okladForDate(period.date, st);
  return Math.round(oklad*halfWD/totalWD);
}

/* ============ НДФЛ (прогрессивная шкала, оклад в настройках вводится gross) ============ */
function ndflBracketTop(b){ return (b.upTo===null || b.upTo===undefined) ? Infinity : b.upTo; }
function ndflOwedOnCumulative(cum, brackets){
  var sorted = brackets.slice().sort(function(a,b){ return ndflBracketTop(a)-ndflBracketTop(b); });
  var tax=0, prev=0;
  for(var i=0;i<sorted.length;i++){
    var top = ndflBracketTop(sorted[i]);
    if(cum>prev){
      var slice = Math.min(cum, top)-prev;
      tax += slice*sorted[i].rate;
      prev = top;
    } else break;
  }
  return tax;
}
function netFromGross(grossAmount, cumGrossBefore, brackets){
  var cumAfter = cumGrossBefore+grossAmount;
  var taxBefore = ndflOwedOnCumulative(cumGrossBefore, brackets);
  var taxAfter = ndflOwedOnCumulative(cumAfter, brackets);
  var tax = Math.round(taxAfter-taxBefore);
  return { gross: grossAmount, tax: tax, net: grossAmount-tax, cumGrossAfter: cumAfter };
}
function estimateMonthlyNet(grossMonthly, brackets){
  var annualTax = ndflOwedOnCumulative(grossMonthly*12, brackets);
  return Math.round(grossMonthly - annualTax/12);
}
function computeSalaryNetPlan(st){
  var periods = st.periods.slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  var cum = 0, byPeriod = {};
  periods.forEach(function(p){
    var gross = calcPeriodIncomeFormula(p, st);
    if(gross==null){ byPeriod[p.id]=null; return; }
    var r = netFromGross(gross, cum, st.ndfl.brackets);
    cum = r.cumGrossAfter;
    byPeriod[p.id] = r;
  });
  return byPeriod;
}

/* ============ vacation pay ============ */
function monthsBefore(y,m,count){
  var arr=[], yy=y, mm=m;
  for(var i=0;i<count;i++){ mm--; if(mm===0){ mm=12; yy--; } arr.unshift({y:yy,m:mm}); }
  return arr;
}
function monthlyIncomeFor(y,m,st){
  if(y===2026 && m>=1 && m<=12) return st.income2026[m-1]||0;
  var sum=0, found=false;
  st.periods.forEach(function(p){ if(p.monthRef.y===y && p.monthRef.m===m){ sum+=p.incomeActual||0; found=true; } });
  return found?sum:0;
}
function sickDaysInMonth(y,m,st){
  var dim=daysInMonth(y,m);
  var start=new Date(Date.UTC(y,m-1,1)), end=new Date(Date.UTC(y,m-1,dim));
  var days=0;
  (st.sickLeaves||[]).forEach(function(sl){
    if(!sl.start||!sl.end) return;
    var s=new Date(sl.start+'T00:00:00Z'), e=new Date(sl.end+'T00:00:00Z');
    var os=s>start?s:start, oe=e<end?e:end;
    if(os<=oe) days += Math.round((oe-os)/86400000)+1;
  });
  return Math.min(days,dim);
}
function raiseIndexFactor(y,m,vacationStartISO,st){
  var hist = st.oklad.history.slice().sort(function(a,b){ return a.effectiveFrom<b.effectiveFrom?-1:1; });
  var monthEndISO = isoDate(y,m,daysInMonth(y,m));
  var rateAtMonth = hist.length?hist[0].amount:0;
  hist.forEach(function(h){ if(h.effectiveFrom<=monthEndISO) rateAtMonth=h.amount; });
  var rateAtVacation = hist.length?hist[0].amount:0;
  hist.forEach(function(h){ if(h.effectiveFrom<=vacationStartISO) rateAtVacation=h.amount; });
  if(rateAtMonth>0 && rateAtVacation>rateAtMonth) return rateAtVacation/rateAtMonth;
  return 1;
}
function avgDailyEarnings(vacationStartISO, st){
  var y=parseInt(vacationStartISO.slice(0,4),10), m=parseInt(vacationStartISO.slice(5,7),10);
  var months = monthsBefore(y,m,12);
  var totalIncome=0, totalCoeff=0;
  months.forEach(function(mo){
    var inc = monthlyIncomeFor(mo.y,mo.m,st);
    inc = inc*raiseIndexFactor(mo.y,mo.m,vacationStartISO,st);
    var sick = sickDaysInMonth(mo.y,mo.m,st);
    var dim = daysInMonth(mo.y,mo.m);
    var coeff = sick>0 ? (29.3/dim)*(dim-sick) : 29.3;
    totalIncome+=inc; totalCoeff+=coeff;
  });
  if(totalCoeff<=0) return 0;
  return totalIncome/totalCoeff;
}
function calcVacationPayFormula(vac, st){
  if(!vac.start||!vac.end) return null;
  var avg = avgDailyEarnings(vac.start, st);
  var days = calendarDaysInclusive(vac.start, vac.end);
  return Math.round(avg*days);
}
function vacationPayForPeriod(period, st){
  var total=0;
  (period.assignedVacations||[]).forEach(function(a){
    var vac = st.vacations.find(function(v){ return v.id===a.id; });
    if(vac) total += Math.round((vac.manualPay||0)*(a.share!=null?a.share:1));
  });
  return total;
}

/* ============ categories (with optional seasonal date-range restriction) ============ */
function categoryPlannedTotalForDate(cat, dateISO){
  if(cat.season && dateISO && !inSeason(dateISO, cat.season)) return 0;
  if(cat.items && cat.items.length){
    return cat.items.reduce(function(s,it){
      if(it.season && dateISO && !inSeason(dateISO, it.season)) return s;
      return s+(it.amount||0);
    },0);
  }
  return cat.amount||0;
}
function categoryPlannedTotal(cat){
  return categoryPlannedTotalForDate(cat, null);
}
function categoriesTemplateTotal(st){
  return st.categories.reduce(function(s,c){ return s+categoryPlannedTotal(c); },0);
}
function categoriesTotalForPeriod(period, st){
  var ov = st.categoryOverrides[period.id];
  var total=0;
  st.categories.forEach(function(c){
    var planned = categoryPlannedTotalForDate(c, period.date);
    total += (ov && ov[c.id]!==undefined) ? ov[c.id] : planned;
  });
  return total;
}

/* ============ savings milestones (подцели) ============
   Each milestone is an INCREMENTAL amount: reaching it consumes that much fresh savings,
   then the next milestone starts counting from zero again (a later withdrawal never
   "gives back" progress already credited toward an earlier, already-achieved milestone —
   this is what lets the goal's overall target equal the sum of its milestones). */
function goalMilestones(g){
  if(g.subgoals && g.subgoals.length) return g.subgoals;
  return [ { id:'_main', target: g.target, deadline: g.deadline } ];
}
function goalFinalTarget(g){
  var ms = goalMilestones(g);
  return ms.reduce(function(s,m){ return s+(m.target||0); },0);
}
/* How much of the goal's cumulative target has been earned so far: the sum of every
   fully-completed milestone's target, plus progress within the current (incomplete) one.
   This is what the progress bar compares against goalFinalTarget — it only ever grows,
   so it reaches 100% exactly when every milestone has been funded, and stays there even
   after the money is later withdrawn/spent. */
function goalCumulativeProgress(g, sim){
  var ms = goalMilestones(g);
  var idx = (sim.finalPhaseIdx && sim.finalPhaseIdx[g.id]) || 0;
  var sum = 0;
  for(var i=0;i<idx && i<ms.length;i++) sum += ms[i].target||0;
  if(idx < ms.length) sum += (sim.finalPhaseSaved && sim.finalPhaseSaved[g.id]) || 0;
  return sum;
}
function achievedDateLabel(date, prefix, prefixPre){
  if(date==='pre') return prefixPre;
  return prefix+ruDate(date);
}
function milestoneAchievements(g, sim){
  var ms = goalMilestones(g);
  var dates = (sim.milestoneDates && sim.milestoneDates[g.id]) || ms.map(function(){ return null; });
  return ms.map(function(m,i){ return { milestone:m, achievedDate: dates[i]!==undefined?dates[i]:null }; });
}
function milestoneStatusPill(m, achievedDate){
  if(achievedDate){
    if(achievedDate==='pre') return { label:'Уже накоплено', cls:'ok' };
    if(!m.deadline) return { label:'Прогноз: к '+ruDate(achievedDate), cls:'ok' };
    return achievedDate<=m.deadline ? { label:'В графике (к '+ruDate(achievedDate)+')', cls:'ok' } : { label:'Позже срока (к '+ruDate(achievedDate)+')', cls:'warn' };
  }
  if(!m.deadline) return { label:'Не достигается в 2027 году', cls:'danger' };
  return { label:'Не достигается к '+ruDate(m.deadline), cls:'danger' };
}
function goalOverallStatus(g, sim){
  if(g.completed) return { label:'Выполнена', cls:'ok' };
  var ms = goalMilestones(g);
  var idx = (sim.finalPhaseIdx && sim.finalPhaseIdx[g.id]) || 0;
  if(idx>=ms.length) return { label:'Цель достигнута', cls:'ok' };
  return { label:'В работе', cls:'warn' };
}

/* ============ simulation / waterfall ============ */
function simulate(st){
  var periods = st.periods.slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  var goalSaved = {};
  st.goals.forEach(function(g){ goalSaved[g.id]=g.startingBalance||0; });

  /* phase tracking: per goal, which milestone is currently active and how much has been
     credited toward it since it started (see comment above goalMilestones). */
  var phaseIdx={}, phaseSaved={}, milestoneDates={}, msByGoal={};
  st.goals.forEach(function(g){
    var ms = goalMilestones(g);
    msByGoal[g.id]=ms;
    milestoneDates[g.id]=ms.map(function(){ return null; });
    phaseIdx[g.id]=0;
    phaseSaved[g.id]=g.startingBalance||0;
    while(phaseIdx[g.id]<ms.length && phaseSaved[g.id] >= ms[phaseIdx[g.id]].target-1e-9){
      phaseSaved[g.id]-=ms[phaseIdx[g.id]].target;
      milestoneDates[g.id][phaseIdx[g.id]]='pre';
      phaseIdx[g.id]++;
    }
  });
  function depositToGoal(gid, amount, dateISO){
    if(!amount) return;
    var ms = msByGoal[gid];
    if(!ms) return;
    goalSaved[gid]=(goalSaved[gid]||0)+amount;
    phaseSaved[gid]=(phaseSaved[gid]||0)+amount;
    while(phaseIdx[gid]<ms.length && phaseSaved[gid] >= ms[phaseIdx[gid]].target-1e-9){
      phaseSaved[gid]-=ms[phaseIdx[gid]].target;
      milestoneDates[gid][phaseIdx[gid]]=dateISO;
      phaseIdx[gid]++;
    }
  }

  var rows=[];
  periods.forEach(function(p){
    var salary = p.incomeActual||0;
    var vac = vacationPayForPeriod(p, st);
    /* manual/ad-hoc income (bonus, gift, etc): the full amount joins totalIncome, while the
       portion marked expensesPct% is folded into this period's expenses so it doesn't flow
       into the savings waterfall — the remaining (100-expensesPct)% stays part of "free" and
       gets allocated to goals exactly like any other free cash. */
    var extraTotal = 0, extraExpensePortion = 0;
    (p.extraIncomes||[]).forEach(function(e){
      var amt = e.amount||0;
      var pct = e.expensesPct!=null ? e.expensesPct : 0;
      extraTotal += amt;
      extraExpensePortion += amt*pct/100;
    });
    var totalIncome = salary+vac+extraTotal;
    var expenses = categoriesTotalForPeriod(p, st) + extraExpensePortion;
    st.goals.forEach(function(g){
      (g.withdrawals||[]).forEach(function(w){ if(w.date===p.date) goalSaved[g.id]-=w.amount; });
    });
    var free = totalIncome - expenses;
    var allocations = {};
    var override = st.savingsOverrides[p.id];
    /* a locked period never falls through to auto-calc, even if its frozen override is an
       empty object (i.e. "nothing was allocated, and that's the fixed historical fact") */
    if(p.locked || (override && Object.keys(override).length)){
      Object.keys(override||{}).forEach(function(gid){
        var amt = override[gid]||0;
        allocations[gid]=amt; depositToGoal(gid, amt, p.date); free-=amt;
      });
    } else if(free>0){
      var active = st.goals.filter(function(g){ return !g.completed; }).slice().sort(function(a,b){ return a.priority-b.priority; });
      var reqs = active.map(function(g){
        var ms = msByGoal[g.id], idx = phaseIdx[g.id];
        if(idx>=ms.length) return { g:g, remaining:0, per:0, overdue:false, deadline:'' };
        var remaining = Math.max(0, ms[idx].target-phaseSaved[g.id]);
        /* Look past the current milestone if IT has no deadline of its own, to find the nearest
           deadline the goal is really working toward. A goal is funded strictly in order (you
           can't reach "Ира ДР" before "Вика ДР" is paid off), so if an un-dated milestone like
           "Вика ДР" happens to be the one currently active, the OLD code saw no deadline at all
           for the whole goal — even though the very next milestone in the same queue ("Ира ДР")
           has a real, looming deadline. That made the goal look completely unhurried and it lost
           every round to goals with SOME deadline, however distant, so it went unfunded for
           months until "Ира ДР"'s own deadline had already passed. Scanning forward past every
           un-dated milestone to the next dated one (accumulating what each of them still needs
           along the way) gives the goal its true urgency back, while money still lands in the
           current milestone first and only spills into the next one once it's full (depositToGoal
           does that automatically) — so nothing about the funding ORDER within the goal changes,
           only how urgently the goal competes for money against every OTHER goal right now. */
        var lookIdx = idx, combinedNeed = remaining, governingDeadline = ms[idx].deadline || '';
        while(!governingDeadline && lookIdx+1 < ms.length){
          lookIdx++;
          combinedNeed += ms[lookIdx].target||0;
          governingDeadline = ms[lookIdx].deadline || '';
        }
        var periodsLeft = governingDeadline ? periods.filter(function(pp){ return pp.date>=p.date && pp.date<=governingDeadline; }).length : 0;
        var overdue = !!(governingDeadline && governingDeadline < p.date && combinedNeed>0);
        var per = combinedNeed<=0 ? 0 : (governingDeadline ? ((overdue||periodsLeft<=0) ? combinedNeed : combinedNeed/periodsLeft) : 0);
        return { g:g, remaining:remaining, per:per, overdue:overdue, deadline: governingDeadline };
      });
      /* Money goes to whichever goal's CURRENT milestone (subgoal, or the goal itself when it
         has none) has the nearest deadline right now — true earliest-deadline-first — not
         strictly by priority and not by raw required-per-period amount. Sorting by amount alone
         (an earlier version of this code) let one large, moderately-urgent milestone (e.g. a
         315 000 trip due in a few months) permanently out-rank a tiny but much more imminent one
         (e.g. a 3 000 birthday gift due next week), because the big milestone's per-period pace
         is simply bigger in absolute rubles even though it has far more slack. Sorting by the
         deadline itself fixes that: whichever milestone is due soonest is funded first, however
         small, and once it's done the next-soonest (which may belong to the same goal or a
         different one) takes over — so "Подарки"'s small early birthdays get filled first, then
         money temporarily flows past it to "Путешествия"/"Оплата зала" until its own next
         birthday's deadline is nearer again. A higher-priority goal is still protected: as its
         own deadline gets closer than everything else competing for the same money, it moves to
         the front of this same sort automatically. Priority only breaks ties — equal deadlines,
         or goals with no deadline at all (those always sort after every dated one). */
      var urgencyOrder = reqs.slice().sort(function(a,b){
        var ka = a.deadline || '9999-99-99', kb = b.deadline || '9999-99-99';
        if(ka!==kb) return ka<kb?-1:1;
        return a.g.priority-b.g.priority;
      });
      urgencyOrder.forEach(function(r){
        if(free<=0) return;
        var give = Math.min(r.per, free, r.remaining);
        if(give>0.0001){ allocations[r.g.id]=(allocations[r.g.id]||0)+give; depositToGoal(r.g.id, give, p.date); free-=give; }
      });
      /* leftover cash cascades down the same urgency order, but each goal is capped at what its
         active milestone still needs — once a goal's target is met it is skipped, so money
         no longer keeps piling into it past 100% (this was the "95 000 / 60 000" bug). */
      if(free>0.5 && urgencyOrder.length){
        for(var i=0;i<urgencyOrder.length && free>0.5;i++){
          var g = urgencyOrder[i].g, ms = msByGoal[g.id], idx = phaseIdx[g.id];
          if(idx>=ms.length) continue;
          var remaining = Math.max(0, ms[idx].target-phaseSaved[g.id]);
          if(remaining<=0) continue;
          var give = Math.min(remaining, free);
          if(give>0.0001){ allocations[g.id]=(allocations[g.id]||0)+give; depositToGoal(g.id, give, p.date); free-=give; }
        }
      }
    }
    rows.push({ period:p, salary:salary, vacationPay:vac, totalIncome:totalIncome, expenses:expenses,
      free: totalIncome-expenses, unallocated: free, allocations: allocations, goalSnapshot: clone(goalSaved) });
  });
  return { rows: rows, finalGoalSaved: goalSaved, milestoneDates: milestoneDates, finalPhaseIdx: phaseIdx, finalPhaseSaved: phaseSaved };
}

/* ============ formatting ============ */
function fmt(n){ n=Math.round(n||0); return n.toLocaleString('ru-RU')+' ₽'; }
function fmtSigned(n){ n=Math.round(n||0); return (n>=0?'+':'')+fmt(n); }
function parseNum(v){ var n=parseFloat(String(v).replace(/[^\d.-]/g,'')); return isNaN(n)?0:Math.round(n); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ruDate(iso){
  if(!iso) return '';
  var parts = iso.split('-'); if(parts.length<3) return iso;
  return parts[2]+'.'+parts[1]+'.'+parts[0];
}

/* ============ UI state (persisted inside state.ui so a republish-triggered reload keeps your place) ============ */
var ui;

/* ============ render ============ */
var root;
function render(){
  if(!root) root = document.getElementById('root');
  if(ensurePastPeriodsLocked(state)){
    clearTimeout(publishTimer); saveStatus='pending'; publishTimer=setTimeout(doPublish,500);
  }
  var sim = simulate(state);
  var body = '';
  if(ui.tab==='dashboard') body = renderDashboard(sim);
  else if(ui.tab==='periods') body = renderPeriods(sim);
  else if(ui.tab==='categories') body = renderCategories(sim);
  else if(ui.tab==='goals') body = renderGoals(sim);
  else if(ui.tab==='settings') body = renderSettings(sim);
  root.innerHTML =
    '<div class="topbar"><div class="topbar-inner">'
    + '<div class="brand"><h1 style="font-size:19px;">Финансы</h1><span class="badge-year">'+esc(planYearsLabel(state))+'</span></div>'
    + '<span class="savebadge" id="save-badge"></span>'
    + '</div>'
    + '<nav class="tabs">'
    + tabBtn('dashboard','Обзор') + tabBtn('periods','Доходы') + tabBtn('categories','Категории') + tabBtn('goals','Накопления') + tabBtn('settings','Настройки')
    + '</nav></div>'
    + '<main>' + body + '</main>';
  updateSaveBadge();
  attachEvents(sim);
}
function tabBtn(id,label){ return '<button data-tab="'+id+'" class="'+(ui.tab===id?'active':'')+'">'+label+'</button>'; }

/* ---------- dashboard ---------- */
function renderDashboard(sim){
  var activeYear = currentYear(state);
  var yearRows = activeYear==null ? sim.rows : sim.rows.filter(function(r){ return r.period.monthRef.y===activeYear; });
  var totalIncome=0,totalExpenses=0,totalAllocated=0,totalUnallocated=0,shortfalls=0;
  yearRows.forEach(function(r){
    totalIncome+=r.totalIncome; totalExpenses+=r.expenses; totalUnallocated+=Math.max(0,r.unallocated);
    Object.keys(r.allocations).forEach(function(k){ totalAllocated+=r.allocations[k]; });
    if(r.free<0) shortfalls++;
  });
  var tabsNav = yearTabsNav(state);
  var cards = (activeYear!=null ? '<h2 style="font-size:15px;margin:0 0 2px;">'+activeYear+' год</h2>' : '')
    + '<div class="grid cols-4">'
    + statCard('Доход за год', fmt(totalIncome))
    + statCard('Расходы за год', fmt(totalExpenses))
    + statCard('Отложено в цели', fmt(totalAllocated))
    + statCard('Свободный остаток', fmt(totalUnallocated))
    + '</div>';
  var shortfallBox = shortfalls ? '<div class="info-box" style="border:1px solid var(--danger);color:var(--danger);background:var(--danger-soft);"><b>'+shortfalls+' период(а/ов)</b> с дефицитом — расходы превышают доход. Загляните на вкладку «Периоды».</div>' : '';
  var goalsHtml = '<div class="card"><div class="card-title"><h2 style="font-size:16px;">Цели накоплений</h2></div><div class="grid cols-2">'
    + state.goals.slice().sort(function(a,b){return a.priority-b.priority;}).map(function(g){
        var finalTarget = goalFinalTarget(g);
        var saved = goalCumulativeProgress(g, sim);
        var potBalance = sim.finalGoalSaved[g.id]||0;
        var pctRaw = finalTarget>0 ? Math.round(saved/finalTarget*100) : 0;
        var pct = Math.max(0, Math.min(100, pctRaw));
        var st_ = goalOverallStatus(g, sim);
        var hasSub = g.subgoals && g.subgoals.length;
        var achievements = milestoneAchievements(g, sim);
        /* For a goal with a single (non-subgoal) target and a deadline, show the same
           on-track/late traffic-light pill that subgoals already get via milestoneStatusPill,
           instead of just echoing the deadline as inert text — a bare "к 15.02.2027" reads as
           a promise the goal will land on time even when the simulation shows it won't. */
        var deadlineLabel;
        if(hasSub){
          deadlineLabel = '';
        } else if(g.deadline){
          var soloPill0 = milestoneStatusPill(goalMilestones(g)[0], achievements[0].achievedDate);
          deadlineLabel = '<span class="pill '+soloPill0.cls+'" style="font-size:10px;">'+soloPill0.label+'</span>';
        } else {
          deadlineLabel = achievements[0].achievedDate ? achievedDateLabel(achievements[0].achievedDate,'прогноз: ','уже накоплено') : 'без срока';
        }
        var subRows = hasSub ? '<div style="margin-top:6px;display:flex;flex-direction:column;gap:3px;">'
          + g.subgoals.map(function(sg,si){
              var pill = milestoneStatusPill(sg, achievements[si]?achievements[si].achievedDate:null);
              return '<div class="row between" style="font-size:11px;"><span class="muted">'+esc(sg.name)+' · '+fmt(sg.target)+'</span><span class="pill '+pill.cls+'" style="font-size:10px;">'+pill.label+'</span></div>';
            }).join('')
          + '</div>' : '';
        return '<div class="stat" style="border:1px solid var(--line);border-radius:10px;padding:10px 12px;">'
          + '<div class="row between"><b>'+esc(g.name)+'</b><span class="pill '+st_.cls+'">'+st_.label+'</span></div>'
          + '<div class="progress'+(pctRaw>100?' over':'')+'" style="margin:6px 0;"><i style="width:'+pct+'%"></i></div>'
          + '<div class="row between muted" style="font-size:12px;"><span class="num">'+fmt(saved)+' / '+fmt(finalTarget)+'</span><span>'+deadlineLabel+'</span></div>'
          + (potBalance!==saved ? '<div class="muted" style="font-size:11px;">на счету сейчас: '+fmt(potBalance)+'</div>' : '')
          + subRows
          + '</div>';
      }).join('')
    + '</div></div>';
  var vacForYear = activeYear==null ? state.vacations : state.vacations.filter(function(v){ return v.start && parseInt(v.start.slice(0,4),10)===activeYear; });
  var vacHtml = '<div class="card"><div class="card-title"><h2 style="font-size:16px;">Отпуска и отпускные</h2></div>'
    + vacForYear.map(function(v){
        var formula = calcVacationPayFormula(v, state);
        var days = v.start&&v.end ? calendarDaysInclusive(v.start,v.end) : 0;
        return '<div class="row between" style="padding:8px 0;border-bottom:1px solid var(--line);flex-wrap:wrap;">'
          + '<div><b>'+esc(v.note||'Отпуск')+'</b><div class="muted" style="font-size:12px;">'+ruDate(v.start)+' — '+ruDate(v.end)+' ('+days+' дн.)</div></div>'
          + '<div style="text-align:right;"><div class="num">'+fmt(v.manualPay)+' <span class="muted">вручную</span></div>'
          + '<div class="num muted" style="font-size:12px;">формула: '+(formula==null?'—':fmt(formula))+'</div></div>'
          + '</div>';
      }).join('') + (!vacForYear.length ? '<div class="muted" style="font-size:12px;padding:8px 0;">Нет отпусков в '+activeYear+' году</div>' : '') + '</div>';
  return tabsNav + cards + shortfallBox + goalsHtml + vacHtml;
}
function statCard(label,val){
  return '<div class="card stat"><div class="v">'+val+'</div><div class="l">'+esc(label)+'</div></div>';
}

/* ---------- periods ---------- */
function renderPeriods(sim){
  var plan = computeSalaryNetPlan(state);
  var activeYear = currentYear(state);
  var yearRows = activeYear==null ? sim.rows : sim.rows.filter(function(r){ return r.period.monthRef.y===activeYear; });
  return yearTabsNav(state)
    + '<div class="card"><div class="card-title"><h2 style="font-size:16px;">Доходы и выплаты'+(activeYear!=null?' '+activeYear:'')+'</h2><span class="muted" style="font-size:12px;">аванс — за 1-ю половину месяца, зарплата — за 2-ю</span></div>'
    + '<div style="display:flex;flex-direction:column;gap:8px;">'
    + yearRows.map(function(r){ return renderPeriodCard(r, state, plan); }).join('')
    + (!yearRows.length ? '<div class="muted" style="font-size:12px;padding:8px 0;">Нет периодов в '+activeYear+' году</div>' : '')
    + '</div></div>';
}
function renderPeriodCard(r, st, plan){

  var shortfall = r.free<0;
  var dis = p.locked ? ' disabled' : '';
  var head = '<div class="period-head" data-toggle-period="'+p.id+'">'
    + '<span class="chev">▸</span>'
    + '<span class="period-date">'+p.label+'</span>'
    + '<span class="pill">'+typeLabel+'</span>'
    + (p.locked ? '<span class="pill warn">🔒</span>' : '')
    + (r.vacationPay ? '<span class="pill ok">отпускные '+fmt(r.vacationPay)+'</span>' : '')
    + (shortfall ? '<span class="pill danger">дефицит</span>' : '')
    + '<span style="margin-left:auto;" class="num">'+fmt(r.totalIncome)+'</span>'
    + '<span class="muted num">− '+fmt(r.expenses)+'</span>'
    + '<span class="num" style="font-weight:700;color:'+(r.free<0?'var(--danger)':'var(--accent-ink)')+';">'+fmtSigned(r.free)+'</span>'
    + '</div>';
  var catRows = st.categories.map(function(c){
    var ov = st.categoryOverrides[p.id];
    var planned = categoryPlannedTotalForDate(c, p.date);
    var val = (ov && ov[c.id]!==undefined) ? ov[c.id] : planned;
    var outSeason = c.season && !inSeason(p.date, c.season);
    return '<tr><td>'+esc(c.name)+(outSeason?' <span class="muted" style="font-size:10px;">(не сезон)</span>':'')+'</td><td class="num"><input type="text" inputmode="numeric" class="num" data-cat-override data-period="'+p.id+'" data-cat="'+c.id+'" value="'+val+'"'+dis+'></td></tr>';
  }).join('');
  var allocRows = state.goals.slice().sort(function(a,b){return a.priority-b.priority;}).map(function(g){
    var val = r.allocations[g.id] || 0;
    var bal = r.goalSnapshot[g.id]||0;
    return '<tr><td>'+esc(g.name)+'</td><td class="num"><input type="text" inputmode="numeric" class="num" data-alloc-override data-period="'+p.id+'" data-goal="'+g.id+'" value="'+Math.round(val)+'"'+dis+'></td><td class="num muted">'+fmt(bal)+'</td></tr>';
  }).join('');
  var hasOverride = !!(st.savingsOverrides[p.id] && Object.keys(st.savingsOverrides[p.id]).length);
  var lockRow = '<div class="row between" style="margin-bottom:10px;">'
    + (p.locked
        ? '<span class="pill warn">🔒 Период зафиксирован — авто-расчёт его больше не трогает</span><button class="small ghost" data-unlock-period="'+p.id+'">Разблокировать</button>'
        : '<span class="muted" style="font-size:12px;">Период открыт — доход, расходы и распределение пересчитываются автоматически</span><button class="small ghost" data-lock-period="'+p.id+'">🔒 Зафиксировать</button>')
    + '</div>';
  var extraHtml = (p.extraIncomes||[]).map(function(e,ei){
    return '<div class="item-row" style="grid-template-columns:1fr 90px 70px auto;">'
      + '<input type="text" placeholder="комментарий" data-extra-note data-period="'+p.id+'" data-idx="'+ei+'" value="'+esc(e.note||'')+'"'+dis+'>'
      + '<input type="text" inputmode="numeric" class="num" data-extra-amount data-period="'+p.id+'" data-idx="'+ei+'" value="'+e.amount+'"'+dis+'>'
      + '<input type="text" inputmode="numeric" class="num" data-extra-pct data-period="'+p.id+'" data-idx="'+ei+'" value="'+e.expensesPct+'" title="% суммы, уходящий на расходы; остальное — на цели"'+dis+'>'
      + '<button class="ghost small" data-extra-del data-period="'+p.id+'" data-idx="'+ei+'"'+dis+'>✕</button>'
      + '</div>';
  }).join('');
  var body = '<div class="period-body">'
    + (p.note ? '<div class="small-note">'+esc(p.note)+'</div>' : '')
    + lockRow
    + '<div class="grid cols-2" style="margin-top:10px;">'
    + '<div><label>Дата выплаты</label><input type="date" data-period-date data-period="'+p.id+'" value="'+p.date+'"'+dis+'>'
    + '<div class="small-note">Название периода в списке обновится вместе с датой. Условный месяц периода (для расчёта аванс/зарплата) при этом не меняется.</div></div>'
    + '<div><label>Отпускные в этом периоде</label><div class="num" style="padding:6px 0;">'+fmt(r.vacationPay)+'</div>'
    + '<div class="small-note">'+(p.assignedVacations&&p.assignedVacations.length ? 'из вкладки «Настройки → Отпуска»' : 'нет назначенных отпусков')+'</div></div>'
    + '</div>'
    + '<div class="grid cols-2" style="margin-top:10px;">'
    + '<div><label>Доход на руки (факт)</label><input type="text" inputmode="numeric" data-income-actual data-period="'+p.id+'" value="'+p.incomeActual+'"'+dis+'>'
    + (pd!=null ? '<div class="small-note">по формуле: оклад gross '+fmt(pd.gross)+' − НДФЛ '+fmt(pd.tax)+' ≈ на руки '+fmt(pd.net)+'. Указывайте здесь зарплату «на руки» без отпускных — они учитываются отдельно.</div>' : '<div class="small-note">не рассчитывается (исторический период)</div>') + '</div>'
    + '<div><label>Всего доход периода (с отпускными и доп. доходом)</label><div class="num" style="padding:6px 0;font-weight:700;">'+fmt(r.totalIncome)+'</div></div>'
    + '</div>'
    + '<hr class="sep">'
    + '<div class="row between"><b style="font-size:13px;">Дополнительный доход (разово)</b><button class="small ghost" data-add-extra-income="'+p.id+'"'+dis+'>+ доход</button></div>'
    + (extraHtml ? '<div class="tag-input-grid" style="grid-template-columns:1fr 90px 70px auto;font-size:11px;color:var(--muted);margin-bottom:4px;"><span>Комментарий</span><span>Сумма</span><span>% на расходы</span><span></span></div>' + extraHtml
        : '<div class="small-note">Разовый доход сверх обычной зарплаты — например премия или подарок. Сумма прибавляется к доходу периода; указанный процент от неё уходит на расходы, остальное распределяется по копилкам как обычный свободный остаток. Проценты подставляются по текущему соотношению расходы/доход периода и корректируются вручную.</div>')
    + '<hr class="sep">'
    + '<div class="row between"><b style="font-size:13px;">Расходы по категориям (переопределение периода)</b><span class="num muted">'+fmt(r.expenses)+'</span></div>'
    + '<table>'+catRows+'</table>'
    + '<hr class="sep">'
    + '<div class="row between"><b style="font-size:13px;">Распределение по копилкам</b><button class="small ghost" data-clear-alloc-override="'+p.id+'"'+dis+'>'+(hasOverride?'Сбросить на авто-расчёт':'')+'</button></div>'
    + '<table><tr><th>Цель</th><th class="num">Отложено</th><th class="num">Баланс копилки</th></tr>'+allocRows+'</table>'
    + (r.unallocated>0.5 ? '<div class="small-note">Нераспределённый остаток: '+fmt(r.unallocated)+'</div>' : '')
    + '</div>';
  return '<div class="period-card'+(open?' open':'')+'" data-period-card="'+p.id+'">'+head+body+'</div>';
}

/* ---------- categories ---------- */
function renderCategories(sim){
  var total = categoriesTemplateTotal(state);
  var oklad = state.oklad.history.length ? state.oklad.history[state.oklad.history.length-1].amount : 0;
  var okladNet = estimateMonthlyNet(oklad, state.ndfl.brackets);
  var cards = state.categories.map(function(c,idx){
    var planned = categoryPlannedTotal(c);
    var pct = okladNet>0 ? (planned*2/okladNet*100).toFixed(1)+'%' : '—';
    var itemsHtml = (c.items||[]).map(function(it,ii){
      var seasonRow = it.season ? '<div class="row wrap" style="gap:6px;margin:-2px 0 6px;padding-left:2px;">'
          + '<span class="pill ok" style="font-size:9px;">сезон</span>'
          + '<input type="text" style="width:58px;" placeholder="01.10" data-item-season-from data-cat="'+c.id+'" data-idx="'+ii+'" value="'+formatDM(it.season.from)+'">'
          + '<span class="muted">–</span>'
          + '<input type="text" style="width:58px;" placeholder="31.03" data-item-season-to data-cat="'+c.id+'" data-idx="'+ii+'" value="'+formatDM(it.season.to)+'">'
          + '<button class="ghost small" data-item-season-clear data-cat="'+c.id+'" data-idx="'+ii+'">✕ сезон</button>'
          + '</div>' : '';
      return '<div class="item-row" style="grid-template-columns:1fr 110px auto auto;">'
        + '<input type="text" data-item-name data-cat="'+c.id+'" data-idx="'+ii+'" value="'+esc(it.name)+'">'
        + '<input type="text" inputmode="numeric" class="num" data-item-amount data-cat="'+c.id+'" data-idx="'+ii+'" value="'+it.amount+'">'
        + (it.season ? '<span></span>' : '<button class="ghost small" data-item-season-add data-cat="'+c.id+'" data-idx="'+ii+'" title="сделать сезонной">📅</button>')
        + '<button class="ghost small" data-del-item data-cat="'+c.id+'" data-idx="'+ii+'">✕</button>'
        + '</div>' + seasonRow;
    }).join('');
    var catSeasonRow = c.season ? '<div class="row wrap" style="gap:6px;margin:6px 0;">'
        + '<span class="pill ok" style="font-size:10px;">сезонная категория</span>'
        + '<input type="text" style="width:64px;" placeholder="01.12" data-cat-season-from data-cat="'+c.id+'" value="'+formatDM(c.season.from)+'">'
        + '<span class="muted">–</span>'
        + '<input type="text" style="width:64px;" placeholder="20.03" data-cat-season-to data-cat="'+c.id+'" value="'+formatDM(c.season.to)+'">'
        + '<button class="ghost small" data-cat-season-clear="'+c.id+'">✕ сезон</button>'
        + '</div>' : '<button class="small ghost" data-cat-season-add="'+c.id+'" style="margin:6px 0;">+ сделать сезонной</button>';
    return '<div class="cat-card">'
      + '<div class="row between">'
      + '<input type="text" style="font-weight:700;font-size:14px;border:none;background:transparent;padding:2px 0;" data-cat-name data-cat="'+c.id+'" value="'+esc(c.name)+'">'
      + '<div class="priority-controls row">'
      + '<button class="ghost small" data-cat-up="'+c.id+'" '+(idx===0?'disabled':'')+'>↑</button>'
      + '<button class="ghost small" data-cat-down="'+c.id+'" '+(idx===state.categories.length-1?'disabled':'')+'>↓</button>'
      + '<button class="ghost small" data-cat-del="'+c.id+'">✕</button>'
      + '</div></div>'
      + catSeasonRow
      + (c.items && c.items.length ? itemsHtml + '<button class="small ghost" data-add-item="'+c.id+'">+ статья</button>'
          : '<div style="margin-top:6px;"><label>Сумма за период</label><input type="text" inputmode="numeric" class="num" data-cat-amount data-cat="'+c.id+'" value="'+c.amount+'"><button class="small ghost" data-add-item="'+c.id+'" style="margin-top:6px;">+ разбить на статьи</button></div>')
      + '<div class="row between muted" style="font-size:12px;margin-top:8px;"><span>Итого за период'+(c.season?' (в сезон)':'')+'</span><span class="num">'+fmt(planned)+' ('+pct+' от дохода на руки ×2)</span></div>'
      + '</div>';
  }).join('');
  return '<div class="card"><div class="card-title"><h2 style="font-size:16px;">Категории расходов (шаблон на каждый период выплаты)</h2>'
    + '<button class="small" data-add-cat>+ категория</button></div>'
    + '<div class="info-box" style="margin-bottom:12px;">Эти суммы применяются как план к каждому периоду выплаты (2 раза в месяц). Итого по шаблону: <b>'+fmt(total)+'</b> за период, <b>'+fmt(total*2)+'</b> в месяц. Фактические расходы конкретного периода можно скорректировать на вкладке «Доходы». Категорию целиком или отдельную статью можно сделать <b>сезонной</b> — тогда сумма учитывается только в периоды внутри указанного диапазона дат (ДД.ММ–ДД.ММ, можно через рубеж года, например 01.12–20.03); вне сезона она в этот период не расходуется.</div>'
    + '<div class="grid cols-2">' + cards + '</div></div>';
}

/* ---------- goals ---------- */
function renderGoals(sim){

  var cards = sorted.map(function(g,idx){
    var hasSub = g.subgoals && g.subgoals.length;
    var finalTarget = goalFinalTarget(g);
    var saved = goalCumulativeProgress(g, sim);
    var potBalance = sim.finalGoalSaved[g.id]||0;
    var pctRaw = finalTarget>0 ? Math.round(saved/finalTarget*100) : 0;
    var pct = Math.max(0, Math.min(100, pctRaw));
    var achievements = milestoneAchievements(g, sim);
    var wdHtml = (g.withdrawals||[]).map(function(w,wi){
      return '<div class="item-row">'
        + '<input type="date" data-wd-date data-goal="'+g.id+'" data-idx="'+wi+'" value="'+w.date+'">'
        + '<input type="text" inputmode="numeric" class="num" data-wd-amount data-goal="'+g.id+'" data-idx="'+wi+'" value="'+w.amount+'">'
        + '<button class="ghost small" data-wd-del data-goal="'+g.id+'" data-idx="'+wi+'">✕</button>'
        + '</div>';
    }).join('');
    var milestonesBlock;
    if(hasSub){
      var subRows = g.subgoals.map(function(sg,si){
        var pill = milestoneStatusPill(sg, achievements[si]?achievements[si].achievedDate:null);
        return '<div class="item-row" style="grid-template-columns:1.3fr 1fr 1fr auto;align-items:center;">'
          + '<input type="text" data-sub-name data-goal="'+g.id+'" data-idx="'+si+'" value="'+esc(sg.name)+'">'
          + '<input type="text" inputmode="numeric" class="num" data-sub-target data-goal="'+g.id+'" data-idx="'+si+'" value="'+sg.target+'">'
          + '<input type="date" data-sub-deadline data-goal="'+g.id+'" data-idx="'+si+'" value="'+(sg.deadline||'')+'">'
          + '<button class="ghost small" data-sub-del data-goal="'+g.id+'" data-idx="'+si+'">✕</button>'
          + '</div>'
          + '<div style="margin:-4px 0 8px;"><span class="pill '+pill.cls+'" style="font-size:10px;">'+pill.label+'</span></div>';
      }).join('');
      milestonesBlock = '<div class="small-note" style="margin-bottom:6px;">Подцели копилки (без срока — оставьте дату пустой, тогда покажем прогноз).</div>'
        + subRows
        + '<div class="row" style="gap:8px;margin-top:4px;"><button class="small ghost" data-sub-add="'+g.id+'">+ подцель</button><button class="small ghost" data-sub-clear="'+g.id+'">Убрать подцели</button></div>';
    } else {
      var deadlineNote;
      if(g.deadline){
        var soloPill1 = milestoneStatusPill(goalMilestones(g)[0], achievements[0].achievedDate);
        deadlineNote = '<div class="small-note" style="margin-top:2px;"><span class="pill '+soloPill1.cls+'" style="font-size:10px;">'+soloPill1.label+'</span></div>';
      } else {
        deadlineNote = '<div class="small-note">'+(achievements[0].achievedDate ? (achievements[0].achievedDate==='pre' ? 'Цель уже накоплена (покрыта начальным остатком)' : 'Прогноз: цель будет накоплена к <b>'+ruDate(achievements[0].achievedDate)+'</b>') : 'При текущем плане цель не будет достигнута в пределах '+esc(planYearsLabel(state))+' года')+'</div>';
      }
      milestonesBlock = '<div class="grid cols-3" style="margin-top:10px;">'
        + '<div><label>Цель, ₽</label><input type="text" inputmode="numeric" class="num" data-goal-target data-goal="'+g.id+'" value="'+g.target+'"></div>'
        + '<div><label>Срок (можно оставить пустым)</label><input type="date" data-goal-deadline data-goal="'+g.id+'" value="'+(g.deadline||'')+'"></div>'
        + '<div><label>Начальный остаток</label><input type="text" inputmode="numeric" class="num" data-goal-start data-goal="'+g.id+'" value="'+g.startingBalance+'"></div>'
        + '</div>' + deadlineNote
        + '<button class="small ghost" data-sub-add="'+g.id+'" style="margin-top:8px;">+ разбить на подцели (этапы)</button>';
    }
    return '<div class="goal-card">'
      + '<div class="goal-top">'
      + '<input type="text" style="font-weight:700;font-size:15px;border:none;background:transparent;flex:1;min-width:120px;" data-goal-name data-goal="'+g.id+'" value="'+esc(g.name)+'">'
      + '<div class="priority-controls row">'
      + '<span class="pill">приоритет '+g.priority+'</span>'
      + '<button class="ghost small" data-goal-up="'+g.id+'" '+(idx===0?'disabled':'')+'>↑</button>'
      + '<button class="ghost small" data-goal-down="'+g.id+'" '+(idx===sorted.length-1?'disabled':'')+'>↓</button>'
      + '<button class="ghost small" data-goal-del="'+g.id+'">✕</button>'
      + '</div></div>'
      + '<div class="progress'+(pctRaw>100?' over':'')+'" style="margin:8px 0;"><i style="width:'+pct+'%"></i></div>'
      + '<div class="row between muted num" style="font-size:12px;">'+fmt(saved)+' / '+fmt(finalTarget)+' ('+pct+'%)</div>'
      + (potBalance!==saved ? '<div class="muted" style="font-size:11px;">на счету сейчас: '+fmt(potBalance)+'</div>' : '')
      + '<hr class="sep">'
      + milestonesBlock
      + '<label class="row" style="margin-top:10px;align-items:center;gap:6px;"><input type="checkbox" style="width:auto;" data-goal-completed data-goal="'+g.id+'" '+(g.completed?'checked':'')+'> <span class="muted" style="font-size:12px;">цель выполнена / закрыта</span></label>'
      + (hasSub ? '<div class="small-note">Начальный остаток: <input type="text" inputmode="numeric" class="num" style="display:inline-block;width:120px;" data-goal-start data-goal="'+g.id+'" value="'+g.startingBalance+'"></div>' : '')
      + '<hr class="sep">'
      + '<div class="row between"><b style="font-size:12px;">Траты из этой копилки</b><button class="small ghost" data-wd-add="'+g.id+'">+ трата</button></div>'
      + wdHtml
      + '</div>';
  }).join('');
  return '<div class="card"><div class="card-title"><h2 style="font-size:16px;">Цели накоплений</h2><button class="small" data-add-goal>+ цель</button></div>'
    + '<div class="info-box" style="margin-bottom:12px;">Свободный остаток каждого периода распределяется автоматически по <b>срочности</b>, а не жёстко по приоритету: сначала деньги получает та цель (или текущий этап), которой нужно откладывать больше в расчёте на период, чтобы успеть к своему сроку — даже если её приоритет ниже. Так цель с более ранним сроком не срывается только из-за того, что выше в списке стоит другая цель, у которой запас времени ещё большой. При этом цель с высоким приоритетом не страдает: как только у неё самой срок начинает поджимать, её собственная потребность в деньгах на период растёт и она снова получает деньги в первую очередь. Приоритет решает только при равной срочности (например, между целями без срока) — их пополнение идёт по приоритету, стрелками. Как только цель (или текущий этап) набирает свою сумму, пополнение прекращается и излишек идёт следующей по срочности цели. Можно переопределить вручную в карточке периода. Цель можно разбить на подцели (этапы) — например «к 1 апреля накопить 150 000, потратить, затем к 31 июля накопить ещё 315 000» — каждая со своим сроком или без него. <b>Общая цель на карточке = сумма всех этапов</b> (150 000 + 315 000 = 465 000): это сколько всего денег пройдёт через копилку за год, а не остаток на счету в моменте — фактический остаток («на счету сейчас») показан отдельной строкой, если он отличается.</div>'
    + cards + '</div>';
}

    + '• <b>Фиксация периодов</b>: периоды с датой в прошлом фиксируются автоматически и хранятся как факт — изменения настроек их больше не пересчитывают. Период можно зафиксировать и вручную кнопкой «🔒» в его карточке; зафиксированный период остаётся редактируемым, просто перестаёт двигаться от авто-расчёта, пока его не разблокировать.'
    + '</div>';
}

/* ============ event handling ============ */
function attachEvents(sim){
  root.querySelectorAll('[data-tab]').forEach(function(btn){
    btn.addEventListener('click', function(){ ui.tab = btn.getAttribute('data-tab'); render(); });
  });
  root.querySelectorAll('[data-select-year]').forEach(function(btn){
    btn.addEventListener('click', function(){ ui.selectedYear = parseInt(btn.getAttribute('data-select-year'),10); render(); });
  });
  root.querySelectorAll('[data-toggle-period]').forEach(function(el){
    el.addEventListener('click', function(){
      var id = el.getAttribute('data-toggle-period');
      ui.openPeriods[id] = !ui.openPeriods[id];
      render();
    });
  });

  /* periods */
  bindChange('[data-income-actual]', function(el){
    var p = findPeriod(el.dataset.period); if(p) p.incomeActual = parseNum(el.value);
  });
  bindChange('[data-period-date]', function(el){
    var p = findPeriod(el.dataset.period);
    if(p && el.value){
      p.date = el.value;
      var parts = el.value.split('-');
      p.label = parts[2]+'.'+parts[1];
    }
  });
  root.querySelectorAll('[data-add-extra-income]').forEach(function(btn){
    btn.addEventListener('click', function(){
      if(btn.disabled) return;
      var pid = btn.getAttribute('data-add-extra-income');
      var p = findPeriod(pid);
      if(p){
        var freshSim = simulate(state);
        var row = freshSim.rows.find(function(r){ return r.period.id===pid; });
        var pct = (row && row.totalIncome>0) ? Math.round(row.expenses/row.totalIncome*100) : 50;
        pct = Math.max(0, Math.min(100, pct));
        if(!p.extraIncomes) p.extraIncomes=[];
        p.extraIncomes.push({id:uid('extra'), amount:0, note:'', expensesPct:pct});
        scheduleSave();
      }
    });
  });
  root.querySelectorAll('[data-extra-del]').forEach(function(b){ b.addEventListener('click', function(){
    var p = findPeriod(b.dataset.period); if(p){ p.extraIncomes.splice(parseInt(b.dataset.idx,10),1); scheduleSave(); }
  }); });
  bindChange('[data-extra-note]', function(el){ var p=findPeriod(el.dataset.period); if(p) p.extraIncomes[parseInt(el.dataset.idx,10)].note=el.value; });
  bindChange('[data-extra-amount]', function(el){ var p=findPeriod(el.dataset.period); if(p) p.extraIncomes[parseInt(el.dataset.idx,10)].amount=parseNum(el.value); });
  bindChange('[data-extra-pct]', function(el){ var p=findPeriod(el.dataset.period); if(p) p.extraIncomes[parseInt(el.dataset.idx,10)].expensesPct=Math.max(0,Math.min(100,parseNum(el.value))); });
  bindChange('[data-cat-override]', function(el){
    var pid = el.dataset.period, cid = el.dataset.cat;
    var p = findPeriod(pid);
    var planned = categoryPlannedTotalForDate(state.categories.find(function(c){return c.id===cid;}), p?p.date:null);
    var val = parseNum(el.value);
    if(!state.categoryOverrides[pid]) state.categoryOverrides[pid]={};
    if(val===planned) delete state.categoryOverrides[pid][cid]; else state.categoryOverrides[pid][cid]=val;
    if(Object.keys(state.categoryOverrides[pid]).length===0) delete state.categoryOverrides[pid];
  });
  bindChange('[data-alloc-override]', function(el){
    var pid = el.dataset.period, gid = el.dataset.goal;
    if(!state.savingsOverrides[pid]) state.savingsOverrides[pid]={};
    state.savingsOverrides[pid][gid] = parseNum(el.value);
  });
  root.querySelectorAll('[data-clear-alloc-override]').forEach(function(btn){
    btn.addEventListener('click', function(){
      if(btn.disabled) return;
      var pid = btn.getAttribute('data-clear-alloc-override');
      delete state.savingsOverrides[pid];
      scheduleSave();
    });
  });
  root.querySelectorAll('[data-lock-period]').forEach(function(btn){
    btn.addEventListener('click', function(){
      var pid = btn.getAttribute('data-lock-period');
      var p = findPeriod(pid);
      if(p){
        var freshSim = simulate(state);

      }
    });

  function bindChange(sel, fn){
    root.querySelectorAll(sel).forEach(function(el){
      var isDiscrete = (el.type==='checkbox'||el.type==='radio'||el.tagName==='SELECT');
      if(isDiscrete){
        el.addEventListener('change', function(){ fn(el); scheduleSave(); });
      } else {
        /* commit synchronously on blur (not on every keystroke/pause, and not deferred via
           setTimeout — a deferred commit could lose a race with a synchronous click handler
           that triggers its own render() first, which redraws the DOM from stale state and
           makes the just-typed edit appear to "reset" back to its previous value). */
        el.addEventListener('blur', function(){ fn(el); scheduleSave(); });
        el.addEventListener('keydown', function(ev){ if(ev.key==='Enter'){ el.blur(); } });
      }
    });
  }
}
function findPeriod(id){ return state.periods.find(function(p){return p.id===id;}); }
function findGoal(id){ return state.goals.find(function(g){return g.id===id;}); }
function findVac(id){ return state.vacations.find(function(v){return v.id===id;}); }
function moveArrayItem(arr, id, dir){
  var idx = arr.findIndex(function(x){return x.id===id;});
  var newIdx = idx+dir;
  if(newIdx<0||newIdx>=arr.length) return;
  var tmp = arr[idx]; arr[idx]=arr[newIdx]; arr[newIdx]=tmp;
}
function swapPriority(id, dir){
  var sorted = state.goals.slice().sort(function(a,b){return a.priority-b.priority;});
  var idx = sorted.findIndex(function(g){return g.id===id;});
  var newIdx = idx+dir;
  if(newIdx<0||newIdx>=sorted.length) return;
  var a = sorted[idx], b = sorted[newIdx];
  var tmp = a.priority; a.priority=b.priority; b.priority=tmp;
}

/* ============ boot ============ */
async function boot(){
  root = document.getElementById('root');
  await ensureSignedIn();
  await loadStateFromDB();
  ui = state.ui;
  render();
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
})();
