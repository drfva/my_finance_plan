          + '<tr><td><b>Итого</b></td>'+pctCell(instTotal+cardTotal)+'<td class="num"><b>'+fmt(instTotal+cardTotal)+'</b></td></tr>'
          + '</table>'

  var d = newPeriodDraft;
  return '<div class="cat-card" style="margin-bottom:14px;">'
    + '<div class="row between" style="margin-bottom:8px;"><b>Новый период</b><button class="ghost small" data-cancel-add-period>✕</button></div>'
    + '<div class="grid cols-3">'
    + '<div><label>Дата выплаты</label><input type="date" data-np="date" value="'+esc(d.date)+'"></div>'
    + '<div><label>Тип выплаты</label><select data-np="type">'
    + '<option value="avans"'+(d.type==='avans'?' selected':'')+'>Аванс</option>'
    + '<option value="zp"'+(d.type==='zp'?' selected':'')+'>Зарплата</option></select></div>'
    + '<div><label>За какой месяц</label><input type="month" data-np="month" value="'+esc(d.month)+'"></div>'
    + '</div>'
    + '<div class="grid cols-2" style="margin-top:10px;">'
    + '<div><label>Доход на руки, ₽</label><input type="text" inputmode="numeric" class="num" data-np="income" value="'+esc(d.income)+'" placeholder="0"></div>'
    + '<div><label>Комментарий (необязательно)</label><input type="text" data-np="note" value="'+esc(d.note)+'"></div>'
    + '</div>'
    + '<div class="small-note">Аванс — за 1-ю половину месяца, зарплата — за 2-ю; месяц подставляется по дате (зарплата 5-го числа — за прошлый месяц), при необходимости поправьте. Сумма — «на руки», без отпускных. Если дата уже прошла, период сразу фиксируется и его остаток не распределяется по копилкам автоматически — при желании впишите суммы в копилки вручную в карточке периода. Для расчёта отпускных месяц 2026 года берётся из периодов, только когда добавлены и аванс, и зарплата за него; иначе — из «Настройки → Доходы за 2026 год».</div>'
    + '<div id="np-error" class="small-note" style="color:var(--danger);"></div>'
    + '<div class="row" style="gap:8px;margin-top:10px;"><button class="primary small" data-submit-add-period>Добавить период</button><button class="small ghost" data-cancel-add-period>Отмена</button></div>'
    + '</div>';
}
function renderPeriods(sim){
  var plan = computeSalaryNetPlan(state);
  var activeYear = currentYear(state);
  var yearRows = activeYear==null ? sim.rows : sim.rows.filter(function(r){ return r.period.monthRef.y===activeYear; });
  return yearTabsNav(state)
    + '<div class="card"><div class="card-title"><h2 style="font-size:16px;">Доходы и выплаты'+(activeYear!=null?' '+activeYear:'')+'</h2><span class="muted" style="font-size:12px;">аванс — за 1-ю половину месяца, зарплата — за 2-ю</span></div>'
    + renderAddPeriodForm()
    + '<div style="display:flex;flex-direction:column;gap:8px;">'
    + renderPeriodList(yearRows, plan, sim)
    + (!yearRows.length ? '<div class="muted" style="font-size:12px;padding:8px 0;">Нет периодов в '+activeYear+' году</div>' : '')
    + '</div></div>';
}
/* Свободный остаток периода после расходов, рассрочек, погашения кредиток и сумм в копилки.
   Проверяется для любых периодов, в т.ч. добавленных вручную и зафиксированных: если в копилки
   и на долги вписано больше, чем осталось после расходов, остаток уходит в минус и выделяется красным. */
function renderRemainderLine(r){
  var left = Math.round(r.unallocated);
  var toGoals = Math.round(sumValues(r.allocations)), toDebts = Math.round(sumValues(r.debtPayments));
  var afterExpenses = Math.round(r.free);
  if(left < 0){
    return '<div class="small-note" style="color:var(--danger);font-weight:700;">Свободный остаток: −'+fmt(-left)+'</div>'
      + (toGoals + toDebts <= 0
          ? '<div class="small-note" style="color:var(--danger);margin-top:2px;">Расходы превышают доход периода — распределять в копилки нечего.</div>'
          : '<div class="small-note" style="color:var(--danger);margin-top:2px;">После расходов осталось '+fmt(afterExpenses)
      + ', а распределено '+fmt(toGoals + toDebts)
      + (toDebts ? ' (в копилки '+fmt(toGoals)+', на долги '+fmt(toDebts)+')' : ' в копилки')
      + ' — уменьшите суммы, чтобы остаток был не меньше нуля.</div>');
  }
  return '<div class="small-note">Свободный остаток: <b class="num">'+fmt(left)+'</b></div>';
}
/* Что за отпускные пришли в этой выплате: даты отпуска, всего дней и сумма, дата фактической
   выплаты отпускных и сколько дней (и денег) попало в расчётный период именно этой выплаты. */
function renderPeriodVacationNote(p, st){
  var split = vacationSplitForPeriod(p, st), win = settlementLabel(p);
  if(!split.length) return '<div class="small-note">Расчётный период выплаты: '+win+'. Отпусков в нём нет.</div>';
  return '<div class="small-note">Расчётный период выплаты: <b>'+win+'</b>.</div>'
    + split.map(function(x){
        var v = x.vac, pd = vacationPayoutDate(v, st);
        return '<div class="small-note">'+esc(v.note||'Отпуск')+': '+ruDate(v.start)+'–'+ruDate(v.end)
          + ', '+x.totalDays+' '+plural(x.totalDays,'календарный день','календарных дня','календарных дней')
          + ', всего отпускных '+fmt(v.manualPay||0)
          + (pd ? ', выплачивают '+ruDate(pd) : '')
          + '. В расчётный период этой выплаты попало '+x.days+' '+plural(x.days,'день','дня','дней')
          + ' = <b class="num">'+fmt(x.amount)+'</b>.</div>';
      }).join('')
    + '<div class="small-note">Суммы отпускных меняются в разделе «Отпуска» — здесь только для просмотра.</div>';
}
function sumValues(o){ return Object.keys(o||{}).reduce(function(s,k){ return s+(o[k]||0); },0); }
function renderPeriodDebts(r, st, p, dis, periodSim){
  var dts = debtsOf(st);
  if(!dts.installments.length && !dts.cards.length) return '';
  var paid = sumValues(r.debtPayments);
  var instRows = (r.installments||[]).map(function(x){
    var st_ = periodSim ? paymentStateForDate(x.date, periodSim, todayISO()) : null;
    var mark = st_ && st_.code==='paid' ? ' <span class="pill ok" style="font-size:9px;">оплачен</span>'
      : (st_ && st_.code==='unpaid' ? ' <span class="pill danger" style="font-size:9px;">не оплачен</span>' : '');
    return '<tr'+(st_ && st_.code==='paid' ? ' style="opacity:.6;"' : '')+'><td>Платёж по рассрочке '+ruDate(x.date).slice(0,5)+(x.names.length?' <span class="muted">· '+esc(x.names.join(', '))+'</span>':'')+mark+'</td><td class="num">'+fmt(x.amount)+'</td></tr>';
  }).join('');
  /* карты без долга и без погашения в этой выплате не показываем */
  var liveCards = dts.cards.filter(function(c){
    var before = (r.cardBefore||{})[c.id] || { debt:0 };
    return (before.debt||0) > 0.5 || ((r.debtPayments||{})[c.id] || 0) > 0.5;
  });
  var cardRows = liveCards.map(function(c){
    var before = (r.cardBefore||{})[c.id] || { debt:0, deadline:null };
    var pay = (r.debtPayments||{})[c.id] || 0;
    var po = dts.paymentOverrides[p.id];
    var isOv = !!(po && po[c.id]!==undefined);
    return '<tr><td>'+esc(c.name||'Кредитка')
      + '<div class="small-note" style="margin:0;">долг до выплаты '+fmt(before.debt)
      + (before.deadline ? ' · погасить до '+ruDate(before.deadline) : '')
      + ' · после выплаты '+fmt(Math.max(0, before.debt-pay))+'</div></td>'
      + '<td class="num" style="width:130px;"><input type="text" inputmode="numeric" class="num" data-debt-override data-period="'+p.id+'" data-card="'+c.id+'" data-auto="'+Math.round(pay)+'" value="'+Math.round(pay)+'"'+dis+'>'
      + (isOv && !p.locked ? '<button class="ghost small" data-debt-override-clear data-period="'+p.id+'" data-card="'+c.id+'">↺ авто</button>' : '')
      + '</td></tr>';
  }).join('');
  return '<hr class="sep">'
    + '<div class="row between"><b style="font-size:13px;">Долги</b><span class="num muted">'+fmt(r.installmentsTotal + paid)+'</span></div>'
    + (dts.installments.length
        ? '<div style="margin-top:6px;font-size:12px;font-weight:600;">Рассрочка</div>'
          + (instRows ? '<table>'+instRows+'</table>' : '<div class="small-note">В этот период платежей по рассрочке нет.</div>')
        : '')
    + (dts.cards.length
        ? '<div style="margin-top:8px;font-size:12px;font-weight:600;">Кредитка</div>'
          + (liveCards.length
              ? '<table><tr><th>Карта</th><th class="num">Погашение</th></tr>'+cardRows+'</table>'
                + '<div class="small-note">Сумма погашения считается автоматически — так, чтобы успеть до конца льготного периода; если впишете свою, план подстроится под неё.</div>'
              : '<div class="small-note">Долгов по кредиткам в этой выплате нет.</div>')
        : '');
}
var showPastPeriods = false;
/* сверху — последняя прошедшая выплата, ниже — будущие; более ранние спрятаны под плашкой */
function renderPeriodList(rows, plan, sim){
  var today = todayISO();
  var past = rows.filter(function(r){ return r.period.date<=today; });
  var upcoming = rows.filter(function(r){ return r.period.date>today; });
  var lastPast = past.length ? past[past.length-1] : null;
  var earlier = past.slice(0, Math.max(0, past.length-1));
  var html = '';
  if(earlier.length){
    html += '<button class="past-toggle" data-toggle-past>'
      + (showPastPeriods ? '▾ Скрыть предыдущие выплаты' : '▸ Показать предыдущие выплаты')
      + ' <span class="num">('+earlier.length+')</span></button>';
    if(showPastPeriods) html += earlier.map(function(r){ return renderPeriodCard(r, state, plan, true, sim); }).join('');
  }
  if(lastPast) html += renderPeriodCard(lastPast, state, plan, true, sim);
  if(lastPast && upcoming.length) html += '<div class="upcoming-divider">предстоящие выплаты</div>';
  html += upcoming.map(function(r){ return renderPeriodCard(r, state, plan, false, sim); }).join('');
  return html;
}
function renderPeriodCard(r, st, plan, isPastCard, periodSim){
  var p = r.period;
  var open = !!ui.openPeriods[p.id];
  var typeLabel = p.type==='avans' ? 'Аванс' : 'Зарплата';
  var pd = plan[p.id];
  var shortfall = r.free<0;
  var manual = isManualPeriod(p);
  var isPast = p.date < todayISO();
  /* ручной период остаётся редактируемым и после фиксации: фиксация лишь отключает авто-распределение */
  var dis = (p.locked && !manual) ? ' disabled' : '';
  var head = '<div class="period-head" data-toggle-period="'+p.id+'">'
    + '<span class="chev">▸</span>'
    + '<span class="period-date">'+p.label+'</span>'
    + '<span class="pill">'+typeLabel+'</span>'
    + (manual ? '<span class="pill">вручную</span>' : '')
    + (p.locked ? '<span class="pill warn">🔒</span>' : '')
    + (r.vacationPay ? '<span class="pill ok">отпускные '+fmt(r.vacationPay)+'</span>' : '')
    + ((r.installmentsTotal + sumValues(r.debtPayments))>0.5 ? '<span class="pill warn">долги '+fmt(r.installmentsTotal + sumValues(r.debtPayments))+'</span>' : '')
    + (shortfall ? '<span class="pill danger">дефицит</span>' : '')
    + (!shortfall && r.unallocated < -0.5 ? '<span class="pill danger">не хватает '+fmt(-r.unallocated)+'</span>' : '')
    + '<span style="margin-left:auto;" class="num">'+fmt(r.totalIncome)+'</span>'
    + '<span class="muted num">− '+fmt(r.expenses)+'</span>'
    + '<span class="num" style="font-weight:700;color:'+(r.free<0?'var(--danger)':'var(--accent-ink)')+';">'+fmtSigned(r.free)+'</span>'
    + '</div>';
  var catRows = st.categories.map(function(c){
    var ov = st.categoryOverrides[p.id];
    var planned = categoryPlannedTotalForDate(c, p.date);
    var val = (ov && ov[c.id]!==undefined) ? ov[c.id] : planned;
    var outSeason = c.season && !inSeason(p.date, c.season);
    return '<tr><td>'+esc(c.name)+(outSeason?' <span class="muted" style="font-size:10px;">(не сезон)</span>':'')+'</td><td class="num"><input type="text" inputmode="numeric" class="num" data-cat-override data-period="'+p.id+'" data-cat="'+c.id+'" value="'+val+'"'+dis+'></td></tr>';
  }).join('');
  var allocRows = state.goals.slice().sort(function(a,b){return a.priority-b.priority;}).map(function(g){
    var val = r.allocations[g.id] || 0;
    var bal = r.goalSnapshot[g.id]||0;
    return '<tr><td>'+esc(g.name)+'</td><td class="num"><input type="text" inputmode="numeric" class="num" data-alloc-override data-period="'+p.id+'" data-goal="'+g.id+'" value="'+Math.round(val)+'"'+dis+'></td><td class="num muted">'+fmt(bal)+'</td></tr>';
  }).join('');
  var hasOverride = !!(st.savingsOverrides[p.id] && Object.keys(st.savingsOverrides[p.id]).length);
  var lockText, lockBtn;
  if(p.locked){
    lockText = manual
      ? '<span class="pill warn">🔒 Авто-распределение по копилкам отключено — суммы в копилки вносятся вручную ниже</span>'
      : '<span class="pill warn">🔒 Период зафиксирован — авто-расчёт его больше не трогает</span>';
    /* прошедший период после разблокировки тут же фиксируется снова с авто-распределением,
       поэтому для ручных прошедших периодов кнопку не показываем */
    lockBtn = (manual && isPast) ? '' : '<button class="small ghost" data-unlock-period="'+p.id+'">Разблокировать</button>';
  } else {
    lockText = '<span class="muted" style="font-size:12px;">Период открыт — '+(manual?'расходы и распределение':'доход, расходы и распределение')+' пересчитываются автоматически</span>';
    lockBtn = '<button class="small ghost" data-lock-period="'+p.id+'">🔒 Зафиксировать</button>';
  }
  var lockRow = '<div class="row between wrap" style="margin-bottom:10px;">' + lockText
    + '<div class="row">' + lockBtn
    + (manual ? '<button class="small ghost" data-del-period="'+p.id+'">✕ Удалить период</button>' : '')
    + '</div></div>';
  var monthRefVal = p.monthRef.y+'-'+pad2(p.monthRef.m);
  var manualRow = manual ? '<div class="grid cols-2" style="margin-top:10px;">'
    + '<div><label>Тип выплаты</label><select data-period-type data-period="'+p.id+'"'+dis+'>'
    + '<option value="avans"'+(p.type==='avans'?' selected':'')+'>Аванс (1-я половина месяца)</option>'
    + '<option value="zp"'+(p.type==='zp'?' selected':'')+'>Зарплата (2-я половина месяца)</option>'
    + '</select></div>'
    + '<div><label>За какой месяц</label><input type="month" data-period-month data-period="'+p.id+'" value="'+monthRefVal+'"'+dis+'>'
    + '<div class="small-note">Определяет, в каком году и месяце учитывается доход.</div></div>'
    + '</div>' : '';
  var body = '<div class="period-body">'
    + (p.note ? '<div class="small-note">'+esc(p.note)+'</div>' : '')
    + lockRow
    + '<div class="grid cols-2" style="margin-top:10px;">'
    + '<div><label>Дата выплаты</label><input type="date" data-period-date data-period="'+p.id+'" value="'+p.date+'"'+dis+'>'
    + '<div class="small-note">Название периода в списке обновится вместе с датой. Условный месяц периода (для расчёта аванс/зарплата) при этом не меняется.</div></div>'
    + '<div><label>Отпускные в этой выплате</label><div class="num" style="padding:6px 0;">'+fmt(r.vacationPay)+'</div>'
    + renderPeriodVacationNote(p, st)+'</div>'
    + '</div>'
    + manualRow
    + '<div class="grid cols-2" style="margin-top:10px;">'
    + '<div><label>Доход на руки (факт)</label><input type="text" inputmode="numeric" data-income-actual data-period="'+p.id+'" value="'+p.incomeActual+'"'+dis+'>'
    + (pd!=null
        ? '<div class="small-note">по формуле: отработано '+pd.worked+' из '+pd.halfWD+' раб. дн. (в месяце '+pd.monthWD+') · gross '+fmt(pd.gross)+' − НДФЛ '+fmt(pd.tax)+' ≈ на руки <b class="num">'+fmt(pd.net)+'</b>'
          + (!p.locked && Math.abs(pd.net-(p.incomeActual||0))>1 ? ' <button class="small ghost" data-income-apply-formula="'+p.id+'">Подставить</button>' : '')
          + '. '+(isManualPeriod(p) ? 'Это оценка по окладу, в ручной период сумма не подставляется сама. ' : '')+'Указывайте здесь зарплату «на руки» без отпускных — они учитываются отдельно.</div>'
        : '<div class="small-note">нет данных для расчёта по формуле — укажите оклад в настройках</div>') + '</div>'
    + '<div><label>Всего доход периода (с отпускными)</label><div class="num" style="padding:6px 0;font-weight:700;">'+fmt(r.totalIncome)+'</div></div>'
    + '</div>'
    + '<hr class="sep">'
    + '<div class="row between"><b style="font-size:13px;">Расходы по категориям (переопределение периода)</b><span class="num muted">'+fmt(r.categoriesTotal)+'</span></div>'
    + '<table>'+catRows+'</table>'
    + renderPeriodDebts(r, st, p, dis, periodSim)
    + '<hr class="sep">'
    + '<div class="row between"><b style="font-size:13px;">Распределение по копилкам</b><button class="small ghost" data-clear-alloc-override="'+p.id+'"'+dis+'>'+(hasOverride?(p.locked?'Обнулить':'Сбросить на авто-расчёт'):'')+'</button></div>'
    + '<table><tr><th>Цель</th><th class="num">Отложено</th><th class="num">В копилке на '+p.label+'</th></tr>'+allocRows+'</table>'
    + renderRemainderLine(r)
    + '</div>';
  return '<div class="period-card'+(open?' open':'')+(isPastCard?' past':'')+'" data-period-card="'+p.id+'">'+head+body+'</div>';
}

/* ============ фактические расходы (вводятся вручную, только для сравнения с планом) ============ */
function actualsOf(st){ var d = debtsOf(st); return d.actuals || {}; }
function monthKey(y,m){ return y+'-'+pad2(m); }
function actualEntry(st, ym, catId){ var mm = actualsOf(st)[ym] || {}; return mm[catId] || null; }
function actualItemAmount(st, ym, catId, itemName){
  var e = actualEntry(st, ym, catId);
  return (e && e.items && e.items[itemName]) || 0;
}
/* весь факт по категории за месяц: сумма категории целиком плюс все статьи,
   включая статьи, которых в текущем плане уже нет (историю не теряем) */
function actualCategorySum(st, ym, catId){
  var e = actualEntry(st, ym, catId);
  if(!e) return 0;
  var sum = e.total || 0;
  if(e.items) Object.keys(e.items).forEach(function(k){ sum += e.items[k]||0; });
  return sum;
}
function actualYearSumById(st, year, catId){
  var sum = 0;
  for(var m=1;m<=12;m++) sum += actualCategorySum(st, monthKey(year,m), catId);
  return sum;
}
function actualMonthTotal(st, ym){
  var mm = actualsOf(st)[ym] || {}, sum = 0;
  Object.keys(mm).forEach(function(cid){ sum += actualCategorySum(st, ym, cid); });
  return sum;
}
/* категории, по которым за этот год есть факт (в том числе удалённые из плана) */
function factYearCategoryIds(st, year){
  var ids = [];
  for(var m=1;m<=12;m++){
    var mm = actualsOf(st)[monthKey(year,m)] || {};
    Object.keys(mm).forEach(function(cid){ if(ids.indexOf(cid)===-1) ids.push(cid); });
  }
  return ids;
}
/* названия статей, по которым за этот год есть факт */
function factYearItemNames(st, year, catId){
  var names = [];
  for(var m=1;m<=12;m++){
    var e = actualEntry(st, monthKey(year,m), catId);
    if(e && e.items) Object.keys(e.items).forEach(function(nm){ if(names.indexOf(nm)===-1) names.push(nm); });
  }
  return names;
}
/* название категории, как оно было сохранено с фактом: нужно для категорий,
   удалённых из плана — иначе в истории останется только id */
function storedCategoryName(st, year, catId){
  var name = '';
  for(var m=1;m<=12;m++){
    var e = actualEntry(st, monthKey(year,m), catId);
    if(e && e.name) name = e.name;
  }
  return name;
}
/* переименование в «Категориях»: факт переезжает вместе с названием */
function renameActualItem(st, catId, oldName, newName){
  if(!oldName || !newName || oldName===newName) return;
  var all = actualsOf(st);
  Object.keys(all).forEach(function(ym){
    var e = all[ym][catId];
    if(!e || !e.items || e.items[oldName]===undefined) return;
    e.items[newName] = (e.items[newName]||0) + e.items[oldName];
    delete e.items[oldName];
  });
}
function renameActualCategory(st, catId, newName){
  var all = actualsOf(st);
  Object.keys(all).forEach(function(ym){ if(all[ym][catId]) all[ym][catId].name = newName; });
}
/* факт по категории: если есть статьи — это сумма их факта, иначе сумма самой категории */
function actualCategoryAmount(st, ym, cat){ return actualCategorySum(st, ym, cat.id); }
function actualYearAmount(st, year, cat){ return actualYearSumById(st, year, cat.id); }
function setActual(st, ym, catId, itemName, amount, catName){
  if(!st.debts.actuals) st.debts.actuals = {};
  var all = st.debts.actuals;
  var mm = all[ym] || (all[ym] = {});
  var e = mm[catId] || (mm[catId] = {});
  if(catName) e.name = catName;
  if(itemName){
    if(!e.items) e.items = {};
    if(amount>0) e.items[itemName] = amount; else delete e.items[itemName];
    if(e.items && !Object.keys(e.items).length) delete e.items;
  } else {
    if(amount>0) e.total = amount; else delete e.total;
  }
  if(!e.total && !e.items) delete mm[catId]; else if(!e.name){ var cc = st.categories.find(function(c){ return c.id===catId; }); if(cc) e.name = cc.name; }
  if(!Object.keys(mm).length) delete all[ym];
}
/* План месяца берётся из шаблона «Категорий»: сумма категории за период × число выплат месяца,
   с учётом сезонов. Ручные правки расходов в карточке выплаты здесь НЕ учитываются — так видно,
   насколько факт разошёлся с изначальным планом года. */
function monthPeriodsOf(st, y, m){
  return st.periods.filter(function(p){ return p.monthRef.y===y && p.monthRef.m===m; });
}
function categoryPlanForMonth(st, cat, y, m){
  var ps = monthPeriodsOf(st, y, m);
  /* месяца нет в плане выплат — значит и плана расходов на него нет */
  if(!ps.length) return 0;
  var sum = 0;
  ps.forEach(function(p){ sum += categoryPlannedTotalForDate(cat, p.date); });
  return sum;
}
function itemPlanForMonth(st, cat, item, y, m){
  var ps = monthPeriodsOf(st, y, m);
  if(!ps.length) return 0;
  var sum = 0;
  ps.forEach(function(p){
    if(cat.season && !inSeason(p.date, cat.season)) return;
    if(item.season && !inSeason(p.date, item.season)) return;
    sum += item.amount||0;
  });
  return sum;
}
function categoryPlanForYear(st, cat, year){
  var sum = 0;
  for(var m=1;m<=12;m++) sum += categoryPlanForMonth(st, cat, year, m);
  return sum;
}
/* цвет строки: факт меньше плана — зелёный, разница в пределах 5% — обычный, больше плана — красный */
function factRowClass(plan, fact, entered){
  if(!entered) return '';
  /* нет плана — не с чем сравнивать, строка остаётся без подсветки */
  if(plan<=0) return '';
  var diff = (fact-plan)/plan;
  if(diff > 0.05) return 'fact-over';
  if(diff < -0.05) return 'fact-under';
  return 'fact-even';
}

/* ---------- статус платежей: оплачено или ещё нет ---------- */
/* Платёж считается оплаченным, если его дата прошла и выплаты, из которой он платится,
   хватило на все расходы (остаток после расходов не отрицательный). Если выплата ушла
   в дефицит, платёж остаётся видимым как неоплаченный. */
function payoutRowForDate(dateISO, sim){
  var row = null;
  sim.rows.forEach(function(r){ if(r.period.date<=dateISO && (!row || r.period.date>row.period.date)) row = r; });
  return row;
}
function paymentStateForDate(dateISO, sim, today){
  if(!dateISO) return { code:'nodate', label:'без даты', cls:'' };
  var row = payoutRowForDate(dateISO, sim);
  var src = row ? 'из выплаты '+ruDate(row.period.date) : 'вне плана';
  if(dateISO > today) return { code:'upcoming', label:src, cls:'', row:row };
  if(!row) return { code:'unknown', label:'вне плана', cls:'warn', row:null };
  if(row.free >= -0.5) return { code:'paid', label:'оплачен', cls:'ok', row:row };
  return { code:'unpaid', label:'не оплачен: дефицит выплаты '+ruDate(row.period.date), cls:'danger', row:row };
}
/* операция по карте относится к уже закрытому (полностью погашенному) периоду — это история */
function cardOpIsHistory(op, cycles, today){
  if(!op.date || op.date > today) return false;
  for(var i=0;i<cycles.length;i++){
    var cy = cycles[i];
    if(op.date >= cy.start && (!cy.closed || op.date <= cy.closed)) return !!(cy.closed && cy.closed <= today);
  }
  return true;
}

      + '<option value="1m"'+(inst.interval==='1m'?' selected':'')+'>Раз в месяц</option></select></div>'
      + '</div>'
      + '<div class="small-note" style="margin-bottom:6px;">При изменении этих полей график пересоздаётся. Отдельные платежи ниже можно поправить вручную.</div>'
      + rows
      + (Math.round(sumPays)!==Math.round(inst.total) ? '<div class="small-note" style="color:var(--warn);">Сумма платежей '+fmt(sumPays)+' не совпадает с суммой покупки '+fmt(inst.total)+'.</div>' : '')
      + '<button class="small ghost" data-ip-add="'+inst.id+'">+ платёж</button>'
      + '</div>';
  }
  function instIsClosed(inst){
    var pays = inst.payments||[];
    if(!pays.length) return false;
    return pays.every(function(x){ return paymentStateForDate(x.date, sim, today).code==='paid'; });
  }
  var activeInsts = insts.filter(function(i){ return !instIsClosed(i); });
  var closedInsts = insts.filter(instIsClosed);
  closedCount = closedInsts.length;
  var cardsHtml = activeInsts.map(instCard).join('');
  var closedHtml = closedInsts.map(instCard).join('');

  return debtsStorageWarning()
    + '<div class="card"><div class="card-title"><h2 style="font-size:16px;">Рассрочки</h2></div>'
    + form
    + '<div class="info-box" style="margin-bottom:12px;">Платёж оплачивается из последней выплаты до его даты: при выплатах 05.05 и 20.05 платёж 07.05 попадёт в выплату 05.05. Платежи разных покупок в одну дату складываются. В выплате они списываются сразу после расходов по категориям, до кредитки и копилок.</div>'
    + '<h3 style="font-size:14px;margin:4px 0 8px;">Общий график платежей</h3>'
    + schedule
    + (activeInsts.length ? '<h3 style="font-size:14px;margin:16px 0 8px;">Покупки</h3><div class="grid cols-2">'+cardsHtml+'</div>' : '')
    + (closedCount ? '<details style="margin-top:14px;"><summary class="muted" style="cursor:pointer;font-size:13px;">Закрытые покупки ('+closedCount+')</summary><div class="grid cols-2" style="margin-top:8px;opacity:.7;">'+closedHtml+'</div></details>' : '')
    + (insts.length && !activeInsts.length ? '<div class="muted" style="font-size:13px;margin-top:10px;">Все покупки в рассрочку закрыты.</div>' : '')
    + '</div>';
}

/* ---------- categories ---------- */
function renderCategories(sim){
  var total = categoriesTemplateTotal(state);
  var latestOk = latestOkladEntry(state);
  var oklad = latestOk ? latestOk.amount : 0;
  var okladNet = estimateMonthlyNet(oklad, state.ndfl.brackets);
  var cards = state.categories.map(function(c,idx){
    var planned = categoryPlannedTotal(c);
    var pct = okladNet>0 ? (planned*2/okladNet*100).toFixed(1)+'%' : '—';
    var itemsHtml = (c.items||[]).map(function(it,ii){
      var seasonRow = it.season ? '<div class="row wrap" style="gap:6px;margin:-2px 0 6px;padding-left:2px;">'
          + '<span class="pill ok" style="font-size:9px;">сезон</span>'
          + '<input type="text" style="width:58px;" placeholder="01.10" data-item-season-from data-cat="'+c.id+'" data-idx="'+ii+'" value="'+formatDM(it.season.from)+'">'
          + '<span class="muted">–</span>'
          + '<input type="text" style="width:58px;" placeholder="31.03" data-item-season-to data-cat="'+c.id+'" data-idx="'+ii+'" value="'+formatDM(it.season.to)+'">'
          + '<button class="ghost small" data-item-season-clear data-cat="'+c.id+'" data-idx="'+ii+'">✕ сезон</button>'
          + '</div>' : '';
      return '<div class="item-row" style="grid-template-columns:1fr 110px auto auto;">'
        + '<input type="text" data-item-name data-cat="'+c.id+'" data-idx="'+ii+'" value="'+esc(it.name)+'">'
        + '<input type="text" inputmode="numeric" class="num" data-item-amount data-cat="'+c.id+'" data-idx="'+ii+'" value="'+it.amount+'">'
        + (it.season ? '<span></span>' : '<button class="ghost small" data-item-season-add data-cat="'+c.id+'" data-idx="'+ii+'" title="сделать сезонной">📅</button>')
        + '<button class="ghost small" data-del-item data-cat="'+c.id+'" data-idx="'+ii+'">✕</button>'
        + '</div>' + seasonRow;
    }).join('');
    var catSeasonRow = c.season ? '<div class="row wrap" style="gap:6px;margin:6px 0;">'
        + '<span class="pill ok" style="font-size:10px;">сезонная категория</span>'
        + '<input type="text" style="width:64px;" placeholder="01.12" data-cat-season-from data-cat="'+c.id+'" value="'+formatDM(c.season.from)+'">'
        + '<span class="muted">–</span>'
        + '<input type="text" style="width:64px;" placeholder="20.03" data-cat-season-to data-cat="'+c.id+'" value="'+formatDM(c.season.to)+'">'
        + '<button class="ghost small" data-cat-season-clear="'+c.id+'">✕ сезон</button>'
        + '</div>' : '<button class="small ghost" data-cat-season-add="'+c.id+'" style="margin:6px 0;">+ сделать сезонной</button>';
    return '<div class="cat-card">'
      + '<div class="row between">'
      + '<input type="text" style="font-weight:700;font-size:14px;border:none;background:transparent;padding:2px 0;" data-cat-name data-cat="'+c.id+'" value="'+esc(c.name)+'">'
      + '<div class="priority-controls row">'
      + '<button class="ghost small" data-cat-up="'+c.id+'" '+(idx===0?'disabled':'')+'>↑</button>'
      + '<button class="ghost small" data-cat-down="'+c.id+'" '+(idx===state.categories.length-1?'disabled':'')+'>↓</button>'
      + '<button class="ghost small" data-cat-del="'+c.id+'">✕</button>'
      + '</div></div>'
      + catSeasonRow
      + (c.items && c.items.length ? itemsHtml + '<button class="small ghost" data-add-item="'+c.id+'">+ статья</button>'
          : '<div style="margin-top:6px;"><label>Сумма за период</label><input type="text" inputmode="numeric" class="num" data-cat-amount data-cat="'+c.id+'" value="'+c.amount+'"><button class="small ghost" data-add-item="'+c.id+'" style="margin-top:6px;">+ разбить на статьи</button></div>')
      + '<div class="row between muted" style="font-size:12px;margin-top:8px;"><span>Итого за период'+(c.season?' (в сезон)':'')+'</span><span class="num">'+fmt(planned)+' ('+pct+' от дохода на руки ×2)</span></div>'
      + '<div class="row between muted" style="font-size:12px;"><span>Итого за месяц'+(c.season?' (в сезон)':'')+'</span><span class="num">'+fmt(planned*2)+'</span></div>'
      + '</div>';
  }).join('');
  return '<div class="card"><div class="card-title"><h2 style="font-size:16px;">Категории расходов (шаблон на каждый период выплаты)</h2>'
    + '<button class="small" data-add-cat>+ категория</button></div>'
    + '<div class="info-box" style="margin-bottom:12px;">Эти суммы применяются как план к каждому периоду выплаты (2 раза в месяц). Итого по шаблону: <b>'+fmt(total)+'</b> за период, <b>'+fmt(total*2)+'</b> в месяц. Фактические расходы конкретного периода можно скорректировать на вкладке «Доходы». Категорию целиком или отдельную статью можно сделать <b>сезонной</b> — тогда сумма учитывается только в периоды внутри указанного диапазона дат (ДД.ММ–ДД.ММ, можно через рубеж года, например 01.12–20.03); вне сезона она в этот период не расходуется.</div>'
    + '<div class="grid cols-2">' + cards + '</div></div>';
}

/* ---------- факт: расходы по месяцам ---------- */
function activeFactMonth(){
  if(ui.factMonth>=1 && ui.factMonth<=12) return ui.factMonth;
  return parseInt(todayISO().slice(5,7),10);
}
function renderFacts(sim){
  var year = currentYear(state);
  if(year==null) return '<div class="card"><div class="muted">Сначала добавьте периоды выплат.</div></div>';
  var m = activeFactMonth();
  var ym = monthKey(year, m);
  var monthTabs = '<div class="month-tabs">' + MONTH_NAMES.slice(1).map(function(name, i){
      var mm = i+1;
      var plan = state.categories.reduce(function(sum,c){ return sum + categoryPlanForMonth(state, c, year, mm); },0);
      var fact = actualMonthTotal(state, monthKey(year,mm));
      var cls = factRowClass(plan, fact, fact>0);
      var dot = cls==='fact-over' ? ' ●' : (cls==='fact-under' ? ' ●' : (fact>0 ? ' ●' : ''));
      var color = cls==='fact-over' ? 'var(--danger)' : (cls==='fact-under' ? 'var(--good)' : 'var(--muted)');
      return '<button class="small'+(mm===m?' active':'')+'" data-fact-month="'+mm+'">'+name.slice(0,3)
        + (dot ? '<span style="color:'+color+';">'+dot+'</span>' : '') + '</button>';
    }).join('') + '</div>';

  var totalPlan = 0, totalFact = 0;
  var histPill = ' <span class="pill warn" style="font-size:9px;">нет в плане</span>';
  function factInput(catId, itemName, value){
    return '<input type="text" inputmode="numeric" class="num fact-input" data-fact-amount data-cat="'+catId
      + '" data-item="'+esc(itemName||'')+'" value="'+(value||'')+'" placeholder="0">';
  }
  function factRow(label, plan, fact, input, opts){
    opts = opts || {};
    var entered = opts.entered!=null ? opts.entered : fact>0;
    var cls = (opts.item ? 'fact-item ' : '') + factRowClass(plan, fact, entered);
    return '<tr class="'+cls+'"><td'+(opts.item?' class="muted"':'')+'>'+label+'</td>'
      + '<td class="num">'+fmt(plan)+'</td>'
      + '<td class="num">'+input+'</td>'
      + '<td class="num diff">'+(entered ? fmtSigned(fact-plan) : '')+'</td></tr>';
  }
  /* строки берутся из текущих «Категорий», а всё, по чему за этот год есть факт,
     но в плане уже нет, добавляется отдельными строками с пометкой «нет в плане» */
  function categoryRows(c, planByDefault){
    var plan = planByDefault ? categoryPlanForMonth(state, c, year, m) : 0;
    var fact = actualCategorySum(state, ym, c.id);
    var entry = actualEntry(state, ym, c.id);
    var hasItems = !!(c.items && c.items.length);
    var planItemNames = hasItems ? c.items.map(function(it){ return it.name; }) : [];
    var extraNames = factYearItemNames(state, year, c.id).filter(function(nm){ return planItemNames.indexOf(nm)===-1; });
    totalPlan += plan; totalFact += fact;
    var showItems = hasItems || extraNames.length;
    var label = '<b>'+esc(c.name)+'</b>'+(c.season?' <span class="muted" style="font-size:10px;">сезон</span>':'')+(planByDefault?'':histPill);
    var catInput = showItems
      ? '<b class="num">'+fmt(fact)+'</b><div class="small-note" style="margin:0;">сумма статей</div>'
      : factInput(c.id, '', entry && entry.total ? entry.total : '');
    var enteredCat = showItems ? fact>0 : !!(entry && entry.total);
    var html = factRow(label, plan, fact, catInput, { entered:enteredCat });
    if(hasItems){
      html += c.items.map(function(it){
        var iPlan = planByDefault ? itemPlanForMonth(state, c, it, year, m) : 0;
        var iFact = actualItemAmount(state, ym, c.id, it.name);
        return factRow(esc(it.name), iPlan, iFact, factInput(c.id, it.name, iFact), { item:true });
      }).join('');
    }
    html += extraNames.map(function(nm){
      var iFact = actualItemAmount(state, ym, c.id, nm);
      return factRow(esc(nm)+histPill, 0, iFact, factInput(c.id, nm, iFact), { item:true });
    }).join('');
    /* сумма, внесённая по категории целиком ещё до того, как у неё появились статьи */
    if(showItems && entry && entry.total){
      html += factRow('по категории целиком', 0, entry.total, factInput(c.id, '', entry.total), { item:true });
    }
    return html;
  }
  var planIds = {};
  state.categories.forEach(function(c){ planIds[c.id] = true; });
  var histCats = factYearCategoryIds(state, year).filter(function(cid){ return !planIds[cid]; })
    .map(function(cid){ return { id:cid, name: storedCategoryName(state, year, cid) || cid, items:[] }; });
  var rows = state.categories.map(function(c){ return categoryRows(c, true); }).join('')
    + histCats.map(function(c){ return categoryRows(c, false); }).join('');
  var totalCls = factRowClass(totalPlan, totalFact, totalFact>0);

  var yearRows = '';
  var yPlan = 0, yFact = 0;
  for(var mm=1; mm<=12; mm++){
    var pSum = state.categories.reduce(function(sum,c){ return sum + categoryPlanForMonth(state, c, year, mm); },0);
    var fSum = actualMonthTotal(state, monthKey(year,mm));
    yPlan += pSum; yFact += fSum;
    var cls2 = factRowClass(pSum, fSum, fSum>0);
    yearRows += '<tr class="'+cls2+'"><td>'+MONTH_NAMES[mm]+'</td><td class="num">'+fmt(pSum)+'</td>'
      + '<td class="num">'+(fSum?fmt(fSum):'—')+'</td><td class="num diff">'+(fSum?fmtSigned(fSum-pSum):'')+'</td></tr>';
  }

  return debtsStorageWarning()
    + yearTabsNav(state)
    + '<div class="card"><div class="card-title"><h2 style="font-size:16px;">Фактические расходы '+year+'</h2></div>'
    + '<div class="info-box" style="margin-bottom:12px;">Здесь вносятся <b>фактические</b> траты по месяцам. На план они не влияют и в расчёт выплат не попадают — нужны только для сравнения. План месяца берётся из шаблона «Категорий»: сумма категории за период × число выплат этого месяца, с учётом сезонов. Ручные правки расходов в карточках выплат здесь не учитываются — так видно отклонение факта от изначального плана года. Если выплат за месяц в плане нет, плана нет и строка не подсвечивается. Цвет строки: факт меньше плана — зелёный, разница в пределах 5% — обычный фон, факт больше плана более чем на 5% — красный. У категории со статьями факт складывается из статей. Список берётся из раздела «Категории», но факт хранится отдельно по каждому году: если позже категорию или статью убрать из плана, внесённые за прошлый год суммы останутся здесь с пометкой «нет в плане». При переименовании категории или статьи факт переезжает вместе с названием.</div>'
    + monthTabs
    + '<div class="debt-stats">'
    + '<div><div class="v">'+fmt(totalPlan)+'</div><div class="l">План на '+MONTH_NAMES[m].toLowerCase()+'</div></div>'
    + '<div><div class="v">'+fmt(totalFact)+'</div><div class="l">Факт</div></div>'
    + '<div><div class="v" style="color:'+(totalCls==='fact-over'?'var(--danger)':(totalCls==='fact-under'?'var(--good)':'var(--ink)'))+';">'+(totalFact?fmtSigned(totalFact-totalPlan):'—')+'</div><div class="l">Разница</div></div>'
    + '</div>'
    + '<div class="table-scroll"><table><tr><th>Категория</th><th class="num">План</th><th class="num">Факт</th><th class="num">Разница</th></tr>'
    + rows
    + '<tr class="'+totalCls+'"><td><b>Итого за '+MONTH_NAMES[m].toLowerCase()+'</b></td><td class="num"><b>'+fmt(totalPlan)+'</b></td><td class="num"><b>'+fmt(totalFact)+'</b></td><td class="num diff"><b>'+(totalFact?fmtSigned(totalFact-totalPlan):'')+'</b></td></tr>'
    + '</table></div>'
    + '<h3 style="font-size:14px;margin:18px 0 8px;">План и факт по месяцам</h3>'
    + '<div class="table-scroll"><table><tr><th>Месяц</th><th class="num">План</th><th class="num">Факт</th><th class="num">Разница</th></tr>'
    + yearRows
    + '<tr><td><b>Итого за год</b></td><td class="num"><b>'+fmt(yPlan)+'</b></td><td class="num"><b>'+(yFact?fmt(yFact):'—')+'</b></td><td class="num diff"><b>'+(yFact?fmtSigned(yFact-yPlan):'')+'</b></td></tr>'
    + '</table></div>'
    + '</div>';
}

/* ---------- goals ---------- */
function renderGoals(sim){
  var sorted = state.goals.slice().sort(function(a,b){return a.priority-b.priority;});
  var cards = sorted.map(function(g,idx){
    var hasSub = g.subgoals && g.subgoals.length;
    var finalTarget = goalFinalTarget(g);
    var saved = goalCumulativeProgress(g, sim);
    var potBalance = goalBalanceAt(g, sim, todayISO());
    var pctRaw = finalTarget>0 ? Math.round(saved/finalTarget*100) : 0;
    var pct = Math.max(0, Math.min(100, pctRaw));
    var achievements = milestoneAchievements(g, sim);
    var wdHtml = '', inHtml = '';
    (g.withdrawals||[]).forEach(function(w,wi){
      var incoming = (w.amount||0) < 0;
      var wName = (w.note!=null && w.note!=='') ? w.note : (w.label||'');
      var row = '<div class="item-row wd-row">'
        + '<input type="date" data-wd-date data-goal="'+g.id+'" data-idx="'+wi+'" value="'+w.date+'">'
        + '<input type="text" placeholder="Название" data-wd-note data-goal="'+g.id+'" data-idx="'+wi+'" value="'+esc(wName)+'">'
        + '<input type="text" inputmode="numeric" class="num" '+(incoming?'data-wd-in-amount':'data-wd-amount')+' data-goal="'+g.id+'" data-idx="'+wi+'" value="'+Math.abs(w.amount||0)+'">'
        + '<button class="ghost small" data-wd-del data-goal="'+g.id+'" data-idx="'+wi+'">✕</button>'
        + '</div>';
      if(incoming) inHtml += row; else wdHtml += row;
    });
    var canRedistribute = g.completed && potBalance >= 1;
    var milestonesBlock;
    if(hasSub){
      var subRows = g.subgoals.map(function(sg,si){
        var pill = milestoneStatusPill(sg, achievements[si]?achievements[si].achievedDate:null);
        return '<div class="item-row" style="grid-template-columns:1.3fr 1fr 1fr auto;align-items:center;">'
          + '<input type="text" data-sub-name data-goal="'+g.id+'" data-idx="'+si+'" value="'+esc(sg.name)+'">'
          + '<input type="text" inputmode="numeric" class="num" data-sub-target data-goal="'+g.id+'" data-idx="'+si+'" value="'+sg.target+'">'
          + '<input type="date" data-sub-deadline data-goal="'+g.id+'" data-idx="'+si+'" value="'+(sg.deadline||'')+'">'
          + '<button class="ghost small" data-sub-del data-goal="'+g.id+'" data-idx="'+si+'">✕</button>'
          + '</div>'
          + '<div style="margin:-4px 0 8px;"><span class="pill '+pill.cls+'" style="font-size:10px;">'+pill.label+'</span></div>';
      }).join('');
      milestonesBlock = '<div class="small-note" style="margin-bottom:6px;">Подцели копилки (без срока — оставьте дату пустой, тогда покажем прогноз).</div>'
        + subRows
        + '<div class="row" style="gap:8px;margin-top:4px;"><button class="small ghost" data-sub-add="'+g.id+'">+ подцель</button><button class="small ghost" data-sub-clear="'+g.id+'">Убрать подцели</button></div>';
    } else {
      var deadlineNote;
      if(g.deadline){
        var soloPill1 = milestoneStatusPill(goalMilestones(g)[0], achievements[0].achievedDate);
        deadlineNote = '<div class="small-note" style="margin-top:2px;"><span class="pill '+soloPill1.cls+'" style="font-size:10px;">'+soloPill1.label+'</span></div>';
      } else {
        deadlineNote = '<div class="small-note">'+(achievements[0].achievedDate ? (achievements[0].achievedDate==='pre' ? 'Цель уже накоплена (покрыта начальным остатком)' : 'Прогноз: цель будет накоплена к <b>'+ruDate(achievements[0].achievedDate)+'</b>') : 'При текущем плане цель не будет достигнута в пределах '+esc(planYearsLabel(state))+' года')+'</div>';
      }
      milestonesBlock = '<div class="grid cols-3" style="margin-top:10px;">'
        + '<div><label>Цель, ₽</label><input type="text" inputmode="numeric" class="num" data-goal-target data-goal="'+g.id+'" value="'+g.target+'"></div>'
        + '<div><label>Срок (можно оставить пустым)</label><input type="date" data-goal-deadline data-goal="'+g.id+'" value="'+(g.deadline||'')+'"></div>'
        + '<div><label>Начальный остаток</label><input type="text" inputmode="numeric" class="num" data-goal-start data-goal="'+g.id+'" value="'+g.startingBalance+'"></div>'
        + '</div>' + deadlineNote
        + '<button class="small ghost" data-sub-add="'+g.id+'" style="margin-top:8px;">+ разбить на подцели (этапы)</button>';
    }
    return '<div class="goal-card">'
      + '<div class="goal-top">'
      + '<input type="text" style="font-weight:700;font-size:15px;border:none;background:transparent;flex:1;min-width:120px;" data-goal-name data-goal="'+g.id+'" value="'+esc(g.name)+'">'
      + '<div class="priority-controls row">'
      + '<span class="pill">приоритет '+g.priority+'</span>'
      + '<button class="ghost small" data-goal-up="'+g.id+'" '+(idx===0?'disabled':'')+'>↑</button>'
      + '<button class="ghost small" data-goal-down="'+g.id+'" '+(idx===sorted.length-1?'disabled':'')+'>↓</button>'
      + '<button class="ghost small" data-goal-del="'+g.id+'">✕</button>'
      + '</div></div>'
      + '<div class="progress'+(pctRaw>100?' over':'')+'" style="margin:8px 0;"><i style="width:'+pct+'%"></i></div>'
      + '<div class="row between muted num" style="font-size:12px;">'+fmt(saved)+' / '+fmt(finalTarget)+' ('+pct+'%)</div>'
      + '<div class="muted" style="font-size:12px;">на счету сейчас ('+ruDate(todayISO())+'): <b class="num" style="color:var(--ink);">'+fmt(potBalance)+'</b></div>'
      + '<hr class="sep">'
      + milestonesBlock
      + '<div class="row wrap between" style="margin-top:10px;gap:8px;">'
      + '<label class="row" style="align-items:center;gap:6px;margin:0;text-transform:none;letter-spacing:0;"><input type="checkbox" style="width:auto;" data-goal-completed data-goal="'+g.id+'" '+(g.completed?'checked':'')+'> <span class="muted" style="font-size:12px;">цель выполнена / закрыта</span></label>'
      + (canRedistribute ? '<button class="small" data-redistribute="'+g.id+'">Перераспределить остаток '+fmt(potBalance)+'</button>' : '')
      + '</div>'
      + (hasSub ? '<div class="small-note">Начальный остаток: <input type="text" inputmode="numeric" class="num" style="display:inline-block;width:120px;" data-goal-start data-goal="'+g.id+'" value="'+g.startingBalance+'"></div>' : '')
      + '<hr class="sep">'

      + (inHtml ? '<div class="row between" style="margin-top:8px;"><b style="font-size:12px;">Пополнения из других копилок</b></div>' + inHtml : '')

  return '<div class="card"><div class="card-title"><h2 style="font-size:16px;">Цели накоплений</h2><button class="small" data-add-goal>+ цель</button></div>'
    + '<div class="info-box" style="margin-bottom:12px;">Свободный остаток каждого периода распределяется автоматически по <b>срочности</b>, а не жёстко по приоритету: сначала деньги получает та цель (или текущий этап), которой нужно откладывать больше в расчёте на период, чтобы успеть к своему сроку — даже если её приоритет ниже. Так цель с более ранним сроком не срывается только из-за того, что выше в списке стоит другая цель, у которой запас времени ещё большой. При этом цель с высоким приоритетом не страдает: как только у неё самой срок начинает поджимать, её собственная потребность в деньгах на период растёт и она снова получает деньги в первую очередь. Приоритет решает только при равной срочности (например, между целями без срока) — их пополнение идёт по приоритету, стрелками. Как только цель (или текущий этап) набирает свою сумму, пополнение прекращается и излишек идёт следующей по срочности цели. Можно переопределить вручную в карточке периода. Цель можно разбить на подцели (этапы) — например «к 1 апреля накопить 150 000, потратить, затем к 31 июля накопить ещё 315 000» — каждая со своим сроком или без него. <b>Общая цель на карточке = сумма всех этапов</b> (150 000 + 315 000 = 465 000): это сколько всего денег пройдёт через копилку за год, а не остаток на счету в моменте — фактический остаток («на счету сейчас») показан отдельной строкой, если он отличается.</div>'
    + cards + '</div>';
}

function renderVacations(sim){
  var activeYear = currentYear(state);

    return y===activeYear || years.indexOf(y)===-1;
  }
  var vacs = state.vacations.filter(function(v){ return inActiveYear(v.start); });
  var vacHtml = vacs.map(function(v){
    var formula = calcVacationPayFormula(v, state);
    var avg = v.start ? avgDailyEarnings(v.start, state) : 0;
    var days = vacationDays(v);
    var payout = vacationPayoutDate(v, state);

      ? payouts.map(function(x){
          return '<div class="row between" style="font-size:12.5px;padding:3px 0;">'

            + '<span class="num">'+fmt(x.amount)+'</span></div>';

      + '<div class="row between"><input type="text" style="font-weight:700;font-size:14px;border:none;background:transparent;" data-vac-note data-id="'+v.id+'" value="'+esc(v.note||'')+'" placeholder="Название отпуска"><button class="ghost small" data-vac-del="'+v.id+'">✕</button></div>'
      + '<div class="grid cols-4" style="margin-top:6px;">'
      + '<div><label>Начало</label><input type="date" data-vac-start data-id="'+v.id+'" value="'+(v.start||'')+'"></div>'
      + '<div><label>Конец</label><input type="date" data-vac-end data-id="'+v.id+'" value="'+(v.end||'')+'"></div>'
      + '<div><label>Календарных дней</label><input type="text" class="num" value="'+days+'" disabled title="Считается по датам начала и конца"></div>'
      + '<div><label>Отпускные (к выплате)</label><input type="text" inputmode="numeric" class="num" data-vac-pay data-id="'+v.id+'" value="'+v.manualPay+'"></div>'
      + '</div>'
      + '<div class="small-note">Средний дневной заработок за 12 мес: <b class="num">'+fmt(avg)+'</b>. Формула (дней × средний): <b class="num">'+(formula==null?'—':fmt(formula))+'</b>. '
      + '<button class="small ghost" data-vac-apply-formula="'+v.id+'" style="margin-left:6px;">Подставить по формуле</button></div>'
      + '<div class="small-note">Отпускные выплачивают <b>'+(payout?ruDate(payout):'—')+'</b> — это первый рабочий день до начала отпуска.</div>'
      + '<hr class="sep">'
      + '<div style="font-size:12px;font-weight:700;margin-bottom:2px;">Как распределяются по выплатам</div>'
      + payoutsHtml
      + '</div>';

  var sicks = state.sickLeaves.filter(function(sl){ return inActiveYear(sl.start); });
  var sickHtml = sicks.map(function(sl){
    var days = vacationDays(sl);
    return '<div class="item-row" style="grid-template-columns:1fr 1fr 70px 1fr auto;">'
      + '<input type="date" data-sick-start data-id="'+sl.id+'" value="'+(sl.start||'')+'">'
      + '<input type="date" data-sick-end data-id="'+sl.id+'" value="'+(sl.end||'')+'">'
      + '<input type="text" class="num" value="'+days+'" disabled title="Календарных дней">'

      + '<button class="ghost small" data-sick-del="'+sl.id+'">✕</button>'

    + '<div class="card"><div class="card-title"><h2 style="font-size:16px;">Отпуска'+(activeYear!=null?' '+activeYear:'')+'</h2><button class="small" data-add-vac>+ отпуск</button></div>'
    + '<div class="info-box" style="margin-bottom:12px;">Отпускные делятся между выплатами пропорционально дням отпуска, попавшим в <b>расчётный период</b> каждой выплаты: аванс 20-го числа начислен за 1–15 число этого месяца, зарплата 5-го — за 16-е – конец прошлого месяца. Отпуск 02.08–15.08 целиком попадает в расчётный период выплаты 20.08, а отпуск 10.08–17.08 делится между выплатами 20.08 и 05.09 по числу дней. У нового отпуска и при смене дат сумма пересчитывается по формуле; править её можно только здесь — в карточке выплаты она только для просмотра. Дни отпуска не входят в отработанные дни при расчёте аванса и зарплаты.</div>'
    + (vacHtml || '<div class="muted" style="font-size:13px;">Отпусков в этом году нет.</div>')
    + '</div>'
    + '<div class="card"><div class="card-title"><h2 style="font-size:16px;">Больничные'+(activeYear!=null?' '+activeYear:'')+'</h2><button class="small" data-add-sick>+ больничный</button></div>'
    + '<div class="small-note" style="margin-bottom:8px;">Дни больничного в расчётном месяце уменьшают коэффициент 29.3 пропорционально — это снижает средний заработок за такой месяц при расчёте отпускных. Дни больничного также не входят в отработанные дни аванса и зарплаты.</div>'
    + (sickHtml || '<div class="muted" style="font-size:13px;">Больничных в этом году нет.</div>')
    + '</div>';
}

    + '• <b>Производственный календарь</b>: нерабочими считаются выходные, стандартные праздники (одни и те же для всех лет) и добавленные вручную даты. Число рабочих дней месяца можно исправить вручную — тогда расчёт идёт по нему.<br>• <b>Аванс/зарплата</b>: средний заработок за рабочий день = оклад ÷ рабочих дней в месяце; сумма периода = средний заработок × отработанные дни в 1-й (1–15) или 2-й (16 – конец месяца) половине месяца. Отработанные — рабочие дни по календарю выше, кроме дней отпусков и больничных; для каждого дня берётся оклад, действовавший в этот день (последняя по дате запись).<br>'
    + '• <b>НДФЛ и «на руки»</b>: налог считается нарастающим итогом за календарный год выплаты по прогрессивной шкале выше — в годовой доход по порядку дат входят все выплаты этого года (зарплата и отпускные). Чем больше уже получено в году, тем выше ставка на следующий рубль.<br>'
    + '• <b>Отпускные</b>: средний дневной заработок = сумма дохода за 12 месяцев до отпуска ÷ сумма коэффициентов (29.3 на полностью отработанный месяц, пропорционально меньше — если в месяце были больничные); отпускные = средний дневной заработок × число календарных дней отпуска. При повышении оклада внутри 12-месячного окна более ранние месяцы индексируются пропорционально. Доход, который вы вписываете по периодам и за 2026 год, должен быть <b>без отпускных</b> — они прибавляются к доходу выплаты автоматически из раздела «Отпуска» — пропорционально дням отпуска, попавшим в расчётный период выплаты и не должны попадать в поле «Доход на руки» повторно.<br>'
    + '• <b>Сезонные категории</b>: категорию или отдельную статью можно ограничить датами (например 01.12–20.03) — тогда сумма учитывается только в периоды внутри этого диапазона, в остальное время не расходуется.<br>'
    + '• <b>Накопления и подцели</b>: цель можно разбить на подцели (этапы), каждый со своей суммой и (опционально) сроком; общая цель = сумма всех этапов, а прогресс копится нарастающим итогом — уже пройденный этап засчитан навсегда, даже если деньги потом потратили. На каждый период считается «сколько нужно отложить, чтобы успеть к сроку текущего этапа» = (сумма этапа − уже отложено в его рамках) ÷ (периодов до срока) — это и есть срочность копилки на данный момент. Свободный остаток распределяется не жёстко по приоритету, а по срочности: первой получает деньги та копилка, которой в пересчёте на период нужно больше, даже если её приоритет ниже — так цель с ближним сроком не сдвигается ради цели с большим запасом времени. Приоритет остаётся решающим только когда срочность одинаковая (например, у целей без срока). Как только копилка (или её текущий этап) набирает нужную сумму, пополнение останавливается и излишек уходит следующей по срочности цели. Цель без срока получает то, что осталось после срочных целей, а прогресс показывается как прогнозируемая дата достижения при текущем плане.<br>'
    + '• <b>Фиксация периодов</b>: периоды с датой в прошлом фиксируются автоматически и хранятся как факт — изменения настроек их больше не пересчитывают. Период можно зафиксировать и вручную кнопкой «🔒» в его карточке; зафиксированный период остаётся редактируемым, просто перестаёт двигаться от авто-расчёта, пока его не разблокировать.'
    + '</div>');
}

      instDraft[el.getAttribute('data-inst-new')] = el.value;
      var pv = document.getElementById('inst-preview');
      if(pv) pv.textContent = instPreviewText(instDraft);
    };
    el.addEventListener('input', onEdit);
    el.addEventListener('change', onEdit);
  });
  root.querySelectorAll('[data-submit-add-inst]').forEach(function(b){ b.addEventListener('click', function(){
    if(!instDraft) return;
    var d = instDraft, total = parseNum(d.total), parts = parseNum(d.parts);
    var err = !(total>0) ? 'Укажите сумму покупки.' : !(parts>=1) ? 'Укажите, на сколько частей делится покупка.' : !d.firstDate ? 'Укажите дату первого платежа.' : '';
    if(err){ var e = document.getElementById('inst-error'); if(e) e.textContent = err; return; }
    state.debts.installments.push({ id:uid('inst'), name:(d.name||'').trim() || 'Покупка', total:total, parts:parts,
      interval:d.interval==='1m'?'1m':'2w', firstDate:d.firstDate, payments: buildInstallmentSchedule(total, parts, d.firstDate, d.interval) });
    instDraft = null;
    scheduleSave();
  }); });
  root.querySelectorAll('[data-inst-del]').forEach(function(b){ b.addEventListener('click', function(){
    var id = b.getAttribute('data-inst-del'), inst = findInst(id);
    if(!inst) return;
    if(!confirm('Удалить рассрочку «'+(inst.name||'Покупка')+'» и все её платежи?')) return;
    state.debts.installments = state.debts.installments.filter(function(x){ return x.id!==id; });
    scheduleSave();
  }); });
  bindChange('[data-inst-name]', function(el){ var i=findInst(el.dataset.inst); if(i) i.name=el.value; });
  bindChange('[data-inst-param]', function(el){
    var i = findInst(el.dataset.inst); if(!i) return;
    var key = el.getAttribute('data-inst-param'), before = JSON.stringify([i.total,i.parts,i.firstDate,i.interval]);
    if(key==='total') i.total = Math.max(0, parseNum(el.value));
    else if(key==='parts') i.parts = Math.max(1, parseNum(el.value));
    else if(key==='firstDate'){ if(el.value) i.firstDate = el.value; }
    else if(key==='interval') i.interval = el.value==='1m'?'1m':'2w';
    if(before!==JSON.stringify([i.total,i.parts,i.firstDate,i.interval]) && i.firstDate){
      i.payments = buildInstallmentSchedule(i.total, i.parts, i.firstDate, i.interval);

  });
  root.querySelectorAll('[data-ip-add]').forEach(function(b){ b.addEventListener('click', function(){
    var i = findInst(b.getAttribute('data-ip-add')); if(!i) return;
    var last = i.payments.length ? i.payments[i.payments.length-1].date : '';
    var date = last ? (i.interval==='1m' ? addMonthsISO(last,1) : addDaysISO(last,14)) : (i.firstDate || todayISO());
    i.payments.push({ id:uid('ip'), date:date, amount:0 });
    scheduleSave();
  }); });
  root.querySelectorAll('[data-ip-del]').forEach(function(b){ b.addEventListener('click', function(){
    var i = findInst(b.dataset.inst); if(i){ i.payments.splice(parseInt(b.dataset.idx,10),1); scheduleSave(); }
  }); });
  bindChange('[data-ip-date]', function(el){ var i=findInst(el.dataset.inst); if(i && el.value) i.payments[parseInt(el.dataset.idx,10)].date=el.value; });
  bindChange('[data-ip-amount]', function(el){ var i=findInst(el.dataset.inst); if(i) i.payments[parseInt(el.dataset.idx,10)].amount=Math.max(0,parseNum(el.value)); });

  root.querySelectorAll('[data-toggle-past]').forEach(function(b){ b.addEventListener('click', function(){

  }); });
  root.querySelectorAll('[data-wd-add]').forEach(function(b){ b.addEventListener('click', function(){
    var g=findGoal(b.getAttribute('data-wd-add')); if(g){ g.withdrawals.push({date:todayISO(),amount:0,note:'',label:''}); scheduleSave(); }
  }); });
  root.querySelectorAll('[data-wd-del]').forEach(function(b){ b.addEventListener('click', function(){
    var g=findGoal(b.dataset.goal); if(g){ g.withdrawals.splice(parseInt(b.dataset.idx,10),1); scheduleSave(); }
  }); });
  bindChange('[data-wd-date]', function(el){ var g=findGoal(el.dataset.goal); if(g) g.withdrawals[parseInt(el.dataset.idx,10)].date=el.value; });
  bindChange('[data-wd-amount]', function(el){ var g=findGoal(el.dataset.goal); if(g) g.withdrawals[parseInt(el.dataset.idx,10)].amount=Math.abs(parseNum(el.value)); });
  bindChange('[data-wd-note]', function(el){

  /* goal subgoals (milestones) */
  root.querySelectorAll('[data-sub-add]').forEach(function(b){ b.addEventListener('click', function(){
    var g = findGoal(b.getAttribute('data-sub-add'));
    if(g){
      if(!g.subgoals || !g.subgoals.length){
        g.subgoals = [
          { id:uid('sub'), name:'Этап 1', target: g.target||0, deadline: g.deadline||'' },
          { id:uid('sub'), name:'Этап 2', target: g.target||0, deadline:'' }
        ];

        g.subgoals.push({ id:uid('sub'), name:'Новый этап', target:0, deadline:'' });

  root.querySelectorAll('[data-sub-clear]').forEach(function(b){ b.addEventListener('click', function(){
    var g = findGoal(b.getAttribute('data-sub-clear'));
    if(g && g.subgoals && g.subgoals.length){
      var last = g.subgoals[g.subgoals.length-1];
      g.target = last.target; g.deadline = last.deadline||'';
      g.subgoals = [];
      scheduleSave();
    }
  }); });
  root.querySelectorAll('[data-sub-del]').forEach(function(b){ b.addEventListener('click', function(){
    var g = findGoal(b.dataset.goal); if(g){ g.subgoals.splice(parseInt(b.dataset.idx,10),1); scheduleSave(); }
  }); });
  bindChange('[data-sub-name]', function(el){ var g=findGoal(el.dataset.goal); if(g) g.subgoals[parseInt(el.dataset.idx,10)].name=el.value; });
  bindChange('[data-sub-target]', function(el){ var g=findGoal(el.dataset.goal); if(g) g.subgoals[parseInt(el.dataset.idx,10)].target=parseNum(el.value); });
  bindChange('[data-sub-deadline]', function(el){ var g=findGoal(el.dataset.goal); if(g) g.subgoals[parseInt(el.dataset.idx,10)].deadline=el.value; });

  /* settings: multi-year */
  root.querySelectorAll('[data-add-year]').forEach(function(b){ b.addEventListener('click', function(){
    var years = planYears(state);
    var newYear = (years.length ? years[years.length-1] : 2026) + 1;
    generateYearPeriods(newYear, state);
    ui.selectedYear = newYear;
    scheduleSave();
  }); });
  root.querySelectorAll('[data-del-year]').forEach(function(b){ b.addEventListener('click', function(){
    if(b.disabled) return;
    var y = parseInt(b.getAttribute('data-del-year'),10);
    var toRemove = state.periods.filter(function(p){ return p.monthRef.y===y; });
    if(toRemove.length){
      var ok = confirm('Удалить '+y+' год из плана?\n\nБудет удалено периодов: '+toRemove.length+'. Все их данные — фактические суммы, распределение по копилкам, доп. доходы, зафиксированные периоды — удалятся безвозвратно.');
      if(!ok) return;
    }
    state.periods = state.periods.filter(function(p){ return p.monthRef.y!==y; });
    toRemove.forEach(function(p){
      delete state.savingsOverrides[p.id];
      delete state.categoryOverrides[p.id];
      delete ui.openPeriods[p.id];
    });
    delete ui.openWdYears[y];
    if(ui.selectedYear===y) ui.selectedYear=null;
    scheduleSave();
  }); });
  root.querySelectorAll('[data-toggle-settings]').forEach(function(el){
    el.addEventListener('click', function(){
      var key = el.getAttribute('data-toggle-settings');
      ui.openSettings[key] = !ui.openSettings[key];
      render();
    });
  });
  root.querySelectorAll('[data-toggle-wd-year]').forEach(function(el){
    el.addEventListener('click', function(){
      var y = el.getAttribute('data-toggle-wd-year');
      ui.openWdYears[y] = !ui.openWdYears[y];
      render();
    });
  });

  /* settings: oklad */
  root.querySelectorAll('[data-add-oklad]').forEach(function(b){ b.addEventListener('click', function(){
    var lastOk = latestOkladEntry(state);
    state.oklad.history.push({effectiveFrom:todayISO(), amount: lastOk ? lastOk.amount : 0}); scheduleSave();
  }); });
  root.querySelectorAll('[data-oklad-del]').forEach(function(b){ b.addEventListener('click', function(){
    state.oklad.history.splice(parseInt(b.dataset.idx,10),1); scheduleSave();
  }); });
  bindChange('[data-oklad-date]', function(el){ state.oklad.history[parseInt(el.dataset.idx,10)].effectiveFrom = el.value; });
  bindChange('[data-oklad-amount]', function(el){ state.oklad.history[parseInt(el.dataset.idx,10)].amount = parseNum(el.value); });
  bindChange('[data-income26]', function(el){ state.income2026[parseInt(el.dataset.idx,10)] = parseNum(el.value); });

  /* settings: ndfl brackets */
  root.querySelectorAll('[data-add-ndfl]').forEach(function(b){ b.addEventListener('click', function(){
    var brackets = state.ndfl.brackets;
    brackets.splice(Math.max(0,brackets.length-1), 0, {upTo:1000000, rate:0.13});
    scheduleSave();
  }); });
  root.querySelectorAll('[data-ndfl-del]').forEach(function(b){ b.addEventListener('click', function(){
    state.ndfl.brackets.splice(parseInt(b.dataset.idx,10),1); scheduleSave();
  }); });
  bindChange('[data-ndfl-upto]', function(el){
    var idx = parseInt(el.dataset.idx,10), v = el.value.trim();
    state.ndfl.brackets[idx].upTo = v==='' ? null : parseNum(v);
    state.ndfl.brackets.sort(function(a,b){ return ndflBracketTop(a)-ndflBracketTop(b); });
  });
  bindChange('[data-ndfl-rate]', function(el){
    var idx = parseInt(el.dataset.idx,10);
    state.ndfl.brackets[idx].rate = Math.max(0, parseNum(el.value))/100;
  });

  /* vacations */
  root.querySelectorAll('[data-add-vac]').forEach(function(b){ b.addEventListener('click', function(){
    var t = todayISO();
    var v = {id:uid('vac'), start:t, end:t, note:'Отпуск', manualPay:0};
    state.vacations.push(v);
    var f = calcVacationPayFormula(v, state);
    v.manualPay = f!=null ? f : 0;
    scheduleSave();
  }); });
  root.querySelectorAll('[data-vac-del]').forEach(function(b){ b.addEventListener('click', function(){
    var id=b.getAttribute('data-vac-del'); state.vacations = state.vacations.filter(function(v){return v.id!==id;});
    state.periods.forEach(function(p){ p.assignedVacations = (p.assignedVacations||[]).filter(function(a){return a.id!==id;}); });
    scheduleSave();
  }); });
  root.querySelectorAll('[data-vac-apply-formula]').forEach(function(b){ b.addEventListener('click', function(){
    var v = state.vacations.find(function(v){return v.id===b.getAttribute('data-vac-apply-formula');});
    if(v){ var f = calcVacationPayFormula(v, state); if(f!=null) v.manualPay = f; scheduleSave(); }
  }); });
  bindChange('[data-vac-note]', function(el){ var v=findVac(el.dataset.id); if(v) v.note=el.value; });
  /* смена дат: отпускные пересчитываются по формуле, распределение по выплатам следует за датами */
  function onVacDatesChanged(v){
    var f = calcVacationPayFormula(v, state);
    if(f!=null) v.manualPay = f;
  }
  bindChange('[data-vac-start]', function(el){
    var v=findVac(el.dataset.id); if(!v || !el.value || el.value===v.start) return;
    v.start=el.value;
    if(v.end && v.end < v.start) v.end = v.start;
    onVacDatesChanged(v);
  });
  bindChange('[data-vac-end]', function(el){
    var v=findVac(el.dataset.id); if(!v || !el.value || el.value===v.end) return;
    v.end = el.value < v.start ? v.start : el.value;
    onVacDatesChanged(v);
  });
  root.querySelectorAll('[data-income-apply-formula]').forEach(function(b){ b.addEventListener('click', function(ev){
    ev.stopPropagation();
    var p = findPeriod(b.getAttribute('data-income-apply-formula'));
    var plan = computeSalaryNetPlan(state);
    if(p && plan[p.id]){ p.incomeActual = plan[p.id].net; scheduleSave(); }
  }); });
  bindChange('[data-vac-pay]', function(el){ var v=findVac(el.dataset.id); if(v) v.manualPay=parseNum(el.value); });

  /* sick leaves */
  root.querySelectorAll('[data-add-sick]').forEach(function(b){ b.addEventListener('click', function(){
    var t = todayISO();
    state.sickLeaves.push({id:uid('sick'), start:t, end:t, note:''}); scheduleSave();
  }); });
  root.querySelectorAll('[data-sick-del]').forEach(function(b){ b.addEventListener('click', function(){
    var id=b.getAttribute('data-sick-del'); state.sickLeaves = state.sickLeaves.filter(function(s){return s.id!==id;}); scheduleSave();
  }); });
  bindChange('[data-sick-start]', function(el){ var s=state.sickLeaves.find(function(s){return s.id===el.dataset.id;}); if(s) s.start=el.value; });
  bindChange('[data-sick-end]', function(el){ var s=state.sickLeaves.find(function(s){return s.id===el.dataset.id;}); if(s) s.end=el.value; });
  bindChange('[data-sick-note]', function(el){ var s=state.sickLeaves.find(function(s){return s.id===el.dataset.id;}); if(s) s.note=el.value; });

  /* holidays */
  root.querySelectorAll('[data-add-holiday]').forEach(function(b){ b.addEventListener('click', function(){
    var from = document.getElementById('new-holiday-date');
    var to = document.getElementById('new-holiday-date-to');
    var note = document.getElementById('holiday-add-note');
    if(!from || !from.value){ holidayAddNote = 'Укажите дату (или начало диапазона).'; if(note) note.textContent = holidayAddNote; return; }
    var start = from.value, end = (to && to.value) ? to.value : from.value;
    if(end < start){ var t = start; start = end; end = t; }
    var set = new Set(state.meta.holidays), added = 0, skipped = 0, d = start, guard = 0;
    while(d <= end && guard++ < 400){
      var y=parseInt(d.slice(0,4),10), m=parseInt(d.slice(5,7),10), dd=parseInt(d.slice(8,10),10);
      if(isWorkingDay(y,m,dd,set)){ state.meta.holidays.push(d); set.add(d); added++; }
      else skipped++;
      d = addDaysISO(d,1);
    }
    holidayAddNote = 'Добавлено дат: '+added+(skipped?', пропущено (выходные и стандартные праздники): '+skipped:'');
    if(note) note.textContent = holidayAddNote;
    if(added) scheduleSave(); else render();
  }); });
  root.querySelectorAll('[data-holiday-year-del]').forEach(function(b){ b.addEventListener('click', function(){
    var y = b.getAttribute('data-holiday-year-del');
    if(!confirm('Удалить все добавленные нерабочие даты '+y+' года?')) return;
    state.meta.holidays = state.meta.holidays.filter(function(h){ return h.slice(0,4)!==y; });
    scheduleSave();
  }); });
  bindChange('[data-wd-edit]', function(el){
    var ym = el.getAttribute('data-ym'), half = el.getAttribute('data-half');
    var y = parseInt(ym.slice(0,4),10), m = parseInt(ym.slice(5,7),10);
    var dim = daysInMonth(y,m);
    var maxDays = half==='first' ? 15 : dim-15;
    var val = Math.max(0, Math.min(maxDays, parseNum(el.value)));
    var cal = workingDaysInHalfCalendar(y,m,half,state);
    if(!state.debts.workingDays) state.debts.workingDays = {};
    var all = state.debts.workingDays, cur = all[ym] || {};
    if(val===cal) delete cur[half]; else cur[half] = val;
    if(Object.keys(cur).length) all[ym] = cur; else delete all[ym];
  });
  root.querySelectorAll('[data-wd-reset]').forEach(function(b){ b.addEventListener('click', function(){
    var ym = b.getAttribute('data-wd-reset');
    if(state.debts.workingDays) delete state.debts.workingDays[ym];
    scheduleSave();
  }); });
  root.querySelectorAll('[data-holiday-del]').forEach(function(b){ b.addEventListener('click', function(){
    var d = b.getAttribute('data-holiday-del'); state.meta.holidays = state.meta.holidays.filter(function(h){return h!==d;}); scheduleSave();
  }); });

  function bindChange(sel, fn){
    root.querySelectorAll(sel).forEach(function(el){
      var isDiscrete = (el.type==='checkbox'||el.type==='radio'||el.tagName==='SELECT');
      if(isDiscrete){
        el.addEventListener('change', function(){ fn(el); scheduleSave(); });
      } else {
        /* commit synchronously on blur (not on every keystroke/pause, and not deferred via
           setTimeout — a deferred commit could lose a race with a synchronous click handler
           that triggers its own render() first, which redraws the DOM from stale state and
           makes the just-typed edit appear to "reset" back to its previous value). */
        el.addEventListener('blur', function(){ fn(el); scheduleSave(); });
        el.addEventListener('keydown', function(ev){ if(ev.key==='Enter'){ el.blur(); } });
      }
    });
  }
}
function findPeriod(id){ return state.periods.find(function(p){return p.id===id;}); }
function findGoal(id){ return state.goals.find(function(g){return g.id===id;}); }
function findVac(id){ return state.vacations.find(function(v){return v.id===id;}); }
function moveArrayItem(arr, id, dir){
  var idx = arr.findIndex(function(x){return x.id===id;});
  var newIdx = idx+dir;
  if(newIdx<0||newIdx>=arr.length) return;
  var tmp = arr[idx]; arr[idx]=arr[newIdx]; arr[newIdx]=tmp;
}
function swapPriority(id, dir){
  var sorted = state.goals.slice().sort(function(a,b){return a.priority-b.priority;});
  var idx = sorted.findIndex(function(g){return g.id===id;});
  var newIdx = idx+dir;
  if(newIdx<0||newIdx>=sorted.length) return;
  var a = sorted[idx], b = sorted[newIdx];
  var tmp = a.priority; a.priority=b.priority; b.priority=tmp;
}

/* ============ boot ============ */
async function boot(){
  root = document.getElementById('root');
  await ensureSignedIn();
  await loadStateFromDB();
  ui = state.ui;
  render();
}
if(document.readyState==='loading'){ document.addEventListener('DOMContentLoaded', boot); } else { boot(); }
})();
</script>
