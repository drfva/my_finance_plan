<!doctype html>
<html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Финансы 2027</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style id="app-style">
:root{
  --bg:#EFEADF; --surface:#FFFDF8; --surface-2:#F5F1E8; --surface-3:#ECE6D9; --ink:#0E1F3F; --muted:#5B6679;
  --line:#E3DCCD; --accent:#1E4FA8; --accent-ink:#1A4290; --accent-soft:#DEE7F7; --on-accent:#FFFFFF; --on-accent-muted:#C9D8F5;
  --warn:#8A5210; --warn-soft:#F6E7CE; --danger:#A83434; --danger-soft:#F8E0DE;
  --good:#2E6B45; --good-soft:#E3F1E7;
  --backdrop:rgba(14,31,63,.40);
  --shadow-card:0 1px 2px rgba(14,31,63,.04), 0 10px 30px rgba(14,31,63,.07);
  --shadow-pop:0 24px 60px rgba(14,31,63,.20);
  --shadow-accent:0 8px 22px rgba(30,79,168,.28);
  --r-lg:24px; --r-md:18px; --r-sm:12px;
  --font-display:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-body:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  --font-mono:'Manrope',system-ui,-apple-system,'Segoe UI',sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#08111F; --surface:#0F1C33; --surface-2:#162644; --surface-3:#1C2F52; --ink:#EEE8DC; --muted:#97A3BA;
    --line:#1F3155; --accent:#7FA6F0; --accent-ink:#C4D6FA; --accent-soft:#1A2F57; --on-accent:#08111F; --on-accent-muted:#1B3466;
    --warn:#E8B366; --warn-soft:#3A2C14; --danger:#F08A84; --danger-soft:#3F1F28;
    --good:#8FD7A8; --good-soft:#16301F;
    --backdrop:rgba(3,8,20,.66);
    --shadow-card:0 1px 0 rgba(255,255,255,.03) inset, 0 12px 32px rgba(0,0,0,.35);
    --shadow-pop:0 24px 60px rgba(0,0,0,.55);
    --shadow-accent:0 8px 24px rgba(127,166,240,.22);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#08111F; --surface:#0F1C33; --surface-2:#162644; --surface-3:#1C2F52; --ink:#EEE8DC; --muted:#97A3BA;
  --line:#1F3155; --accent:#7FA6F0; --accent-ink:#C4D6FA; --accent-soft:#1A2F57; --on-accent:#08111F; --on-accent-muted:#1B3466;
  --warn:#E8B366; --warn-soft:#3A2C14; --danger:#F08A84; --danger-soft:#3F1F28;
  --good:#8FD7A8; --good-soft:#16301F;
  --backdrop:rgba(3,8,20,.66);
  --shadow-card:0 1px 0 rgba(255,255,255,.03) inset, 0 12px 32px rgba(0,0,0,.35);
  --shadow-pop:0 24px 60px rgba(0,0,0,.55);
  --shadow-accent:0 8px 24px rgba(127,166,240,.22);
  color-scheme:dark;
}
*{box-sizing:border-box;}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:15px;line-height:1.6;font-weight:500;padding-bottom:env(safe-area-inset-bottom,0px);-webkit-font-smoothing:antialiased;-moz-osx-font-smoothing:grayscale;}
h1,h2,h3{font-family:var(--font-display);font-weight:700;margin:0 0 6px;line-height:1.3;letter-spacing:-.01em;text-wrap:balance;}
b,strong{font-weight:700;}
.num{font-family:var(--font-mono);font-variant-numeric:tabular-nums;font-weight:600;}

/* кнопки */
button{font-family:inherit;font-size:14px;font-weight:600;cursor:pointer;border-radius:999px;border:1px solid var(--line);background:var(--surface);color:var(--ink);padding:10px 18px;line-height:1.3;transition:background .15s,border-color .15s,color .15s,box-shadow .15s,transform .1s;}
button:hover{border-color:var(--accent);color:var(--accent-ink);}
button:active{transform:scale(.98);}
button:focus-visible{outline:2px solid var(--accent);outline-offset:2px;}
button.primary{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-accent);}
button.primary:hover{opacity:.92;color:var(--on-accent);}
button.ghost{background:transparent;border-color:transparent;color:var(--muted);padding:6px 10px;box-shadow:none;}
button.ghost:hover{color:var(--ink);background:var(--surface);}
button.small{padding:7px 14px;font-size:13px;}

/* поля */
input,select{font-family:inherit;font-size:14px;font-weight:500;background:var(--surface-2);color:var(--ink);border:1px solid transparent;border-radius:var(--r-sm);padding:10px 14px;width:100%;min-height:44px;transition:border-color .15s,background .15s;}
input:hover,select:hover{border-color:var(--line);}
input:focus,select:focus{outline:none;border-color:var(--accent);background:var(--surface);box-shadow:0 0 0 3px var(--accent-soft);}
label{font-size:11.5px;color:var(--muted);display:block;margin-bottom:6px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
.field{display:flex;flex-direction:column;gap:4px;}

/* шапка и вкладки (расположение прежнее) */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:10;background:var(--bg);border-bottom:1px solid var(--line);padding:20px 24px 14px;}
.topbar-inner{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:12px;max-width:1160px;margin:0 auto;}
.brand{display:flex;align-items:center;gap:12px;}
.brand h1,.brand h2{font-size:24px!important;margin:0;font-weight:800;}
.brand .badge-year{font-family:var(--font-mono);color:var(--accent-ink);font-size:13px;font-weight:700;background:var(--accent-soft);padding:4px 12px;border-radius:999px;}
.savebadge{font-size:12px;color:var(--muted);}
nav.tabs{display:flex;gap:6px;overflow-x:auto;max-width:1160px;margin:16px auto 0;padding:5px;background:var(--surface);border-radius:999px;box-shadow:var(--shadow-card);width:max-content;max-width:100%;}
nav.tabs button{white-space:nowrap;border:none;border-radius:999px;background:transparent;padding:9px 18px;color:var(--muted);font-weight:600;font-size:14px;box-shadow:none;}
nav.tabs button:hover{color:var(--ink);background:var(--surface-2);}
nav.tabs button.active{color:var(--on-accent);background:var(--accent);box-shadow:var(--shadow-accent);}
@media (min-width:1208px){nav.tabs{margin-left:calc((100% - 1160px)/2);}}

main{max-width:1160px;margin:0 auto;padding:32px 24px 56px;display:flex;flex-direction:column;gap:28px;}

/* блоки */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);padding:28px;box-shadow:var(--shadow-card);}
.card-title{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:20px;}
.card-title h2,.card-title h3{font-size:19px!important;}
.grid{display:grid;gap:18px;}
.grid.cols-2{grid-template-columns:repeat(2,minmax(0,1fr));}
.grid.cols-3{grid-template-columns:repeat(3,minmax(0,1fr));}
.grid.cols-4{grid-template-columns:repeat(4,minmax(0,1fr));}
@media (max-width:720px){.grid.cols-2,.grid.cols-3,.grid.cols-4{grid-template-columns:1fr;}main{padding:20px 16px 40px;gap:20px;}.card{padding:20px;border-radius:20px;}.topbar{padding:16px 16px 12px;}}

/* ключевые цифры */
.stat{display:flex;flex-direction:column;gap:6px;}
.card.stat{padding:24px 26px;min-height:120px;justify-content:center;}
.stat .v{font-family:var(--font-mono);font-size:26px;font-weight:800;line-height:1.2;letter-spacing:-.01em;}
.stat .l{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;}

/* вложенные плитки внутри карточек — мягкая заливка без рамки */
.grid > .stat[style*="border"]{background:var(--surface-2)!important;border:none!important;padding:20px 22px!important;border-radius:var(--r-md)!important;gap:8px;}

.pill{display:inline-flex;align-items:center;gap:4px;font-size:12px;padding:5px 12px;border-radius:999px;font-weight:700;background:var(--surface-3);color:var(--muted);line-height:1.35;white-space:nowrap;}
.pill.ok{background:var(--accent-soft);color:var(--accent-ink);}
.pill.warn{background:var(--warn-soft);color:var(--warn);}
.pill.danger{background:var(--danger-soft);color:var(--danger);}
.progress{height:10px;border-radius:999px;background:var(--surface-3);overflow:hidden;position:relative;margin:4px 0;}
.progress > i{display:block;height:100%;background:var(--accent);border-radius:999px;}
.progress.over > i{background:var(--warn);}
.row{display:flex;align-items:center;gap:10px;}
.row.between{justify-content:space-between;}
.row.wrap{flex-wrap:wrap;}
.muted{color:var(--muted);}
hr.sep{border:none;border-top:1px solid var(--line);margin:22px 0;}

/* периоды */
.period-card{border:none;border-radius:var(--r-md);overflow:hidden;background:var(--surface-2);transition:box-shadow .15s;}
.period-card + .period-card{margin-top:4px;}
.period-head{display:flex;align-items:center;gap:14px;padding:18px 22px;cursor:pointer;background:var(--surface-2);flex-wrap:wrap;transition:background .15s;}
.period-head:hover{background:var(--surface-3);}
.period-head:hover .pill:not(.ok):not(.warn):not(.danger){background:var(--surface-2);}
.period-card.open{box-shadow:0 0 0 1px var(--line);}
.period-card.open .period-head{background:var(--surface-3);}
.period-date{font-family:var(--font-mono);font-weight:800;min-width:72px;font-size:16px;}
.period-body{padding:10px 22px 24px!important;border-top:1px solid var(--line);background:var(--surface);display:none;}
.period-card.open .period-body{display:block;}
.period-body input,.period-body select{background:var(--surface-2);}
.chev{transition:transform .15s;color:var(--muted);}
.period-card.open .chev{transform:rotate(90deg);}
.chev.open{transform:rotate(90deg);}
.settings-head{display:flex;align-items:center;gap:8px;cursor:pointer;}
.settings-head:hover h2{color:var(--accent-ink);}

/* таблицы */
table{width:100%;border-collapse:separate;border-spacing:0;}
th,td{text-align:left;padding:12px 10px;border-bottom:1px solid var(--line);font-size:14px;}
th{font-size:11.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;font-weight:700;background:var(--surface-2);border-bottom:none;}
th:first-child{border-radius:var(--r-sm) 0 0 var(--r-sm);}
th:last-child{border-radius:0 var(--r-sm) var(--r-sm) 0;}
tbody tr:hover td{background:var(--surface-2);}
tr:last-child td{border-bottom:none;}
td.num,th.num{text-align:right;font-family:var(--font-mono);}

.cat-card{border:none;border-radius:var(--r-md);padding:22px;background:var(--surface-2);}
.cat-card input,.cat-card select,.goal-card input,.goal-card select{background:var(--surface);}
.item-row{display:grid;grid-template-columns:1fr 120px auto;gap:10px;align-items:center;margin-bottom:10px;}
.goal-card{border:none;border-radius:var(--r-md);padding:24px;background:var(--surface-2);}
.goal-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;margin-bottom:8px;}
.priority-controls{display:flex;flex-direction:column;gap:4px;}
.priority-controls.row{flex-direction:row;gap:2px;}
.period-card.open .period-head .pill:not(.ok):not(.warn):not(.danger){background:var(--surface);}
.priority-controls button{padding:4px 9px;line-height:1;}
.info-box{background:var(--accent-soft);border-radius:var(--r-md);padding:18px 22px;font-size:14px;line-height:1.6;color:var(--accent-ink);}
.info-box b{color:var(--ink);}
.tag-input-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:14px;}
.wd-table td,.wd-table th{padding:10px 12px;}
.small-note{font-size:12.5px;line-height:1.5;color:var(--muted);margin-top:6px;font-weight:500;}
input:disabled,select:disabled{background:var(--surface-3);color:var(--muted);cursor:not-allowed;}
.topbar-right{display:flex;align-items:center;gap:16px;margin-left:auto;}
.today-date{font-size:14px;color:var(--muted);background:var(--surface);padding:8px 16px;border-radius:999px;box-shadow:var(--shadow-card);}
.today-date b{color:var(--ink);font-weight:700;}
.period-card.past{opacity:.6;transition:opacity .15s;}
.period-card.past:hover,.period-card.past.open{opacity:1;}
.past-toggle{width:100%;text-align:left;background:transparent;border:1.5px dashed var(--line);color:var(--muted);padding:14px 22px;border-radius:var(--r-md);box-shadow:none;}
.past-toggle:hover{color:var(--ink);background:var(--surface-2);}
.upcoming-divider{font-size:11.5px;color:var(--muted);display:flex;align-items:center;gap:12px;margin:12px 0 8px;text-transform:uppercase;letter-spacing:.06em;font-weight:700;}
.upcoming-divider::before,.upcoming-divider::after{content:'';flex:1;border-top:1px solid var(--line);}
.modal-backdrop{position:fixed;inset:0;background:var(--backdrop);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px;backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);}
.modal{background:var(--surface);border:1px solid var(--line);border-radius:var(--r-lg);max-width:560px;width:100%;max-height:90vh;overflow:auto;padding:32px;box-shadow:var(--shadow-pop);}
.redist-row{display:grid;grid-template-columns:1fr 140px;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line);}
.redist-row .hint{font-size:12px;color:var(--muted);}
.item-row.wd-row{grid-template-columns:140px 1fr 120px auto;}
.item-row.op-row{grid-template-columns:140px 120px 1fr 120px auto;}
.item-row.ip-row{grid-template-columns:150px 1fr auto auto;}
@media (max-width:560px){
  .item-row.wd-row{grid-template-columns:1fr 1fr auto;}
  .item-row.wd-row [data-wd-note]{grid-column:1 / -1;order:-1;}
  .item-row.op-row{grid-template-columns:1fr 1fr auto;}
  .item-row.op-row [data-cop-note]{grid-column:1 / -1;}
}
.debt-stats{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin:12px 0 16px;}
.debt-stats > *{background:var(--surface-2);border-radius:var(--r-sm);padding:14px 16px;}
@media (max-width:560px){.debt-stats{grid-template-columns:1fr 1fr;}}
.debt-stats .v{font-family:var(--font-mono);font-size:19px;font-weight:800;}
.debt-stats .l{font-size:12px;color:var(--muted);}
.dash-tile{background:var(--line);border-color:transparent;}
.dash-tile.dash-tab{cursor:pointer;}
.dash-tile.dash-tab:hover{border-color:var(--accent);}
.dash-tile.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);box-shadow:var(--shadow-accent);}
.dash-tile.active .v{color:var(--on-accent);}
.dash-tile.active .l{color:var(--on-accent-muted);}
.table-scroll{overflow-x:auto;}
/* факт против плана: меньше плана — мягкий зелёный, ±5% — обычный фон, больше плана — мягкий красный */
.fact-under td{background:var(--good-soft);}
.fact-under td.diff{color:var(--good);font-weight:700;}
.fact-over td{background:var(--danger-soft);}
.fact-over td.diff{color:var(--danger);font-weight:700;}
.fact-even td{background:var(--surface);}
.fact-item td:first-child{padding-left:22px;}
.month-tabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:14px;}
.month-tabs button{padding:7px 13px;}
.month-tabs button.active{background:var(--accent);border-color:var(--accent);color:var(--on-accent);font-weight:700;}
.fact-input{max-width:130px;padding:7px 10px;min-height:0;text-align:right;}
::selection{background:var(--accent-soft);}
#login-screen{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:var(--r-lg);box-shadow:var(--shadow-card);padding:32px!important;font-family:var(--font-body)!important;}
#login-error{color:var(--danger)!important;}

/* воздух для разметки, собранной в скриптах с inline-стилями */
h2[style*="font-size:15px"]{font-size:24px!important;font-weight:800;margin:4px 0 0!important;}
[style*="font-size:10px"]{font-size:11px!important;}
[style*="font-size:11px"]{font-size:12px!important;}
[style*="font-size:12px"]{font-size:13px!important;}
[style*="gap:3px"]{gap:8px!important;}
.progress[style*="margin:6px 0"]{margin:12px 0!important;}
.info-box[style*="--danger"]{border:none!important;}
</style>

<script id="app-logic">
(function(){
'use strict';
function showLogin(){
  document.getElementById('login-screen').style.display = 'block';
  document.getElementById('root').style.display = 'none';
}
function hideLogin(){
  document.getElementById('login-screen').style.display = 'none';
  document.getElementById('root').style.display = '';
}

function ensureSignedIn(){
  return supabaseClient.auth.getSession().then(function(res){
    if (res.data.session) { hideLogin(); return true; }
    showLogin();
    return new Promise(function(resolve){
      document.getElementById('login-btn').addEventListener('click', function(){
        var email = document.getElementById('login-email').value;
        var password = document.getElementById('login-password').value;
        supabaseClient.auth.signInWithPassword({ email: email, password: password })
          .then(function(res2){
            if (res2.error) {
              document.getElementById('login-error').textContent = 'Ошибка: ' + res2.error.message;
              return;
            }
            hideLogin();
            resolve(true);
          });
      });
    });
  });
}

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function uid(p){ return p+'-'+Math.random().toString(36).slice(2,9); }

/* кредитки и рассрочки хранятся в отдельных таблицах (debts.sql) через get/save_debts_state */
var debtsStorageOk = false;
function emptyDebts(){ return { cards:[], installments:[], paymentOverrides:{}, workingDays:{}, actuals:{} }; }
function normalizeDebts(d){
  d = (d && typeof d==='object') ? d : {};
  var out = emptyDebts();
  (d.cards||[]).forEach(function(c){
    out.cards.push({ id:c.id||uid('card'), name:c.name||'', limit:Number(c.limit)||0,
      graceDays:(c.graceDays!=null && c.graceDays!=='') ? Number(c.graceDays) : 60,
      ops:(c.ops||[]).map(function(o){ return { id:o.id||uid('op'), date:o.date||'', amount:Math.abs(Number(o.amount)||0), kind:o.kind==='payment'?'payment':'spend', note:o.note||'' }; }) });
  });
  (d.installments||[]).forEach(function(i){
    out.installments.push({ id:i.id||uid('inst'), name:i.name||'', total:Number(i.total)||0, parts:Number(i.parts)||1,
      interval:i.interval==='1m'?'1m':'2w', firstDate:i.firstDate||'',
      payments:(i.payments||[]).map(function(p){ return { id:p.id||uid('ip'), date:p.date||'', amount:Number(p.amount)||0 }; }) });
  });
  var po = d.paymentOverrides||{};
  Object.keys(po).forEach(function(pid){
    out.paymentOverrides[pid] = {};
    Object.keys(po[pid]||{}).forEach(function(cid){ out.paymentOverrides[pid][cid] = Number(po[pid][cid])||0; });
  });
  var ac = d.actuals||{};
  Object.keys(ac).forEach(function(ym){
    var cats = ac[ym]||{}, outMonth = {};
    Object.keys(cats).forEach(function(cid){
      var src = cats[cid]||{}, dst = {};
      if(src.name) dst.name = String(src.name);
      if(src.total!=null && src.total!=='') dst.total = Number(src.total)||0;
      var items = src.items||{}, outItems = {};
      Object.keys(items).forEach(function(nm){
        var v = Number(items[nm])||0;
        if(nm && v) outItems[nm] = v;
      });
      if(Object.keys(outItems).length) dst.items = outItems;
      if(dst.total || dst.items) outMonth[cid] = dst; 
    });
    if(Object.keys(outMonth).length) out.actuals[ym] = outMonth;
  });
  var wd = d.workingDays||{};
  Object.keys(wd).forEach(function(ym){
    var v = wd[ym]||{}, o = {};
    if(v.first!=null && v.first!=='') o.first = Math.max(0, Number(v.first)||0);
    if(v.second!=null && v.second!=='') o.second = Math.max(0, Number(v.second)||0);
    if(Object.keys(o).length) out.workingDays[ym] = o;
  });
  return out;
}

async function loadStateFromDB(){
  var s = null;
  try{
    var result = await supabaseClient.rpc('get_full_state');
    if(result.error) throw result.error;
    s = result.data;
  }catch(e){ console.error('Ошибка загрузки:', e); }

  if(!s || Object.keys(s).length===0) s = clone(DEFAULT_STATE);
  /* forward-compat: fill in fields introduced after this state was first saved */
  if(!s.ui) s.ui = clone(DEFAULT_STATE.ui);
  if(s.ui.selectedYear===undefined) s.ui.selectedYear = null;
  if(!s.ui.openWdYears) s.ui.openWdYears = {};
  if(!s.ui.openSettings) s.ui.openSettings = {};
  if(!s.ui.dashView) s.ui.dashView = 'goals';
  if(s.ui.factMonth===undefined) s.ui.factMonth = null;
  if(!s.ndfl) s.ndfl = clone(DEFAULT_STATE.ndfl);
  (s.goals||[]).forEach(function(g){ if(!g.subgoals) g.subgoals=[]; });
  (s.periods||[]).forEach(function(p){ if(p.locked===undefined) p.locked=false; });
  state = s;
  try{
    var dr = await supabaseClient.rpc('get_debts_state');
    if(dr.error) throw dr.error;
    state.debts = normalizeDebts(dr.data);
    debtsStorageOk = true;
  }catch(e){
    console.error('Кредиты и рассрочки не загружены (выполнен ли debts.sql?):', e);
    state.debts = emptyDebts();
    debtsStorageOk = false;
  }
}

function scheduleSave(){
  render();
  clearTimeout(publishTimer);
  saveStatus = 'pending';
  publishTimer = setTimeout(doPublish, 500);
}
async function doPublish(){
  try{
    /* долги уходят отдельным запросом, в основное состояние их не передаём */
    var payload = Object.assign({}, state);
    delete payload.debts;
    var result = await supabaseClient.rpc('save_full_state', { p_state: payload });
    if(result.error) throw result.error;
    if(debtsStorageOk){
      var r2 = await supabaseClient.rpc('save_debts_state', { p_state: state.debts });
      if(r2.error) throw r2.error;
    }
    saveStatus = 'saved';
  }catch(e){
    console.error('Ошибка сохранения:', e);
    saveStatus = 'error';
  }
  updateSaveBadge();
}
function updateSaveBadge(){
  var b = document.getElementById('save-badge');
  if(!b) return;
  var map = { idle:'', pending:'Сохранение…', saved:'Сохранено', local:'Локально (не опубликовано)', error:'Ошибка сохранения' };
  b.textContent = map[saveStatus] || '';
}

/* ============ date / calendar helpers ============ */
function pad2(n){ return (n<10?'0':'')+n; }
function isoDate(y,m,d){ return y+'-'+pad2(m)+'-'+pad2(d); }
function daysInMonth(y,m){ return new Date(y,m,0).getDate(); }
function dowUTC(y,m,d){ return new Date(Date.UTC(y,m-1,d)).getUTCDay(); }
/* Стандартные нерабочие праздники РФ — одни и те же для всех лет, в списке дат не хранятся.
   В календаре вручную добавляются только дополнительные даты: переносы выходных и т. п. */
var STANDARD_HOLIDAY_MD = ['01-01','01-02','01-03','01-04','01-05','01-06','01-07','01-08','02-23','03-08','05-01','05-09','06-12','11-04'];
var STANDARD_HOLIDAY_SET = new Set(STANDARD_HOLIDAY_MD);
function isStandardHoliday(iso){ return STANDARD_HOLIDAY_SET.has(String(iso).slice(5,10)); }
function isWorkingDay(y,m,d,holidaySet){
  var dow = dowUTC(y,m,d);
  if(dow===0||dow===6) return false;
  var iso = isoDate(y,m,d);
  if(STANDARD_HOLIDAY_SET.has(iso.slice(5,10))) return false;
  if(holidaySet.has(iso)) return false;
  return true;
}
/* рабочие дни по календарю (выходные, стандартные праздники и добавленные даты) */
function workingDaysInHalfCalendar(y,m,half,st){
  var holidaySet = new Set(st.meta.holidays);
  var dim = daysInMonth(y,m);
  var start = half==='first'?1:16;
  var end = half==='first'?15:dim;
  var c=0;
  for(var d=start; d<=end; d++){ if(isWorkingDay(y,m,d,holidaySet)) c++; }
  return c;
}
function wdKey(y,m){ return y+'-'+pad2(m); }
function wdOverrideFor(st,y,m){
  var o = (st.debts && st.debts.workingDays) || {};
  return o[wdKey(y,m)] || null;
}
/* рабочие дни половины месяца: вручную исправленное значение важнее календарного */
function workingDaysInHalf(y,m,half,st){
  var ov = wdOverrideFor(st,y,m);
  if(ov && ov[half]!=null && !isNaN(ov[half])) return Math.max(0, ov[half]);
  return workingDaysInHalfCalendar(y,m,half,st);
}
function workingDaysInMonth(y,m,st){ return workingDaysInHalf(y,m,'first',st)+workingDaysInHalf(y,m,'second',st); }
function calendarDaysInclusive(startISO,endISO){
  var s=new Date(startISO+'T00:00:00Z'), e=new Date(endISO+'T00:00:00Z');
  return Math.round((e-s)/86400000)+1;
}
function todayISO(){
  var d = new Date();
  return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate());
}
function addDaysISO(iso, n){ var d = new Date(iso+'T00:00:00Z'); d.setUTCDate(d.getUTCDate()+n); return d.toISOString().slice(0,10); }
function addMonthsISO(iso, n){
  var y=parseInt(iso.slice(0,4),10), m=parseInt(iso.slice(5,7),10), d=parseInt(iso.slice(8,10),10);
  var idx = (y*12 + (m-1)) + n;
  y = Math.floor(idx/12); m = idx - y*12 + 1;
  return isoDate(y, m, Math.min(d, daysInMonth(y,m)));
}
function daysBetween(a,b){ return calendarDaysInclusive(a,b)-1; }
function plural(n, one, few, many){
  var n10 = n%10, n100 = n%100;
  if(n10===1 && n100!==11) return one;
  if(n10>=2 && n10<=4 && (n100<12 || n100>14)) return few;
  return many;
}

/* ============ seasonal categories (MM-DD ranges, wrap around new year) ============ */
function parseDM(str){
  var m = String(str||'').trim().match(/^(\d{1,2})[.\-\/](\d{1,2})$/);
  if(!m) return null;
  var d=parseInt(m[1],10), mo=parseInt(m[2],10);
  if(d<1||d>31||mo<1||mo>12) return null;
  return pad2(mo)+'-'+pad2(d);
}
function formatDM(md){
  if(!md) return '';
  var parts = String(md).split('-');
  if(parts.length<2) return '';
  return parts[1]+'.'+parts[0];
}
function inSeason(dateISO, season){
  if(!season || !season.from || !season.to) return true;
  var md = dateISO.slice(5,10);
  if(season.from<=season.to) return md>=season.from && md<=season.to;
  return md>=season.from || md<=season.to;
}

/* ============ multi-year planning ============ */
function planYears(st){
  var seen = {}, out = [];
  st.periods.forEach(function(p){ if(!seen[p.monthRef.y]){ seen[p.monthRef.y]=true; out.push(p.monthRef.y); } });
  out.sort(function(a,b){return a-b;});
  return out;
}
function currentYear(st){
  var years = planYears(st);
  if(!years.length) return null;
  if(st.ui.selectedYear!=null && years.indexOf(st.ui.selectedYear)!==-1) return st.ui.selectedYear;
  var todayY = parseInt(todayISO().slice(0,4),10);
  return years.indexOf(todayY)!==-1 ? todayY : years[0];
}
function yearTabsNav(st){
  var years = planYears(st);
  if(years.length<=1) return '';
  var active = currentYear(st);
  return '<div class="row wrap" style="gap:4px;margin-bottom:12px;">' + years.map(function(y){
    return '<button class="small'+(y===active?' primary':'')+'" data-select-year="'+y+'">'+y+'</button>';
  }).join('') + '</div>';
}
function planYearsLabel(st){
  var ys = planYears(st);
  if(!ys.length) return '';
  return ys.length===1 ? String(ys[0]) : ys[0]+'–'+ys[ys.length-1];
}
/* дата выплаты: если целевое число — выходной или праздник, берём ближайший рабочий день раньше */
function payDateOnOrBefore(targetISO, st){
  var holidaySet = new Set(st.meta.holidays), d = targetISO;
  for(var i=0;i<31;i++){
    var y=parseInt(d.slice(0,4),10), m=parseInt(d.slice(5,7),10), dd=parseInt(d.slice(8,10),10);
    if(isWorkingDay(y,m,dd,holidaySet)) return d;
    d = addDaysISO(d,-1);
  }
  return targetISO;
}
/* Новый год плана: аванс 20-го (за 1–15 число), зарплата 5-го следующего месяца (за 16-е – конец месяца).
   Сумма на руки — по окладу, отработанным дням (без отпусков и больничных) и НДФЛ нарастающим итогом
   за календарный год выплаты. Периоды сразу добавляются в план. */
function generateYearPeriods(year, st){
  var out=[];
  for(var m=1;m<=12;m++){
    var avansDate = payDateOnOrBefore(isoDate(year,m,20), st);
    out.push({id:uid('p'), date:avansDate, label:periodLabelFromDate(avansDate), type:'avans', half:'first', monthRef:{y:year,m:m}, calc:'auto', incomeActual:0, assignedVacations:[], locked:false});
    var zpY = m===12?year+1:year, zpM = m===12?1:m+1;
    var zpDate = payDateOnOrBefore(isoDate(zpY,zpM,5), st);
    out.push({id:uid('p'), date:zpDate, label:periodLabelFromDate(zpDate), type:'zp', half:'second', monthRef:{y:year,m:m}, calc:'auto', incomeActual:0, assignedVacations:[], locked:false});
  }
  /* отпускные, которые не правили вручную (равны формуле), пересчитаем, когда появятся доходы нового года */
  var formulaBefore = {};
  (st.vacations||[]).forEach(function(v){ formulaBefore[v.id] = calcVacationPayFormula(v, st); });
  st.periods = st.periods.concat(out);
  st.periods.sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); });
  var fill = {};
  out.forEach(function(p){ fill[p.id] = true; });
  computeSalaryNetPlan(st, fill);
  var yearStart = isoDate(year,1,1), recalculated = false;
  (st.vacations||[]).forEach(function(v){
    if(!v.start || v.start < yearStart || formulaBefore[v.id]==null || v.manualPay!==formulaBefore[v.id]) return;
    var f = calcVacationPayFormula(v, st);
    if(f!=null && f!==v.manualPay){ v.manualPay = f; recalculated = true; }
  });
  if(recalculated) computeSalaryNetPlan(st, fill);
  return out;
}
/* ручные периоды: calc==='manual' (доход вводится вручную, не по окладу) */
function isManualPeriod(p){ return p.calc==='manual'; }
function periodLabelFromDate(iso){ var parts = iso.split('-'); return parts[2]+'.'+parts[1]; }
function defaultMonthRefFor(dateISO, type){
  var y = parseInt(dateISO.slice(0,4),10), m = parseInt(dateISO.slice(5,7),10);
  if(type==='zp'){ m--; if(m===0){ m=12; y--; } }
  return y+'-'+pad2(m);
}
var newPeriodDraft = null;
function freshPeriodDraft(){
  var d = todayISO();
  return { date:d, type:'avans', month:defaultMonthRefFor(d,'avans'), monthTouched:false, income:'', note:'' };
}
function addManualPeriod(draft, st){
  var mm = String(draft.month||'').match(/^(\d{4})-(\d{2})$/);
  if(!draft.date) return 'Укажите дату выплаты.';
  if(!mm) return 'Укажите месяц, за который выплата.';
  var y = parseInt(mm[1],10), m = parseInt(mm[2],10);
  var half = draft.type==='avans' ? 'first' : 'second';
  var dup = st.periods.find(function(p){ return p.monthRef.y===y && p.monthRef.m===m && p.half===half; });
  if(dup && !confirm((draft.type==='avans'?'Аванс':'Зарплата')+' за '+MONTH_NAMES[m].toLowerCase()+' '+y+' уже есть (выплата '+ruDate(dup.date)+'). Всё равно добавить ещё один период?')) return '';
  var p = { id:uid('p'), date:draft.date, label:periodLabelFromDate(draft.date), type:draft.type, half:half,
    monthRef:{y:y,m:m}, calc:'manual', incomeActual:parseNum(draft.income), assignedVacations:[],
    /* прошедший ручной период сразу фиксируется без распределения по копилкам —
       иначе авто-расчёт задним числом «положил» бы его остаток в цели */
    locked: draft.date < todayISO() };
  if(draft.note && draft.note.trim()) p.note = draft.note.trim();
  st.periods.push(p);
  st.periods.sort(function(a,b){ return a.date<b.date?-1:1; });
  st.ui.selectedYear = y;
  st.ui.openPeriods[p.id] = true;
  return null;
}

function ensurePastPeriodsLocked(st){
  var today = todayISO();
  var toLock = st.periods.filter(function(p){ return !p.locked && p.date < today; });
  if(!toLock.length) return false;
  var sim = simulate(st);
  var byId = {}; sim.rows.forEach(function(r){ byId[r.period.id]=r; });
  toLock.forEach(function(p){
    var r = byId[p.id];
    if(r){
      if(!st.savingsOverrides[p.id]) st.savingsOverrides[p.id] = {};
      Object.keys(r.allocations).forEach(function(gid){ st.savingsOverrides[p.id][gid] = Math.round(r.allocations[gid]); });
      snapshotDebtPayments(st, p.id, r);
    }
    p.locked = true;
  });
  return true;
}

/* ============ salary ============ */
function okladForDate(dateISO, st){
  var hist = st.oklad.history.slice().sort(function(a,b){ return a.effectiveFrom<b.effectiveFrom?-1:1; });
  var val = hist.length?hist[0].amount:0;
  for(var i=0;i<hist.length;i++){ if(hist[i].effectiveFrom<=dateISO) val=hist[i].amount; }
  return val;
}
function sortedOkladHistory(st){
  return st.oklad.history.slice().sort(function(a,b){ return a.effectiveFrom<b.effectiveFrom?-1:(a.effectiveFrom>b.effectiveFrom?1:0); });
}
/* последняя запись оклада — по дате начала действия, а не по порядку в списке */
function latestOkladEntry(st){
  var h = sortedOkladHistory(st);
  return h.length ? h[h.length-1] : null;
}
/* день отсутствия: попадает в отпуск или больничный */
function absenceRanges(st){
  var out = [];
  (st.vacations||[]).forEach(function(v){ if(v.start && v.end) out.push([v.start, v.end]); });
  (st.sickLeaves||[]).forEach(function(v){ if(v.start && v.end) out.push([v.start, v.end]); });
  return out;
}
/* Отработанные дни и gross периода:
   рабочие дни половины месяца (аванс — 1–15, зарплата — 16–конец) без отпусков и больничных;
   каждый отработанный день стоит «оклад, действующий в этот день ÷ рабочих дней месяца». */
function periodWorkInfo(period, st, ranges){
  var y=period.monthRef.y, m=period.monthRef.m;
  var holidaySet = new Set(st.meta.holidays);
  var monthWD = workingDaysInMonth(y,m,st);
  if(monthWD<=0) return null;
  if(!(okladForDate(isoDate(y,m,period.half==='first'?1:16), st) > 0)) return null;
  ranges = ranges || absenceRanges(st);
  var dim = daysInMonth(y,m);
  var start = period.half==='first'?1:16, end = period.half==='first'?15:dim;
  var calHalf = 0, calWorked = 0, okladSum = 0;
  for(var d=start; d<=end; d++){
    if(!isWorkingDay(y,m,d,holidaySet)) continue;
    calHalf++;
    var iso = isoDate(y,m,d);
    if(ranges.some(function(r){ return iso>=r[0] && iso<=r[1]; })) continue;
    calWorked++;
    okladSum += okladForDate(iso, st);
  }
  /* если число рабочих дней половины исправлено вручную, отпуска и больничные
     вычитаются из исправленного значения */
  var halfWD = workingDaysInHalf(y,m,period.half,st);
  var worked = Math.max(0, halfWD - Math.max(0, calHalf - calWorked));
  var avgOklad = calWorked ? okladSum/calWorked : okladForDate(isoDate(y,m,start), st);
  return { monthWD:monthWD, halfWD:halfWD, worked:worked, gross:Math.round(avgOklad*worked/monthWD) };
}
function calcPeriodIncomeFormula(period, st){
  if(period.calc==='manual') return null;
  var w = periodWorkInfo(period, st);
  return w ? w.gross : null;
}

/* ============ НДФЛ (прогрессивная шкала, оклад в настройках вводится gross) ============ */
function ndflBracketTop(b){ return (b.upTo===null || b.upTo===undefined) ? Infinity : b.upTo; }
function ndflOwedOnCumulative(cum, brackets){
  var sorted = brackets.slice().sort(function(a,b){ return ndflBracketTop(a)-ndflBracketTop(b); });
  var tax=0, prev=0;
  for(var i=0;i<sorted.length;i++){
    var top = ndflBracketTop(sorted[i]);
    if(cum>prev){
      var slice = Math.min(cum, top)-prev;
      tax += slice*sorted[i].rate;
      prev = top;
    } else break;
  }
  return tax;
}
function netFromGross(grossAmount, cumGrossBefore, brackets){
  var cumAfter = cumGrossBefore+grossAmount;
  var taxBefore = ndflOwedOnCumulative(cumGrossBefore, brackets);
  var taxAfter = ndflOwedOnCumulative(cumAfter, brackets);
  var tax = Math.round(taxAfter-taxBefore);
  return { gross: grossAmount, tax: tax, net: grossAmount-tax, cumGrossAfter: cumAfter };
}
function estimateMonthlyNet(grossMonthly, brackets){
  var annualTax = ndflOwedOnCumulative(grossMonthly*12, brackets);
  return Math.round(grossMonthly - annualTax/12);
}
/* gross, который даёт указанную сумму «на руки» при уже набранном за год доходе */
function grossFromNet(net, cumBefore, brackets){
  if(!(net>0)) return 0;
  var taxBase = ndflOwedOnCumulative(cumBefore, brackets);
  function netOf(g){ return g - (ndflOwedOnCumulative(cumBefore+g, brackets) - taxBase); }
  var lo = net, hi = net*2 + 1;
  for(var k=0; k<20 && netOf(hi)<net; k++) hi *= 2;
  for(var i=0;i<60;i++){
    var mid = (lo+hi)/2;
    if(netOf(mid) < net) lo = mid; else hi = mid;
  }
  return hi;
}
/* План «на руки» по авто-периодам. НДФЛ считается нарастающим итогом за календарный год даты
   выплаты: в годовой доход по порядку дат входят все выплаты этого года — зарплата (фактическая
   сумма «на руки», пересчитанная в gross) и отпускные.
   fillIds: для этих периодов расчётная сумма «на руки» сразу записывается в «Доход на руки» (новый год). */
function computeSalaryNetPlan(st, fillIds){
  var periods = st.periods.slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  var br = st.ndfl.brackets, ranges = absenceRanges(st);
  var cum = 0, cumYear = null, byPeriod = {};
  periods.forEach(function(p){
    var payYear = p.date.slice(0,4);
    if(payYear!==cumYear){ cum = 0; cumYear = payYear; }
    /* расчёт по формуле делаем и для ручных периодов — как подсказку, если данных хватает
       (есть оклад и рабочие дни в месяце); в «Доход на руки» он сам не записывается */
    var w = periodWorkInfo(p, st, ranges);
    var r = null;
    if(w){
      r = netFromGross(w.gross, cum, br);
      r.worked = w.worked; r.halfWD = w.halfWD; r.monthWD = w.monthWD;
    }
    byPeriod[p.id] = r;
    if(r && fillIds && fillIds[p.id]){
      p.incomeActual = r.net;
      cum += r.gross;
    } else {
      cum += grossFromNet(p.incomeActual||0, cum, br);
    }
    var vac = vacationPayForPeriod(p, st);
    if(vac>0) cum += grossFromNet(vac, cum, br);
  });
  return byPeriod;
}

/* ============ vacation pay ============ */
function monthsBefore(y,m,count){
  var arr=[], yy=y, mm=m;
  for(var i=0;i<count;i++){ mm--; if(mm===0){ mm=12; yy--; } arr.unshift({y:yy,m:mm}); }
  return arr;
}
function monthlyIncomeFor(y,m,st){
  var sum=0, halves={};
  st.periods.forEach(function(p){ if(p.monthRef.y===y && p.monthRef.m===m){ sum+=p.incomeActual||0; halves[p.half]=true; } });
  var found = !!(halves.first || halves.second);
  /* 2026: если за месяц вручную добавлены оба периода (аванс + зарплата) — берём их сумму,
     иначе — значение из «Настройки → Доходы за 2026 год» */
  if(y===2026 && m>=1 && m<=12 && !(halves.first && halves.second)) return st.income2026[m-1]||0;
  return found?sum:0;
}
function sickDaysInMonth(y,m,st){
  var dim=daysInMonth(y,m);
  var start=new Date(Date.UTC(y,m-1,1)), end=new Date(Date.UTC(y,m-1,dim));
  var days=0;
  (st.sickLeaves||[]).forEach(function(sl){
    if(!sl.start||!sl.end) return;
    var s=new Date(sl.start+'T00:00:00Z'), e=new Date(sl.end+'T00:00:00Z');
    var os=s>start?s:start, oe=e<end?e:end;
    if(os<=oe) days += Math.round((oe-os)/86400000)+1;
  });
  return Math.min(days,dim);
}
function raiseIndexFactor(y,m,vacationStartISO,st){
  var hist = st.oklad.history.slice().sort(function(a,b){ return a.effectiveFrom<b.effectiveFrom?-1:1; });
  var monthEndISO = isoDate(y,m,daysInMonth(y,m));
  var rateAtMonth = hist.length?hist[0].amount:0;
  hist.forEach(function(h){ if(h.effectiveFrom<=monthEndISO) rateAtMonth=h.amount; });
  var rateAtVacation = hist.length?hist[0].amount:0;
  hist.forEach(function(h){ if(h.effectiveFrom<=vacationStartISO) rateAtVacation=h.amount; });
  if(rateAtMonth>0 && rateAtVacation>rateAtMonth) return rateAtVacation/rateAtMonth;
  return 1;
}
function avgDailyEarnings(vacationStartISO, st){
  var y=parseInt(vacationStartISO.slice(0,4),10), m=parseInt(vacationStartISO.slice(5,7),10);
  var months = monthsBefore(y,m,12);
  var totalIncome=0, totalCoeff=0;
  months.forEach(function(mo){
    var inc = monthlyIncomeFor(mo.y,mo.m,st);
    inc = inc*raiseIndexFactor(mo.y,mo.m,vacationStartISO,st);
    var sick = sickDaysInMonth(mo.y,mo.m,st);
    var dim = daysInMonth(mo.y,mo.m);
    var coeff = sick>0 ? (29.3/dim)*(dim-sick) : 29.3;
    totalIncome+=inc; totalCoeff+=coeff;
  });
  if(totalCoeff<=0) return 0;
  return totalIncome/totalCoeff;
}
function calcVacationPayFormula(vac, st){
  if(!vac.start||!vac.end) return null;
  var avg = avgDailyEarnings(vac.start, st);
  var days = calendarDaysInclusive(vac.start, vac.end);
  return Math.round(avg*days);
}
/* Расчётный период выплаты — та половина месяца, за которую она начислена:
   аванс (1-я половина) 20.08 → 01.08–15.08, зарплата (2-я половина) 05.09 → 16.08–31.08. */
function settlementWindow(period){
  var y = period.monthRef.y, m = period.monthRef.m, dim = daysInMonth(y,m);
  return period.half==='first'
    ? { start: isoDate(y,m,1), end: isoDate(y,m,15) }
    : { start: isoDate(y,m,16), end: isoDate(y,m,dim) };
}
function settlementLabel(period){
  var w = settlementWindow(period);
  return ruDate(w.start).slice(0,5)+'–'+ruDate(w.end).slice(0,5);
}
function rangeOverlapDays(aStart, aEnd, bStart, bEnd){
  if(!aStart || !aEnd) return 0;
  var s = aStart>bStart?aStart:bStart, e = aEnd<bEnd?aEnd:bEnd;
  return s<=e ? calendarDaysInclusive(s,e) : 0;
}
function vacationDays(vac){
  return (vac && vac.start && vac.end && vac.end>=vac.start) ? calendarDaysInclusive(vac.start, vac.end) : 0;
}
/* Отпускные фактически выплачивают в первый рабочий день ДО начала отпуска:
   отпуск с 02.08.2027 (понедельник) → 30.07.2027 (пятница). */
function vacationPayoutDate(vac, st){
  if(!vac || !vac.start) return '';
  var holidaySet = new Set(st.meta.holidays), d = addDaysISO(vac.start, -1);
  for(var i=0;i<40;i++){
    var y=parseInt(d.slice(0,4),10), m=parseInt(d.slice(5,7),10), dd=parseInt(d.slice(8,10),10);
    if(isWorkingDay(y,m,dd,holidaySet)) return d;
    d = addDaysISO(d,-1);
  }
  return '';
}
/* Отпускные делятся между выплатами пропорционально дням отпуска, попавшим в расчётный период
   каждой выплаты: отпуск 10.08–17.08 при выплатах 20.08 (за 01.08–15.08) и 05.09 (за 16.08–31.08)
   делится как дни 10–15 и дни 16–17. Стоимость дня = отпускные / всех календарных дней отпуска. */
function vacationSplitForPeriod(period, st){
  var win = settlementWindow(period), out = [];
  (st.vacations||[]).forEach(function(v){
    var total = vacationDays(v);
    if(!total) return;
    var days = rangeOverlapDays(v.start, v.end, win.start, win.end);
    if(!days) return;
    out.push({ vac:v, days:days, totalDays:total, amount: Math.round((v.manualPay||0)*days/total) });
  });
  return out;
}
function vacationPayForPeriod(period, st){
  return vacationSplitForPeriod(period, st).reduce(function(sum,x){ return sum+x.amount; },0);
}
/* по каким выплатам разойдутся отпускные этого отпуска */
function vacationPayouts(vac, st){
  var total = vacationDays(vac), out = [];
  if(!total) return out;
  st.periods.forEach(function(p){
    var win = settlementWindow(p);
    var days = rangeOverlapDays(vac.start, vac.end, win.start, win.end);
    if(days) out.push({ period:p, days:days, amount: Math.round((vac.manualPay||0)*days/total) });
  });
  out.sort(function(a,b){ return a.period.date<b.period.date?-1:(a.period.date>b.period.date?1:0); });
  return out;
}

/* ============ categories (with optional seasonal date-range restriction) ============ */
function categoryPlannedTotalForDate(cat, dateISO){
  if(cat.season && dateISO && !inSeason(dateISO, cat.season)) return 0;
  if(cat.items && cat.items.length){
    return cat.items.reduce(function(s,it){
      if(it.season && dateISO && !inSeason(dateISO, it.season)) return s;
      return s+(it.amount||0);
    },0);
  }
  return cat.amount||0;
}
function categoryPlannedTotal(cat){
  return categoryPlannedTotalForDate(cat, null);
}
function categoriesTemplateTotal(st){
  return st.categories.reduce(function(s,c){ return s+categoryPlannedTotal(c); },0);
}
function categoriesTotalForPeriod(period, st){
  var ov = st.categoryOverrides[period.id];
  var total=0;
  st.categories.forEach(function(c){
    var planned = categoryPlannedTotalForDate(c, period.date);
    total += (ov && ov[c.id]!==undefined) ? ov[c.id] : planned;
  });
  return total;
}

/* ============ savings milestones (подцели) ============
   Each milestone is an INCREMENTAL amount: reaching it consumes that much fresh savings,
   then the next milestone starts counting from zero again (a later withdrawal never
   "gives back" progress already credited toward an earlier, already-achieved milestone —
   this is what lets the goal's overall target equal the sum of its milestones). */
function goalMilestones(g){
  if(g.subgoals && g.subgoals.length) return g.subgoals;
  return [ { id:'_main', target: g.target, deadline: g.deadline } ];
}
function goalFinalTarget(g){
  var ms = goalMilestones(g);
  return ms.reduce(function(s,m){ return s+(m.target||0); },0);
}
/* How much of the goal's cumulative target has been earned so far: the sum of every
   fully-completed milestone's target, plus progress within the current (incomplete) one.
   This is what the progress bar compares against goalFinalTarget — it only ever grows,
   so it reaches 100% exactly when every milestone has been funded, and stays there even
   after the money is later withdrawn/spent. */
function goalCumulativeProgress(g, sim){
  var ms = goalMilestones(g);
  var idx = (sim.finalPhaseIdx && sim.finalPhaseIdx[g.id]) || 0;
  var sum = 0;
  for(var i=0;i<idx && i<ms.length;i++) sum += ms[i].target||0;
  if(idx < ms.length) sum += (sim.finalPhaseSaved && sim.finalPhaseSaved[g.id]) || 0;
  return sum;
}
function achievedDateLabel(date, prefix, prefixPre){
  if(date==='pre') return prefixPre;
  return prefix+ruDate(date);
}
function milestoneAchievements(g, sim){
  var ms = goalMilestones(g);
  var dates = (sim.milestoneDates && sim.milestoneDates[g.id]) || ms.map(function(){ return null; });
  return ms.map(function(m,i){ return { milestone:m, achievedDate: dates[i]!==undefined?dates[i]:null }; });
}
function milestoneStatusPill(m, achievedDate){
  if(achievedDate){
    if(achievedDate==='pre') return { label:'Уже накоплено', cls:'ok' };
    if(!m.deadline) return { label:'Прогноз: к '+ruDate(achievedDate), cls:'ok' };
    return achievedDate<=m.deadline ? { label:'В графике (к '+ruDate(achievedDate)+')', cls:'ok' } : { label:'Позже срока (к '+ruDate(achievedDate)+')', cls:'warn' };
  }
  if(!m.deadline) return { label:'Не достигается в пределах плана', cls:'danger' };
  return { label:'Не достигается к '+ruDate(m.deadline), cls:'danger' };
}
function goalOverallStatus(g, sim){
  if(g.completed) return { label:'Выполнена', cls:'ok' };
  var ms = goalMilestones(g);
  var idx = (sim.finalPhaseIdx && sim.finalPhaseIdx[g.id]) || 0;
  if(idx>=ms.length) return { label:'Цель достигнута', cls:'ok' };
  return { label:'В работе', cls:'warn' };
}

/* ============ долги: рассрочки и кредитки ============ */
function debtsOf(st){ return st.debts || emptyDebts(); }
function buildInstallmentSchedule(total, parts, firstDate, interval){
  parts = Math.max(1, Math.round(parts||1));
  total = Math.max(0, Math.round(total||0));
  var base = Math.floor(total/parts), rest = total - base*parts, out = [];
  for(var i=0;i<parts;i++){
    out.push({ id:uid('ip'), date: interval==='1m' ? addMonthsISO(firstDate,i) : addDaysISO(firstDate,14*i), amount: base + (i<rest?1:0) });
  }
  return out;
}
/* платёж рассрочки оплачивается из последней выплаты не позже его даты:
   выплата 05.05, платёж 07.05, следующая выплата 20.05 → платёж идёт из выплаты 05.05.
   Платежи в одну дату (от разных покупок) складываются. */
function installmentPaymentsByPeriod(st, sortedPeriods){
  var map = {};
  debtsOf(st).installments.forEach(function(inst){
    (inst.payments||[]).forEach(function(pay){
      if(!pay.date || !(pay.amount>0)) return;
      var target = null;
      for(var i=0;i<sortedPeriods.length;i++){ if(sortedPeriods[i].date<=pay.date) target = sortedPeriods[i]; else break; }
      if(!target) return;
      var list = map[target.id] = map[target.id] || [];
      var same = list.find(function(x){ return x.date===pay.date; });
      if(!same){ same = { date:pay.date, amount:0, names:[] }; list.push(same); }
      same.amount += pay.amount;
      var nm = inst.name || 'Покупка';
      if(same.names.indexOf(nm)===-1) same.names.push(nm);
    });
  });
  Object.keys(map).forEach(function(k){ map[k].sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); }); });
  return map;
}
function sortedCardOps(card){
  return (card.ops||[]).filter(function(o){ return o.date; }).slice().sort(function(a,b){
    if(a.date!==b.date) return a.date<b.date?-1:1;
    return (a.kind==='spend'?0:1)-(b.kind==='spend'?0:1);
  });
}
/* Кредитка: трата при нулевом долге запускает льготный период (graceDays, по умолчанию 60 дней);
   пока долг не погашен полностью, новые траты срок не сдвигают. Полное погашение закрывает
   период, следующая трата начинает новый. */
function newCardState(){ return { debt:0, cycleStart:null, deadline:null }; }
function cardApplyPayment(cs, amt, dateISO, cycles){
  if(!amt) return;
  cs.debt -= amt;
  if(cs.debt<=0.5){
    cs.debt = 0;
    if(cs.cycleStart && cycles){
      for(var i=0;i<cycles.length;i++){ if(cycles[i].start===cs.cycleStart && !cycles[i].closed){ cycles[i].closed = dateISO; break; } }
    }
    cs.cycleStart = null; cs.deadline = null;
  }
}
function cardApplyOp(cs, card, op, cycles){
  var amt = Math.abs(op.amount||0);
  if(!amt) return;
  if(op.kind==='payment'){ cardApplyPayment(cs, amt, op.date, cycles); return; }
  if(cs.debt<=0.5){
    cs.debt = 0;
    cs.cycleStart = op.date;
    cs.deadline = addDaysISO(op.date, (card.graceDays!=null && !isNaN(card.graceDays)) ? card.graceDays : 60);
    if(cycles) cycles.push({ start:cs.cycleStart, deadline:cs.deadline, closed:null });
  }
  cs.debt += amt;
}
function snapshotDebtPayments(st, pid, row){
  if(!st.debts || !row) return;
  var po = st.debts.paymentOverrides;
  Object.keys(row.debtPayments||{}).forEach(function(cid){
    if(!po[pid]) po[pid] = {};
    if(po[pid][cid]===undefined) po[pid][cid] = Math.round(row.debtPayments[cid]);
  });
}

/* ============ simulation / waterfall ============ */
function simulate(st){
  var periods = st.periods.slice().sort(function(a,b){ return a.date<b.date?-1:1; });
  var goalSaved = {};
  st.goals.forEach(function(g){ goalSaved[g.id]=g.startingBalance||0; });

  /* phase tracking: per goal, which milestone is currently active and how much has been
     credited toward it since it started (see comment above goalMilestones). */
  var phaseIdx={}, phaseSaved={}, milestoneDates={}, msByGoal={};
  st.goals.forEach(function(g){
    var ms = goalMilestones(g);
    msByGoal[g.id]=ms;
    milestoneDates[g.id]=ms.map(function(){ return null; });
    phaseIdx[g.id]=0;
    phaseSaved[g.id]=g.startingBalance||0;
    while(phaseIdx[g.id]<ms.length && phaseSaved[g.id] >= ms[phaseIdx[g.id]].target-1e-9){
      phaseSaved[g.id]-=ms[phaseIdx[g.id]].target;
      milestoneDates[g.id][phaseIdx[g.id]]='pre';
      phaseIdx[g.id]++;
    }
  });
  function depositToGoal(gid, amount, dateISO){
    if(!amount) return;
    var ms = msByGoal[gid];
    if(!ms) return;
    goalSaved[gid]=(goalSaved[gid]||0)+amount;
    phaseSaved[gid]=(phaseSaved[gid]||0)+amount;
    while(phaseIdx[gid]<ms.length && phaseSaved[gid] >= ms[phaseIdx[gid]].target-1e-9){
      phaseSaved[gid]-=ms[phaseIdx[gid]].target;
      milestoneDates[gid][phaseIdx[gid]]=dateISO;
      phaseIdx[gid]++;
    }
  }

  /* Траты (amount > 0) и переводы из других копилок (amount < 0) применяются в порядке дат:
     всё, что случилось после предыдущей выплаты и не позже текущей, учитывается на дату текущей
     выплаты — до распределения её остатка. Трата 21.04 уменьшает копилку уже на выплату 05.05. */
  var initialPhase = { idx: clone(phaseIdx), saved: clone(phaseSaved) };
  var allWd = [];
  st.goals.forEach(function(g){
    (g.withdrawals||[]).forEach(function(w){ if(w.date) allWd.push({ gid:g.id, date:w.date, amount:w.amount||0 }); });
  });
  allWd.sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); });
  var wdPtr = 0;
  function applyWithdrawalsUpTo(dateISO){
    while(wdPtr<allWd.length && (dateISO===null || allWd[wdPtr].date<=dateISO)){
      var w = allWd[wdPtr++];
      if(w.amount>=0) goalSaved[w.gid]=(goalSaved[w.gid]||0)-w.amount;
      else depositToGoal(w.gid, -w.amount, w.date);
    }
  }

  /* ---- долги ---- */
  var debts = debtsOf(st);
  var instByPeriod = installmentPaymentsByPeriod(st, periods);
  var cards = debts.cards;
  var cardStates = {}, cardCycles = {}, cardOps = {}, cardOpPtr = {};
  cards.forEach(function(c){ cardStates[c.id]=newCardState(); cardCycles[c.id]=[]; cardOps[c.id]=sortedCardOps(c); cardOpPtr[c.id]=0; });
  function applyCardOpsUpTo(dateISO){
    cards.forEach(function(c){
      var ops = cardOps[c.id];
      while(cardOpPtr[c.id]<ops.length && (dateISO===null || ops[cardOpPtr[c.id]].date<=dateISO)){
        cardApplyOp(cardStates[c.id], c, ops[cardOpPtr[c.id]++], cardCycles[c.id]);
      }
    });
  }
  /* сколько останется от каждой выплаты после расходов, рассрочек и уже зафиксированных сумм
     в копилки — для прогноза, хватит ли будущих выплат погасить кредитку в срок */
  var baseFree = {};
  periods.forEach(function(p){
    var inc = (p.incomeActual||0) + vacationPayForPeriod(p, st);
    var exp = categoriesTotalForPeriod(p, st) + (instByPeriod[p.id]||[]).reduce(function(sum,x){ return sum+x.amount; },0);
    var committed = 0, ov = st.savingsOverrides[p.id];
    if(p.locked || (ov && Object.keys(ov).length)) Object.keys(ov||{}).forEach(function(gid){ committed += ov[gid]||0; });
    baseFree[p.id] = inc - exp - committed;
  });
  /* Сколько обязательно заплатить по карте из этой выплаты: равными частями по выплатам до конца
     льготного периода, но не меньше, чем нужно, чтобы остаток (с будущими тратами до срока)
     покрыли следующие выплаты. Если срок уже прошёл или это последняя выплата до срока — весь долг. */
  function cardRequiredPayment(c, cs, p){
    if(cs.debt<=0.5 || !cs.deadline) return 0;
    if(cs.deadline < p.date) return cs.debt;
    var left = periods.filter(function(pp){ return pp.date>=p.date && pp.date<=cs.deadline; });
    if(left.length<=1) return cs.debt;
    var even = cs.debt/left.length;
    var futureFree = 0;
    left.forEach(function(pp){ if(pp.date>p.date) futureFree += Math.max(0, baseFree[pp.id]); });
    var futureNet = 0;
    cardOps[c.id].forEach(function(o){ if(o.date>p.date && o.date<=cs.deadline) futureNet += (o.kind==='payment'?-1:1)*Math.abs(o.amount||0); });
    return Math.min(cs.debt, Math.max(even, cs.debt + futureNet - futureFree));
  }

  var rows=[];
  periods.forEach(function(p){
    var salary = p.incomeActual||0;
    var vac = vacationPayForPeriod(p, st);
    var totalIncome = salary+vac;
    /* сначала расходы по категориям, затем платежи по рассрочке этого периода */
    var categoriesTotal = categoriesTotalForPeriod(p, st);
    var instList = instByPeriod[p.id] || [];
    var installmentsTotal = instList.reduce(function(sum,x){ return sum+x.amount; },0);
    var expenses = categoriesTotal + installmentsTotal;
    applyWithdrawalsUpTo(p.date);
    var free = totalIncome - expenses;
    /* затем кредитки — раньше копилок: по графику, чтобы успеть к концу льготного периода */
    applyCardOpsUpTo(p.date);
    var debtPayments = {}, cardBefore = {};
    var payOv = debts.paymentOverrides[p.id] || {};
    var cardOrder = cards.slice().sort(function(a,b){
      var ka = cardStates[a.id].deadline || '9999-99-99', kb = cardStates[b.id].deadline || '9999-99-99';
      return ka<kb?-1:(ka>kb?1:0);
    });
    cardOrder.forEach(function(c){
      var cs = cardStates[c.id];
      cardBefore[c.id] = { debt: cs.debt, deadline: cs.deadline };
      var pay;
      if(payOv[c.id]!==undefined) pay = Math.min(Math.max(0, payOv[c.id]), cs.debt);
      else if(p.locked) pay = 0;
      else pay = Math.min(cardRequiredPayment(c, cs, p), Math.max(0, free), cs.debt);
      if(pay>0.0001){ debtPayments[c.id] = pay; free -= pay; cardApplyPayment(cs, pay, p.date, cardCycles[c.id]); }
    });
    var allocations = {};
    var override = st.savingsOverrides[p.id];
    /* a locked period never falls through to auto-calc, even if its frozen override is an
       empty object (i.e. "nothing was allocated, and that's the fixed historical fact") */
    if(p.locked || (override && Object.keys(override).length)){
      Object.keys(override||{}).forEach(function(gid){
        var amt = override[gid]||0;
        allocations[gid]=amt; depositToGoal(gid, amt, p.date); free-=amt;
      });
    } else if(free>0){
      var active = st.goals.filter(function(g){ return !g.completed; }).slice().sort(function(a,b){ return a.priority-b.priority; });
      var reqs = active.map(function(g){
        var ms = msByGoal[g.id], idx = phaseIdx[g.id];
        if(idx>=ms.length) return { g:g, remaining:0, per:0, overdue:false, deadline:'' };
        var remaining = Math.max(0, ms[idx].target-phaseSaved[g.id]);
        /* Look past the current milestone if IT has no deadline of its own, to find the nearest
           deadline the goal is really working toward. A goal is funded strictly in order (you
           can't reach "Ира ДР" before "Вика ДР" is paid off), so if an un-dated milestone like
           "Вика ДР" happens to be the one currently active, the OLD code saw no deadline at all
           for the whole goal — even though the very next milestone in the same queue ("Ира ДР")
           has a real, looming deadline. That made the goal look completely unhurried and it lost
           every round to goals with SOME deadline, however distant, so it went unfunded for
           months until "Ира ДР"'s own deadline had already passed. Scanning forward past every
           un-dated milestone to the next dated one (accumulating what each of them still needs
           along the way) gives the goal its true urgency back, while money still lands in the
           current milestone first and only spills into the next one once it's full (depositToGoal
           does that automatically) — so nothing about the funding ORDER within the goal changes,
           only how urgently the goal competes for money against every OTHER goal right now. */
        var lookIdx = idx, combinedNeed = remaining, governingDeadline = ms[idx].deadline || '';
        while(!governingDeadline && lookIdx+1 < ms.length){
          lookIdx++;
          combinedNeed += ms[lookIdx].target||0;
          governingDeadline = ms[lookIdx].deadline || '';
        }
        var periodsLeft = governingDeadline ? periods.filter(function(pp){ return pp.date>=p.date && pp.date<=governingDeadline; }).length : 0;
        var overdue = !!(governingDeadline && governingDeadline < p.date && combinedNeed>0);
        var per = combinedNeed<=0 ? 0 : (governingDeadline ? ((overdue||periodsLeft<=0) ? combinedNeed : combinedNeed/periodsLeft) : 0);
        return { g:g, remaining:remaining, per:per, overdue:overdue, deadline: governingDeadline };
      });
      /* Money goes to whichever goal's CURRENT milestone (subgoal, or the goal itself when it
         has none) has the nearest deadline right now — true earliest-deadline-first — not
         strictly by priority and not by raw required-per-period amount. Sorting by amount alone
         (an earlier version of this code) let one large, moderately-urgent milestone (e.g. a
         315 000 trip due in a few months) permanently out-rank a tiny but much more imminent one
         (e.g. a 3 000 birthday gift due next week), because the big milestone's per-period pace
         is simply bigger in absolute rubles even though it has far more slack. Sorting by the
         deadline itself fixes that: whichever milestone is due soonest is funded first, however
         small, and once it's done the next-soonest (which may belong to the same goal or a
         different one) takes over — so "Подарки"'s small early birthdays get filled first, then
         money temporarily flows past it to "Путешествия"/"Оплата зала" until its own next
         birthday's deadline is nearer again. A higher-priority goal is still protected: as its
         own deadline gets closer than everything else competing for the same money, it moves to
         the front of this same sort automatically. Priority only breaks ties — equal deadlines,
         or goals with no deadline at all (those always sort after every dated one). */
      var urgencyOrder = reqs.slice().sort(function(a,b){
        var ka = a.deadline || '9999-99-99', kb = b.deadline || '9999-99-99';
        if(ka!==kb) return ka<kb?-1:1;
        return a.g.priority-b.g.priority;
      });
      urgencyOrder.forEach(function(r){
        if(free<=0) return;
        var give = Math.min(r.per, free, r.remaining);
        if(give>0.0001){ allocations[r.g.id]=(allocations[r.g.id]||0)+give; depositToGoal(r.g.id, give, p.date); free-=give; }
      });
      /* leftover cash cascades down the same urgency order, but each goal is capped at what its
         active milestone still needs — once a goal's target is met it is skipped, so money
         no longer keeps piling into it past 100% (this was the "95 000 / 60 000" bug). */
      if(free>0.5 && urgencyOrder.length){
        for(var i=0;i<urgencyOrder.length && free>0.5;i++){
          var g = urgencyOrder[i].g, ms = msByGoal[g.id], idx = phaseIdx[g.id];
          if(idx>=ms.length) continue;
          var remaining = Math.max(0, ms[idx].target-phaseSaved[g.id]);
          if(remaining<=0) continue;
          var give = Math.min(remaining, free);
          if(give>0.0001){ allocations[g.id]=(allocations[g.id]||0)+give; depositToGoal(g.id, give, p.date); free-=give; }
        }
      }
    }
    /* что осталось после копилок — досрочно в кредитку */
    if(!p.locked && free>0.5){
      cardOrder.forEach(function(c){
        if(free<=0.5 || payOv[c.id]!==undefined) return;
        var cs = cardStates[c.id];
        var extra = Math.min(cs.debt, free);
        if(extra>0.0001){ debtPayments[c.id] = (debtPayments[c.id]||0)+extra; free -= extra; cardApplyPayment(cs, extra, p.date, cardCycles[c.id]); }
      });
    }
    rows.push({ period:p, salary:salary, vacationPay:vac, totalIncome:totalIncome, expenses:expenses,
      categoriesTotal: categoriesTotal, installments: instList, installmentsTotal: installmentsTotal,
      debtPayments: debtPayments, cardBefore: cardBefore, cardState: clone(cardStates),
      free: totalIncome-expenses, unallocated: free, allocations: allocations, goalSnapshot: clone(goalSaved),
      phaseSnapshot: { idx: clone(phaseIdx), saved: clone(phaseSaved) } });
  });
  applyWithdrawalsUpTo(null);
  applyCardOpsUpTo(null);
  return { rows: rows, finalGoalSaved: goalSaved, milestoneDates: milestoneDates, finalPhaseIdx: phaseIdx, finalPhaseSaved: phaseSaved, initialPhase: initialPhase,
    cardCycles: cardCycles, planEnd: periods.length ? periods[periods.length-1].date : '' };
}

/* ============ состояние копилок на дату ============ */
/* последняя выплата не позже даты (или null) */
function lastRowAtOrBefore(sim, dateISO){
  var found = null;
  sim.rows.forEach(function(r){ if(r.period.date<=dateISO) found = r; });
  return found;
}
/* сколько денег в копилке на дату: баланс после последней выплаты ≤ даты
   плюс/минус траты и переводы, случившиеся после неё и не позже даты */
function goalBalanceAt(g, sim, dateISO){
  var row = lastRowAtOrBefore(sim, dateISO);
  var bal = row ? (row.goalSnapshot[g.id]||0) : (g.startingBalance||0);
  var after = row ? row.period.date : '';
  (g.withdrawals||[]).forEach(function(w){
    if(w.date && w.date>after && w.date<=dateISO) bal -= (w.amount||0);
  });
  return bal;
}
/* сколько цели ещё не хватает до общей суммы на дату, и ближайший срок её незакрытых этапов */
function goalNeedAt(g, sim, dateISO){
  var ms = goalMilestones(g);
  var row = lastRowAtOrBefore(sim, dateISO);
  var ph = row ? row.phaseSnapshot : sim.initialPhase;
  var idx = (ph.idx[g.id]||0), saved = (ph.saved[g.id]||0);
  var progress = 0;
  for(var i=0;i<idx && i<ms.length;i++) progress += ms[i].target||0;
  if(idx<ms.length) progress += saved;
  var after = row ? row.period.date : '';
  (g.withdrawals||[]).forEach(function(w){
    if(w.date && w.amount<0 && w.date>after && w.date<=dateISO) progress += -w.amount;
  });
  var deadline = '';
  for(var j=idx;j<ms.length;j++){ if(ms[j].deadline){ deadline = ms[j].deadline; break; } }
  return { need: Math.max(0, goalFinalTarget(g)-progress), deadline: deadline };
}

/* долг по карте на дату: состояние после последней выплаты ≤ даты + операции после неё */
function cardStateAt(card, sim, dateISO){
  var row = lastRowAtOrBefore(sim, dateISO);
  var cs = (row && row.cardState && row.cardState[card.id]) ? clone(row.cardState[card.id]) : newCardState();
  var after = row ? row.period.date : '';
  sortedCardOps(card).forEach(function(o){ if(o.date>after && o.date<=dateISO) cardApplyOp(cs, card, o, null); });
  return cs;
}
function cardForecast(card, sim, dateISO){
  var cs = cardStateAt(card, sim, dateISO);
  var cyc = null;
  if(cs.debt>0.5){
    ((sim.cardCycles && sim.cardCycles[card.id]) || []).forEach(function(c){ if(c.start===cs.cycleStart) cyc = c; });
  }
  return { state:cs, cycle:cyc };
}
function cardCycleStatus(cy, planEnd){
  if(cy.closed) return cy.closed<=cy.deadline ? { label:'в срок', cls:'ok' } : { label:'позже срока', cls:'danger' };
  if(planEnd && cy.deadline>planEnd) return { label:'срок за пределами плана', cls:'warn' };
  return { label:'не погашен к сроку', cls:'danger' };
}
function cardStatusPill(fc, sim){
  if(fc.state.debt<=0.5) return { label:'Долга нет', cls:'ok' };
  var c = fc.cycle;
  if(c && c.closed){
    if(c.closed<=c.deadline) return { label:'Прогноз: закроется '+ruDate(c.closed)+' — в срок', cls:'ok' };
    return { label:'Прогноз: закроется '+ruDate(c.closed)+' — позже срока '+ruDate(c.deadline), cls:'danger' };
  }
  if(sim.planEnd && fc.state.deadline && fc.state.deadline>sim.planEnd) return { label:'Срок '+ruDate(fc.state.deadline)+' за пределами плана — добавьте следующий год', cls:'warn' };
  return { label:'Не успевает закрыться до '+ruDate(fc.state.deadline), cls:'danger' };
}

/* ============ нормализация состояния перед отрисовкой ============ */
/* подцели всегда идут по сроку закрытия: раньше срок — выше; без срока — в конце */
function sortSubgoalsByDeadline(st){
  var changed = false;
  st.goals.forEach(function(g){
    if(!g.subgoals || g.subgoals.length<2) return;
    var sorted = g.subgoals.slice().sort(function(a,b){
      var ka = a.deadline || '9999-99-99', kb = b.deadline || '9999-99-99';
      return ka<kb?-1:(ka>kb?1:0);
    });
    for(var i=0;i<sorted.length;i++){ if(sorted[i]!==g.subgoals[i]){ changed = true; break; } }
    if(changed) g.subgoals = sorted;
  });
  return changed;
}
/* стандартные праздники больше не хранятся в списке: чистим то, что было записано раньше */
function pruneStandardHolidays(st){
  var before = st.meta.holidays.length;
  st.meta.holidays = st.meta.holidays.filter(function(d){ return !isStandardHoliday(d); });
  return st.meta.holidays.length !== before;
}
function sortOkladHistory(st){
  var sorted = sortedOkladHistory(st);
  for(var i=0;i<sorted.length;i++){
    if(sorted[i]!==st.oklad.history[i]){ st.oklad.history = sorted; return true; }
  }
  return false;
}
function sortInstallmentPayments(st){
  var changed = false;
  debtsOf(st).installments.forEach(function(inst){
    if(!inst.payments || inst.payments.length<2) return;
    var sorted = inst.payments.slice().sort(function(a,b){
      var ka = a.date || '9999-99-99', kb = b.date || '9999-99-99';
      return ka<kb?-1:(ka>kb?1:0);
    });
    for(var i=0;i<sorted.length;i++){ if(sorted[i]!==inst.payments[i]){ inst.payments = sorted; changed = true; break; } }
  });
  return changed;
}
/* месяцы 2026 года, за которые на вкладке «Доходы» есть и аванс, и зарплата: {месяц: сумма} */
function income2026FromPeriods(st){
  var acc = {};
  st.periods.forEach(function(p){
    if(p.monthRef.y!==2026) return;
    var a = acc[p.monthRef.m] || (acc[p.monthRef.m] = { sum:0, first:false, second:false });
    a.sum += p.incomeActual||0;
    a[p.half] = true;
  });
  var out = {};
  Object.keys(acc).forEach(function(m){ if(acc[m].first && acc[m].second) out[m] = acc[m].sum; });
  return out;
}
/* переносим сумму периодов в «Доходы за 2026 год»; если периоды потом удалят,
   в поле останется последнее перенесённое значение, и его снова можно править */
function syncIncome2026(st){
  var fromP = income2026FromPeriods(st), changed = false;
  Object.keys(fromP).forEach(function(m){
    var i = parseInt(m,10)-1;
    if(st.income2026[i]!==fromP[m]){ st.income2026[i] = fromP[m]; changed = true; }
  });
  return changed;
}

/* ============ перераспределение остатка закрытой цели ============ */
var redistDraft = null;
/* Предложение: деньги получают незакрытые цели в порядке срочности (ближайший срок
   незакрытого этапа — первой; без срока — после всех, между собой по приоритету),
   каждая — не больше, чем ей ещё не хватает до общей суммы. Лишнее остаётся в копилке. */
function proposeRedistribution(closedGoal, balance, dateISO, st, sim){
  var cands = st.goals.filter(function(g){ return g.id!==closedGoal.id && !g.completed; }).map(function(g){
    var n = goalNeedAt(g, sim, dateISO);
    return { g:g, need:n.need, deadline:n.deadline };
  });
  cands.sort(function(a,b){
    var ka = a.deadline || '9999-99-99', kb = b.deadline || '9999-99-99';
    if(ka!==kb) return ka<kb?-1:1;
    return a.g.priority-b.g.priority;
  });
  var left = Math.round(balance);
  return cands.map(function(c){
    var give = Math.max(0, Math.min(left, Math.round(c.need)));
    left -= give;
    return { goalId:c.g.id, name:c.g.name, need:Math.round(c.need), deadline:c.deadline, amount:give };
  });
}
function openRedistribution(goalId){
  var g = findGoal(goalId);
  if(!g) return;
  var sim = simulate(state);
  var d = todayISO();
  var bal = Math.round(goalBalanceAt(g, sim, d));
  if(bal<=0) return;
  redistDraft = { goalId:g.id, goalName:g.name, balance:bal, date:d, rows: proposeRedistribution(g, bal, d, state, sim) };
  render();
}
function redistTotals(){
  var total = redistDraft.rows.reduce(function(s,r){ return s+(r.amount||0); },0);
  return { total: total, left: redistDraft.balance-total };
}
function renderRedistModal(){
  if(!redistDraft) return '';
  var d = redistDraft, t = redistTotals();
  var rows = d.rows.map(function(r,i){
    var hint = (r.need>0 ? 'не хватает '+fmt(r.need) : 'сумма уже набрана') + (r.deadline ? ', срок '+ruDate(r.deadline) : ', без срока');
    return '<div class="redist-row"><div><b>'+esc(r.name)+'</b><div class="hint">'+hint+'</div></div>'
      + '<input type="text" inputmode="numeric" class="num" data-redist-amount data-idx="'+i+'" value="'+r.amount+'"></div>';
  }).join('');
  return '<div class="modal-backdrop"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="redist-title">'
    + '<h2 id="redist-title" style="font-size:17px;">Остаток в копилке «'+esc(d.goalName)+'»</h2>'
    + '<p class="muted" style="margin:4px 0 12px;">На '+ruDate(d.date)+' в копилке <b class="num" style="color:var(--ink);">'+fmt(d.balance)+'</b>. '
    + 'Предлагаю перевести их в другие цели — сначала в те, у которых срок ближе, и не больше, чем каждой не хватает. Суммы можно поменять.</p>'
    + (d.rows.length ? rows : '<div class="muted">Нет других незакрытых целей.</div>')
    + '<div class="row wrap" style="gap:8px;margin-top:12px;"><div style="flex:1;min-width:160px;"><label>Дата перевода</label><input type="date" data-redist-date value="'+esc(d.date)+'"></div></div>'
    + '<div id="redist-summary" style="margin-top:10px;font-size:13px;">'+redistSummaryHtml(t)+'</div>'
    + '<div class="row wrap" style="gap:8px;margin-top:14px;justify-content:flex-end;">'
    + '<button class="small" data-redist-cancel>Оставить в копилке</button>'
    + '<button class="primary small" data-redist-apply'+((t.left<0||t.total<=0)?' disabled':'')+'>Перевести '+fmt(t.total)+'</button>'
    + '</div></div></div>';
}
function redistSummaryHtml(t){
  if(t.left<0) return '<span style="color:var(--danger);">Распределено больше, чем есть в копилке, на '+fmt(-t.left)+'</span>';
  return 'Распределено: <b class="num">'+fmt(t.total)+'</b>' + (t.left>0 ? ' · останется в копилке: <b class="num">'+fmt(t.left)+'</b>' : '');
}
function applyRedistribution(){
  var d = redistDraft, t = redistTotals();
  if(!d || t.left<0 || t.total<=0) return;
  var src = findGoal(d.goalId);
  if(!src) { redistDraft = null; return; }
  if(!src.withdrawals) src.withdrawals = [];
  src.withdrawals.push({ date:d.date, amount:t.total, note:'Перераспределение остатка в другие цели', label:'Перераспределение остатка в другие цели' });
  d.rows.forEach(function(r){
    if(!(r.amount>0)) return;
    var g = findGoal(r.goalId);
    if(!g) return;
    if(!g.withdrawals) g.withdrawals = [];
    /* пополнение хранится как «трата» с отрицательной суммой */
    g.withdrawals.push({ date:d.date, amount:-r.amount, note:'Перевод из «'+d.goalName+'»', label:'Перевод из «'+d.goalName+'»' });
  });
  redistDraft = null;
}

/* ============ formatting ============ */
function fmt(n){ n=Math.round(n||0); return n.toLocaleString('ru-RU')+' ₽'; }
function fmtSigned(n){ n=Math.round(n||0); return (n>=0?'+':'')+fmt(n); }
function parseNum(v){ var n=parseFloat(String(v).replace(/[^\d.-]/g,'')); return isNaN(n)?0:Math.round(n); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,function(c){ return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]; }); }
function ruDate(iso){
  if(!iso) return '';
  var parts = iso.split('-'); if(parts.length<3) return iso;
  return parts[2]+'.'+parts[1]+'.'+parts[0];
}

/* ---------- обзор → «Доход за год»: по календарным месяцам выплат ---------- */
/* Налог считается нарастающим итогом с начала года, поэтому в одном месяце может быть
   сразу две ставки: часть дохода добирает прежний порог, часть уходит в следующий. */
function taxSlices(cumBefore, gross, brackets){
  var sorted = brackets.slice().sort(function(a,b){ return ndflBracketTop(a)-ndflBracketTop(b); });
  var out = [], prev = 0, from = cumBefore, to = cumBefore + gross;
  sorted.forEach(function(b){
    var top = ndflBracketTop(b);
    var sStart = Math.max(from, prev), sEnd = Math.min(to, top);
    if(sEnd > sStart) out.push({ rate:b.rate, base:sEnd-sStart, tax:Math.round((sEnd-sStart)*b.rate) });
    prev = top;
  });
  return out;
}
/* Месяц — тот, за который начислено: строка месяца = его аванс + его зарплата.
   НДФЛ при этом считается по порядку дат выплат и нарастающим итогом за календарный год. */
function annualIncomeByMonth(st, year){
  var periods = st.periods.slice().sort(function(a,b){ return a.date<b.date?-1:(a.date>b.date?1:0); });
  var br = st.ndfl.brackets, cum = 0, cumYear = null, months = {};
  periods.forEach(function(p){
    var payYear = p.date.slice(0,4);
    if(payYear!==cumYear){ cum = 0; cumYear = payYear; }
    var vac = vacationPayForPeriod(p, st);
    var net = (p.incomeActual||0) + vac;
    var gross = net>0 ? Math.round(grossFromNet(net, cum, br)) : 0;
    var slices = gross>0 ? taxSlices(cum, gross, br) : [];
    var tax = slices.reduce(function(sum,x){ return sum+x.tax; },0);
    cum += gross;
    if(p.monthRef.y!==year) return;
    var m = p.monthRef.m;
    var e = months[m] || (months[m] = { m:m, gross:0, net:0, tax:0, vac:0, avans:0, zp:0, rates:{}, payouts:[] });
    e.gross += gross; e.net += net; e.tax += tax; e.vac += vac;
    if(p.half==='first') e.avans += net; else e.zp += net;
    slices.forEach(function(x){ e.rates[x.rate] = (e.rates[x.rate]||0) + x.tax; });
    e.payouts.push({ date:p.date, type:p.type, net:(p.incomeActual||0), vac:vac });
  });
  return Object.keys(months).map(function(k){ return months[k]; }).sort(function(a,b){ return a.m-b.m; });
}
function renderDashIncome(year){
  if(year==null) return '';
  var rows = annualIncomeByMonth(state, year);
  var tot = { gross:0, net:0, tax:0, vac:0, rates:{} };

    tot.gross+=r.gross; tot.net+=r.net; tot.tax+=r.tax; tot.vac+=r.vac;
    Object.keys(r.rates).forEach(function(k){ tot.rates[k] = (tot.rates[k]||0)+r.rates[k]; });
  });
  function rateCell(rates){
    var keys = Object.keys(rates).sort(function(a,b){ return a-b; });
    if(!keys.length) return '—';
    return keys.map(function(k){ return Math.round(k*100)+'%'; }).join(' + ');

  function rateNote(rates){
    var keys = Object.keys(rates).sort(function(a,b){ return a-b; });
    if(keys.length<2) return '';
    return '<div class="small-note" style="margin:0;">'+keys.map(function(k){ return Math.round(k*100)+'% — '+fmt(rates[k]); }).join(' · ')+'</div>';
  }
  var totAvans = 0, totZp = 0;
  rows.forEach(function(r){ totAvans += r.avans; totZp += r.zp; });
  var body = rows.map(function(r){
    var payouts = r.payouts.map(function(x){
      return (x.type==='avans'?'аванс':'зарплата')+' '+ruDate(x.date).slice(0,5)+' · '+fmt(x.net)+(x.vac?' + отпускные '+fmt(x.vac):'');
    }).join('; ');
    return '<tr><td>'+MONTH_NAMES[r.m]
      + '<div class="small-note" style="margin:0;">'+esc(payouts)+'</div></td>'
      + '<td class="num">'+fmt(r.avans)+'</td>'
      + '<td class="num">'+fmt(r.zp)+'</td>'
      + '<td class="num">'+fmt(r.gross)+'</td>'
      + '<td class="num">'+rateCell(r.rates)+rateNote(r.rates)+'</td>'
      + '<td class="num">'+fmt(r.tax)+'</td>'
      + '<td class="num"><b>'+fmt(r.net)+'</b></td></tr>';
  }).join('');
  return '<div class="card"><div class="card-title"><h2 style="font-size:16px;">Доход по месяцам '+year+'</h2></div>'
    + '<div class="info-box" style="margin-bottom:12px;">Месяц — тот, за который начислено: в строке месяца стоят его аванс и его зарплата, даже если зарплата пришла 5-го числа следующего месяца. В суммы включены отпускные. «Начислено» — сумма до вычета НДФЛ: она восстанавливается из «на руки» по шкале налога, потому что налог считается нарастающим итогом за календарный год выплат. Если в месяце сработали две ставки, показаны обе и налог по каждой.</div>'
    + (rows.length
        ? '<div class="table-scroll"><table><tr><th>Месяц</th><th class="num">Аванс</th><th class="num">Зарплата</th><th class="num">Начислено (gross)</th><th class="num">Ставка НДФЛ</th><th class="num">НДФЛ</th><th class="num">На руки</th></tr>'
          + body
          + '<tr><td><b>Итого за год</b>'+(tot.vac?'<div class="small-note" style="margin:0;">в том числе отпускные '+fmt(tot.vac)+'</div>':'')+'</td>'
          + '<td class="num"><b>'+fmt(totAvans)+'</b></td>'
          + '<td class="num"><b>'+fmt(totZp)+'</b></td>'
          + '<td class="num"><b>'+fmt(tot.gross)+'</b></td>'
          + '<td class="num">'+rateCell(tot.rates)+rateNote(tot.rates)+'</td>'
          + '<td class="num"><b>'+fmt(tot.tax)+'</b></td>'
          + '<td class="num"><b>'+fmt(tot.net)+'</b></td></tr>'
          + '</table></div>'
        : '<div class="muted" style="font-size:13px;">В '+year+' году выплат нет.</div>')
    + '</div>';
}

/* ---------- обзор → «Расходы за год» ---------- */
function annualExpenses(st, sim, year){
  var rows = sim.rows.filter(function(r){ return r.period.monthRef.y===year; });
  var byPeriod = {};
  rows.forEach(function(r){ byPeriod[r.period.id] = r; });
  var cats = st.categories.map(function(c){ return { name:c.name, amount:0, fact: actualYearAmount(st, year, c) }; });
  var planIds = {};
  st.categories.forEach(function(c){ planIds[c.id] = true; });
  factYearCategoryIds(st, year).forEach(function(cid){
    if(planIds[cid]) return;
    var sum = actualYearSumById(st, year, cid);
    if(sum>0) cats.push({ name:(storedCategoryName(st, year, cid) || cid)+' (нет в плане)', amount:0, fact:sum });
  });
  rows.forEach(function(r){
    var ov = st.categoryOverrides[r.period.id];
    st.categories.forEach(function(c,i){
      var planned = categoryPlannedTotalForDate(c, r.period.date);
      cats[i].amount += (ov && ov[c.id]!==undefined) ? ov[c.id] : planned;
    });
  });
  /* рассрочки — по покупкам, но только те платежи, которые платятся из выплат этого года */
  var instTotal = 0;
  debtsOf(st).installments.forEach(function(inst){
    (inst.payments||[]).forEach(function(pay){
      if(!pay.date || !(pay.amount>0)) return;
      var row = payoutRowForDate(pay.date, sim);
      if(row && byPeriod[row.period.id]) instTotal += pay.amount;
    });
  });
  var cardTotal = 0;
  rows.forEach(function(r){ cardTotal += sumValues(r.debtPayments); });
  cardTotal = Math.round(cardTotal);
  var goalSpends = [];
  st.goals.forEach(function(g){
    var sum = 0;
    (g.withdrawals||[]).forEach(function(wd){
      if(wd.date && (wd.amount||0)>0 && wd.date.slice(0,4)===String(year)) sum += wd.amount;
    });
    if(sum>0) goalSpends.push({ name:g.name, amount:sum });
  });
  return { cats:cats, instTotal:instTotal, cardTotal:cardTotal, goalSpends:goalSpends };
}

        }).join('')
      + '<tr class="'+factRowClass(total, factTotal, factTotal>0)+'"><td><b>Итого</b></td>'+pctCell(total)
      + '<td class="num"><b>'+fmt(total)+'</b></td>'

    + catBlock(data.cats, catTotal)
    + '<h3 style="font-size:14px;margin:14px 0 6px;">Долги</h3>'
    + (instTotal>0 || cardTotal>0
        ? '<table>'
